    }
    const ctx = canvas.getContext("2d", { alpha: false });
    const viewport = document.getElementById("viewport");
    const hudEnergy = document.getElementById("hudEnergy");
    const hudMotion = document.getElementById("hudMotion");
    const telEnergy = document.getElementById("telEnergy");
    const telPeople = document.getElementById("telPeople");
    const telExpr = document.getElementById("telExpr");
    const telMotion = document.getElementById("telMotion");
    const meterEnergy = document.getElementById("meterEnergy");
    const meterMotion = document.getElementById("meterMotion");
    const chipCapture = document.getElementById("chipCapture");
    const chipCaptureVal = document.getElementById("chipCaptureVal");
    const chipMemories = document.getElementById("chipMemories");
    const chipMemoriesVal = document.getElementById("chipMemoriesVal");
    const footerStatus = document.getElementById("footerStatus");
    const footerClock = document.getElementById("footerClock");
    const statusLed = document.getElementById("statusLed");
    const memoryRack = document.getElementById("memoryRack");
    const memoryDial = document.getElementById("memoryDial");
    const memoryDialStrip = document.getElementById("memoryDialStrip");
    const memoryBalls = document.getElementById("memoryBalls");

    let dialScrollY = 0;
    let dialDragging = false;
    let dialPointerId = null;
    let dialDragStartY = 0;
    let dialDragStartScroll = 0;

    const GIF_WORKER_URL = "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js";
    if (typeof GIF !== "undefined") GIF.workerScript = GIF_WORKER_URL;
    const GIF_OUT_WIDTH = 120;
    const GIF_OUT_HEIGHT = 90;
    const GIF_DELAY_MS = 90;
    const GIF_ENCODE_TIMEOUT_MS = 8000;
    const CAPTURE_WATCHDOG_MS = 4500;
    const PRE_BUFFER_MS = 1400;
    const POST_CAPTURE_MS = 2000;
    const FRAME_SAMPLE_MS = 100;
    const MEMORY_COOLDOWN_MS = 5000;
    const PEAK_SUSTAIN_MS = 400;
    const PRE_BUFFER_FRAMES = Math.ceil(PRE_BUFFER_MS / FRAME_SAMPLE_MS);
    const POST_BUFFER_FRAMES = Math.ceil(POST_CAPTURE_MS / FRAME_SAMPLE_MS);

    let frameRing = [];
    let lastFrameSampleAt = 0;
    let captureBusy = false;
    let captureFinalizing = false;
    let captureBusyFrames = null;
    let captureEndsAt = 0;
    let captureDrainTimer = null;
    let captureWatchdogTimer = null;
    let peakArmed = true;
    let wasAtPeak = false;
    let peakSustainStart = 0;
    let peakEpisodeCaptured = false;
    let lastMemoryAt = 0;
    let pendingCaptureMood = "happy";

    const video = document.getElementById("video");
    const offscreen = document.createElement("canvas");
    const offCtx = offscreen.getContext("2d", { willReadFrequently: true });

    let displayW = 0;
    let displayH = 0;
    const MAX_PROCESS_WIDTH = 400;
    const DETECTION_INTERVAL_MS = 160;
    const UI_UPDATE_EVERY_N_FRAMES = 2;
    let uiUpdateFrame = 0;
    let bgLUT = [];
    let coolLUT = [];
    let hotLUT = [];
    let activeLUT = [];
    let detectionTimer = null;
    let lutLogged = false;
    let lastLutEnergy = -1;
    let lastFaceBox = null;
    let liveFace = null;
    let faceDetectVersion = 0;
    let consumedFaceVersion = -1;
    let modelsReady = false;
    let moveLevel = 0;
    let moveLevelDisplay = 0;
    let trailHeat = 0;
    let prevLumaFrame = new Float32Array(0);
    let motionEmber = new Float32Array(0);
    let motionEmberTmp = new Float32Array(0);
    let motionSpeedEmber = new Float32Array(0);
    let motionSpeedEmberTmp = new Float32Array(0);

    const detectCanvas = document.createElement("canvas");
    detectCanvas.width = 224;
    detectCanvas.height = 168;
    const detectCtx = detectCanvas.getContext("2d", { willReadFrequently: true });

    const expressionScores = {
      happy: 1.0,
      surprised: 0.85,
      neutral: 0.4,
      fearful: 0.3,
      angry: 0.2,
      disgusted: 0.15,
      sad: 0.1
    };

    const coolPalette = [
      { l: 0,   r: 0,   g: 0,   b: 0   },
      { l: 55,  r: 2,   g: 8,   b: 28  },
      { l: 95,  r: 8,   g: 22,  b: 52  },
      { l: 130, r: 32,  g: 8,   b: 90  },
      { l: 165, r: 104, g: 8,   b: 120 },
      { l: 200, r: 175, g: 22,  b: 85  },
      { l: 230, r: 220, g: 80,  b: 20  },
      { l: 255, r: 255, g: 205, b: 70  }
    ];

    const hotPalette = [
      { l: 0,   r: 0,   g: 0,   b: 0   },
      { l: 55,  r: 2,   g: 10,  b: 24  },
      { l: 95,  r: 10,  g: 26,  b: 44  },
      { l: 125, r: 58,  g: 8,   b: 80  },
      { l: 155, r: 145, g: 12,  b: 95  },
      { l: 185, r: 215, g: 28,  b: 45  },
      { l: 210, r: 250, g: 95,  b: 0   },
      { l: 230, r: 255, g: 165, b: 0   },
      { l: 245, r: 255, g: 220, b: 40  },
      { l: 255, r: 255, g: 255, b: 255 }
    ];

    const bgPalette = [
      { l: 0,   r: 0,  g: 0,  b: 0  },
      { l: 90,  r: 0,  g: 8,  b: 20 },
      { l: 170, r: 2,  g: 22, b: 40 },
      { l: 255, r: 8,  g: 36, b: 64 }
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function blurEmberField(src, dst, w, h) {
      for (let y = 0; y < h; y += 1) {
        const row = y * w;
        const rowUp = y > 0 ? row - w : row;
        const rowDown = y < h - 1 ? row + w : row;
        for (let x = 0; x < w; x += 1) {
          const p = row + x;
          let sum = src[p] * 0.18;
          let weight = 0.18;
          const add = (idx, wgt) => {
            if (idx >= 0 && idx < w * h) {
              sum += src[idx] * wgt;
              weight += wgt;
            }
          };
          add(p - 1, 0.12);
          add(p + 1, 0.12);
          add(rowUp + x, 0.12);
          add(rowDown + x, 0.12);
          add(rowUp + x - 1, 0.055);
          add(rowUp + x + 1, 0.055);
          add(rowDown + x - 1, 0.055);
          add(rowDown + x + 1, 0.055);
          if (x > 1) add(p - 2, 0.035);
          if (x < w - 2) add(p + 2, 0.035);
          if (y > 1) add(p - w * 2, 0.035);
          if (y < h - 2) add(p + w * 2, 0.035);
          dst[p] = sum / weight;
        }
      }
    }

    function sampleEmberBilinear(field, w, h, fx, fy) {
      const x0 = clamp(Math.floor(fx), 0, w - 1);
      const y0 = clamp(Math.floor(fy), 0, h - 1);
      const x1 = clamp(x0 + 1, 0, w - 1);
      const y1 = clamp(y0 + 1, 0, h - 1);
      const tx = fx - x0;
      const ty = fy - y0;
      const i00 = field[y0 * w + x0];
      const i10 = field[y0 * w + x1];
      const i01 = field[y1 * w + x0];
      const i11 = field[y1 * w + x1];
      const top = lerp(i00, i10, tx);
      const bot = lerp(i01, i11, tx);
      return lerp(top, bot, ty);
    }

    function emberIndexFromPixel(x, y, procW, procH, emberW, emberH) {
      const ex = clamp(Math.floor(((x + 0.5) * emberW) / procW), 0, emberW - 1);
      const ey = clamp(Math.floor(((y + 0.5) * emberH) / procH), 0, emberH - 1);
      return ey * emberW + ex;
    }

    function getBodyTrailBounds(hasFace, cx, cy, rx, ry, faceHeight, procH) {
      if (!hasFace) {
        return { bodyCx: 0, bodyCy: 0, bodyRx: 1, bodyRyUp: 1, bodyRyDown: 1 };
      }
      return {
        bodyCx: cx,
        bodyCy: cy + faceHeight * 0.95,
        bodyRx: Math.max(58, rx * 3.05),
        bodyRyUp: Math.max(70, ry * 1.55),
        bodyRyDown: Math.max(procH * 0.52, ry * 4.2, faceHeight * 2.8)
      };
    }

    function bodyTrailContain(x, y, bounds) {
      const ex = (x - bounds.bodyCx) / bounds.bodyRx;
      const ryEff = y >= bounds.bodyCy ? bounds.bodyRyDown : bounds.bodyRyUp;
      const ey = (y - bounds.bodyCy) / ryEff;
      return clamp(1 - Math.sqrt((ex * ex) + (ey * ey)), 0, 1);
    }

    function moodyTrailRgb(intensity, energy, speedBoost) {
      const local = clamp(intensity, 0, 1);
      const speed = clamp(speedBoost, 0, 1);
      const emotionalWarmth = clamp(energy * 0.05, 0, 0.08);
      // Prioritize per-region speed so trail hue varies by local movement velocity.
      const motionHeat = clamp((local * 0.34) + (speed * 0.98) + emotionalWarmth, 0, 1.12);

      // Slow movement: subtle purple.
      if (motionHeat < 0.3) {
        const u = motionHeat / 0.3;
        return {
          r: Math.round(lerp(34, 86, u)),
          g: Math.round(lerp(6, 14, u)),
          b: Math.round(lerp(146, 138, u))
        };
      }
      // Medium: purple -> magenta/pink.
      if (motionHeat < 0.55) {
        const u = (motionHeat - 0.3) / 0.25;
        return {
          r: Math.round(lerp(86, 206, u)),
          g: Math.round(lerp(14, 22, u)),
          b: Math.round(lerp(138, 106, u))
        };
      }
      // Fast: magenta/pink -> orange.
      if (motionHeat < 0.82) {
        const u = (motionHeat - 0.55) / 0.27;
        return {
          r: Math.round(lerp(206, 255, u)),
          g: Math.round(lerp(22, 126, u)),
          b: Math.round(lerp(106, 18, u))
        };
      }
      // Very fast: orange -> yellow/amber (still no white trails).
      const u = (motionHeat - 0.82) / 0.33;
      return {
        r: 255,
        g: Math.round(lerp(126, 245, u)),
        b: Math.round(lerp(18, 12, u))
      };
    }

    function facePeakColor(expression, heatMix) {
      const t = clamp(heatMix, 0, 1);
      if (expression === "sad") {
        // Sad mode peaks in cyan instead of yellow.
        return {
          r: Math.round(lerp(58, 118, t)),
          g: Math.round(lerp(186, 246, t)),
          b: Math.round(lerp(212, 255, t))
        };
      }
      if (expression === "angry") {
        // Angry mode peaks in red.
        return {
          r: 255,
          g: Math.round(lerp(72, 26, t)),
          b: Math.round(lerp(48, 16, t))
        };
      }
      return {
        r: 255,
        g: Math.round(lerp(200, 238, t)),
        b: Math.round(lerp(55, 115, t))
      };
    }

    function samplePalette(palette, luminance) {
      const value = clamp(luminance, 0, 255);
      for (let i = 0; i < palette.length - 1; i += 1) {
        const a = palette[i];
        const b = palette[i + 1];
        if (value >= a.l && value <= b.l) {
          const t = (value - a.l) / (b.l - a.l || 1);
      return {
            r: Math.round(lerp(a.r, b.r, t)),
            g: Math.round(lerp(a.g, b.g, t)),
            b: Math.round(lerp(a.b, b.b, t))
          };
        }
      }
      const tail = palette[palette.length - 1];
      return { r: tail.r, g: tail.g, b: tail.b };
    }

    function buildFixedLUTFromPalette(palette) {
      const lut = new Array(256);
      for (let i = 0; i < 256; i += 1) {
        lut[i] = samplePalette(palette, i);
      }
      return lut;
    }

    function ensureThermalLUTs() {
      if (!bgLUT.length) bgLUT = buildFixedLUTFromPalette(bgPalette);
      if (!coolLUT.length) coolLUT = buildFixedLUTFromPalette(coolPalette);
      if (!hotLUT.length) hotLUT = buildFixedLUTFromPalette(hotPalette);
      if (!activeLUT.length) rebuildActiveLUT(true);
    }

    function rebuildActiveLUT(force = false) {
      if (!coolLUT.length || !hotLUT.length) ensureThermalLUTs();
      if (!force && Math.abs(energyScore - lastLutEnergy) <= 0.012) return;
      const lut = new Array(256);
      for (let i = 0; i < 256; i += 1) {
        const coolColor = coolLUT[i];
        const hotColor = hotLUT[i];
        lut[i] = {
          r: Math.round(coolColor.r + (hotColor.r - coolColor.r) * energyScore),
          g: Math.round(coolColor.g + (hotColor.g - coolColor.g) * energyScore),
          b: Math.round(coolColor.b + (hotColor.b - coolColor.b) * energyScore)
        };
      }
      activeLUT = lut;
      lastLutEnergy = energyScore;
      if (!lutLogged) {
        console.log("LUT ready");
        lutLogged = true;
      }
    }

    function getCoverTransform(targetW, targetH) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;
      const scale = Math.max(targetW / vw, targetH / vh);
      return {
        scale,
        dx: (targetW - (vw * scale)) / 2,
        dy: (targetH - (vh * scale)) / 2
      };
    }

    function mapDetectBoxToTarget(box, targetW, targetH) {
      if (!box) return null;
      const detectTransform = getCoverTransform(detectCanvas.width, detectCanvas.height);
      const targetTransform = getCoverTransform(targetW, targetH);
      if (!detectTransform || !targetTransform) return null;

      const srcX = (box.x - detectTransform.dx) / detectTransform.scale;
      const srcY = (box.y - detectTransform.dy) / detectTransform.scale;
      const srcW = box.width / detectTransform.scale;
      const srcH = box.height / detectTransform.scale;

      return {
        x: srcX * targetTransform.scale + targetTransform.dx,
        y: srcY * targetTransform.scale + targetTransform.dy,
        width: srcW * targetTransform.scale,
        height: srcH * targetTransform.scale
      };
    }

    let canvasDpr = 1;
    let resizeCanvasTimer = null;
    let dialLayoutTimer = null;

    function isMobileLayout() {
      return window.matchMedia("(max-width: 820px)").matches;
    }

    function resizeCanvases() {
      if (!viewport) return;

      let w = Math.floor(viewport.clientWidth || 0);
      let h = Math.floor(viewport.clientHeight || 0);
      if (w < 16 || h < 16) {
        const rect = viewport.getBoundingClientRect();
        w = Math.max(w, Math.floor(rect.width || 0));
        h = Math.max(h, Math.floor(rect.height || 0));
      }
      if (w < 16 || h < 16) {
        const panel = viewport.parentElement?.getBoundingClientRect();
        const mobile = isMobileLayout();
        w = Math.max(w, Math.floor(panel?.width || 0), mobile ? 280 : 480);
        h = Math.max(h, Math.floor(panel?.height || 0), mobile ? 210 : 360);
        if (mobile) viewport.style.minHeight = "";
        else viewport.style.minHeight = `${h}px`;
      } else {
        viewport.style.minHeight = "";
      }

      displayW = Math.max(16, w);
      displayH = Math.max(16, h);
      canvasDpr = Math.min(window.devicePixelRatio || 1, isMobileLayout() ? 1 : 1.25);
      canvas.width = Math.max(1, Math.floor(displayW * canvasDpr));
      canvas.height = Math.max(1, Math.floor(displayH * canvasDpr));
      canvas.style.width = `${displayW}px`;
      canvas.style.height = `${displayH}px`;
      ctx.setTransform(canvasDpr, 0, 0, canvasDpr, 0, 0);
      ctx.imageSmoothingEnabled = true;

      const procW = Math.max(240, Math.min(MAX_PROCESS_WIDTH, displayW));
      const procH = Math.max(1, Math.round((procW / displayW) * displayH));
      offscreen.width = procW;
      offscreen.height = procH;

      if (!resizeCanvases.logged && displayW >= 16) {
        console.log("viewfinder size", displayW, "x", displayH, "@", canvasDpr.toFixed(1), "dpr");
        resizeCanvases.logged = true;
      }
    }

    function drawMirroredVideoCover(ctx2d, targetW, targetH, clear = true) {
      const transform = getCoverTransform(targetW, targetH);
      if (!transform) {
        ctx2d.fillStyle = "#12141a";
        ctx2d.fillRect(0, 0, targetW, targetH);
        return false;
      }
      if (clear) ctx2d.clearRect(0, 0, targetW, targetH);
      const drawW = video.videoWidth * transform.scale;
      const drawH = video.videoHeight * transform.scale;
      ctx2d.save();
      ctx2d.translate(targetW, 0);
      ctx2d.scale(-1, 1);
      ctx2d.drawImage(video, transform.dx, transform.dy, drawW, drawH);
      ctx2d.restore();
      return true;
    }

    function drawVideoCover() {
      return drawMirroredVideoCover(offCtx, offscreen.width, offscreen.height, false);
    }

    function drawVideoCoverTo(ctx2d, targetW, targetH) {
      return drawMirroredVideoCover(ctx2d, targetW, targetH, true);
    }

    function isEmotionallyNeutral(expressions) {
      if (!expressions) return true;
      const neutral = expressions.neutral || 0;
      const happy = expressions.happy || 0;
      const sad = expressions.sad || 0;
      const surprised = expressions.surprised || 0;
      const angry = expressions.angry || 0;
      const fearful = expressions.fearful || 0;
      const disgusted = expressions.disgusted || 0;
      const emotionPeak = Math.max(happy, sad, surprised, angry, fearful, disgusted);
      if (neutral >= 0.45 && neutral >= emotionPeak + 0.05) return true;
      if (neutral >= 0.38 && neutral >= emotionPeak - 0.02) return true;
      if (emotionPeak < 0.28) return true;
      if (emotionPeak < 0.38 && neutral >= 0.3) return true;
      return false;
    }

    function computePositiveIntensity(expressions) {
      const happy = expressions.happy || 0;
      const surprised = expressions.surprised || 0;
      const neutral = expressions.neutral || 0;
      const sad = expressions.sad || 0;
      const angry = expressions.angry || 0;
      if (isEmotionallyNeutral(expressions)) return 0;
      if (happy < 0.42 && surprised < 0.4) return 0;
      if (neutral > 0.36 && happy < 0.52 && surprised < 0.46) return 0;
      const positiveSignal = (happy * 1.22) + (surprised * 0.88);
      const dampen = (neutral * 0.58) + (sad * 0.12) + (angry * 0.08);
      const raw = positiveSignal - dampen;
      if (raw < 0.22) return 0;
      return clamp(Math.pow(clamp(raw, 0, 1) / 0.98, 0.78), 0, 1);
    }

    function computeSadIntensity(expressions) {
      const sad = expressions.sad || 0;
      const fearful = expressions.fearful || 0;
      const neutral = expressions.neutral || 0;
      const happy = expressions.happy || 0;
      const angry = expressions.angry || 0;
      if (isEmotionallyNeutral(expressions)) return 0;
      if (sad < 0.44 && fearful < 0.4) return 0;
      if (neutral > 0.36 && sad < 0.5 && fearful < 0.44) return 0;
      const sadSignal = (sad * 1.38) + (fearful * 0.48);
      const dampen = (neutral * 0.56) + (happy * 0.16) + (angry * 0.1);
      const raw = sadSignal - dampen;
      if (raw < 0.22) return 0;
      return clamp(Math.pow(clamp(raw, 0, 1) / 0.96, 0.72), 0, 1);
    }

    function computeExpressionIntensity(expressions) {
      if (isEmotionallyNeutral(expressions)) return 0;
      const positive = computePositiveIntensity(expressions);
      const sad = computeSadIntensity(expressions);
      const sadRaw = expressions.sad || 0;
      const neutral = expressions.neutral || 0;
      const useSadPath = moodExpressionStable === "sad"
        && sadRaw > 0.32
        && sadRaw > neutral - 0.05;
      return useSadPath ? Math.max(sad, positive * 0.08) : Math.max(positive, sad * 0.08);
    }

    function getLiveExpression(expressions) {
      if (isEmotionallyNeutral(expressions)) {
        return { name: "neutral", score: expressions.neutral || 0.5 };
      }
      let bestName = "neutral";
      let bestScore = 0;
      const neutralScore = expressions.neutral || 0;
      for (const [name, score] of Object.entries(expressions)) {
        if (score > bestScore) {
          bestName = name;
          bestScore = score;
        }
      }
      if (
        bestName !== "neutral" &&
        neutralScore > bestScore - 0.07 &&
        neutralScore > 0.32
      ) {
        bestName = "neutral";
        bestScore = neutralScore;
      }
      if (bestScore < 0.38) {
        bestName = "neutral";
        bestScore = Math.max(neutralScore, bestScore);
      }
      return { name: bestName, score: bestScore };
    }

    function updateMoodState(expressions) {
      const sadRaw = clamp(expressions?.sad || 0, 0, 1);
      const angryRaw = clamp(expressions?.angry || 0, 0, 1);
      const neutralRaw = clamp(expressions?.neutral || 0, 0, 1);

      const sadTarget = sadRaw > 0.24 ? sadRaw : 0;
      const angryTarget = angryRaw > 0.32 ? angryRaw : 0;

      moodSadLatch = lerp(moodSadLatch, sadTarget, sadTarget > moodSadLatch ? 0.34 : 0.06);
      moodAngryLatch = lerp(moodAngryLatch, angryTarget, angryTarget > moodAngryLatch ? 0.28 : 0.06);

      if (neutralRaw > 0.42 && neutralRaw > sadRaw + 0.1 && neutralRaw > angryRaw + 0.08) {
        moodSadLatch = lerp(moodSadLatch, 0, 0.28);
        moodAngryLatch = lerp(moodAngryLatch, 0, 0.24);
        if (moodSadLatch < 0.28 && moodAngryLatch < 0.28) moodExpressionStable = "neutral";
      }

      if (moodExpressionStable === "sad") {
        if (moodSadLatch < 0.2 && moodAngryLatch > 0.48) moodExpressionStable = "angry";
        else if (moodSadLatch < 0.16) moodExpressionStable = "neutral";
      } else if (moodExpressionStable === "angry") {
        if (moodAngryLatch < 0.2 && moodSadLatch > 0.48) moodExpressionStable = "sad";
        else if (moodAngryLatch < 0.16) moodExpressionStable = "neutral";
      } else {
        if (moodSadLatch > 0.48 && moodSadLatch > moodAngryLatch + 0.08 && sadRaw > 0.34 && sadRaw > neutralRaw - 0.06) {
          moodExpressionStable = "sad";
        } else if (moodAngryLatch > 0.52 && moodAngryLatch > moodSadLatch + 0.08) {
          moodExpressionStable = "angry";
        }
      }
    }

    function updateLiveEnergy() {
      const isSad = moodExpressionStable === "sad";
      const isNeutral = isEmotionallyNeutral(lastExpressions)
        || lastDetection?.expression === "neutral";
      const intensityTarget = isNeutral ? 0 : targetExpressionIntensity;
      const intLerp = intensityTarget > expressionIntensity
        ? (isSad ? 0.3 : 0.24)
        : (isNeutral ? 0.4 : 0.24);
      expressionIntensity = lerp(expressionIntensity, intensityTarget, intLerp);
      if (isNeutral) expressionIntensity = Math.min(expressionIntensity, 0.04);
      const faceLerp = targetFaceScore > faceScore ? 0.28 : 0.1;
      faceScore = lerp(faceScore, targetFaceScore, faceLerp);
      const curvePow = isSad ? 0.72 : 0.78;
      const emotionCurve = Math.pow(clamp(expressionIntensity, 0, 1), curvePow);
      const expressionEnergy = lerp(0.03, 1.0, emotionCurve);
      const nextEnergy = clamp(expressionEnergy, 0, 1);
      const energyLerp = isNeutral
        ? 0.36
        : (nextEnergy > energyScore ? (isSad ? 0.3 : 0.26) : 0.22);
      energyScore = lerp(energyScore, nextEnergy, energyLerp);
      if (isNeutral) energyScore = Math.min(energyScore, 0.22);
      rebuildActiveLUT();
    }

    function moveTowards(value, target, step) {
      if (value < target) return Math.min(value + step, target);
      if (value > target) return Math.max(value - step, target);
      return value;
    }

    function updateClockHands() {
      if (!footerClock) return;
      const now = new Date();
      footerClock.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getEnergyDisplayPercent() {
      return Math.round(clamp(energyScore, 0, 1) * 100);
    }

    function hasStrongEmotionSignal(expressions) {
      if (!expressions || isEmotionallyNeutral(expressions)) return false;
      const happy = expressions.happy || 0;
      const surprised = expressions.surprised || 0;
      const sad = expressions.sad || 0;
      const fearful = expressions.fearful || 0;
      const neutral = expressions.neutral || 0;
      if (moodExpressionStable === "sad") {
        return sad >= 0.44 && sad > happy + 0.08 && sad > neutral - 0.04;
      }
      const peakPositive = Math.max(happy, surprised);
      return peakPositive >= 0.4 && peakPositive > neutral + 0.06;
    }

    function isAtPeakEnergy() {
      if (peopleCount === 0 && !lastFaceBox) return false;
      if (!lastExpressions || isEmotionallyNeutral(lastExpressions)) return false;
      if (!lastDetection || lastDetection.expression === "neutral") return false;
      if (expressionIntensity < 0.78) return false;
      if (!hasStrongEmotionSignal(lastExpressions)) return false;
      if (getEnergyDisplayPercent() < 85) return false;

      const happy = lastExpressions.happy || 0;
      const sad = lastExpressions.sad || 0;
      const surprised = lastExpressions.surprised || 0;
      const neutral = lastExpressions.neutral || 0;

      if (moodExpressionStable === "sad") {
        return sad >= 0.4
          && sad > happy + 0.06
          && moodSadLatch >= 0.52;
      }

      const peakPositive = Math.max(happy, surprised);
      return peakPositive >= 0.42
        && peakPositive > neutral + 0.06
        && (happy >= 0.38 || surprised >= 0.36);
    }

    function getCaptureMood() {
      if (moodExpressionStable === "sad") return "sad";
      const ex = lastExpressions;
      if (ex) {
        const sadI = computeSadIntensity(ex);
        const happyI = computePositiveIntensity(ex);
        if (sadI > happyI + 0.06) return "sad";
      }
      if (moodSadLatch >= 0.52 && moodSadLatch > moodAngryLatch + 0.05) return "sad";
      return "happy";
    }

    function applyBallMood(ball, mood) {
      if (!ball) return;
      const resolved = mood === "sad" ? "sad" : "happy";
      ball.classList.remove("mood-happy", "mood-sad");
      ball.classList.add(resolved === "sad" ? "mood-sad" : "mood-happy");
      ball.dataset.captureMood = resolved;
    }

    function updateInstrumentUI() {
      const hasFace = Boolean(lastDetection);
      const energyPct = getEnergyDisplayPercent();
      const atCore = energyPct >= 100;
      const energyLabel = atCore ? "CORE" : `${energyPct}%`;
      const motionPct = Math.round(clamp(moveLevelDisplay, 0, 1) * 100);
      const exprName = hasFace ? lastDetection.expression.toUpperCase() : "NONE";
      const energyHot = energyPct >= 68 && !atCore;

      if (hudEnergy) {
        hudEnergy.textContent = energyLabel;
        hudEnergy.classList.toggle("is-hot", energyHot);
        hudEnergy.classList.toggle("is-core", atCore);
      }
      if (hudMotion) hudMotion.textContent = `${motionPct}%`;
      if (telEnergy) {
        telEnergy.textContent = energyLabel;
        telEnergy.classList.toggle("is-core", atCore);
        telEnergy.classList.toggle("is-accent", !atCore);
      }
      if (telPeople) telPeople.textContent = String(peopleCount);
      if (telExpr) {
        telExpr.textContent = hasFace
          ? `${exprName} · ${lastDetection.probability.toFixed(2)}`
          : "—";
      }
      if (telMotion) telMotion.textContent = `${motionPct}%`;
      if (meterEnergy) meterEnergy.style.width = atCore ? "100%" : `${energyPct}%`;
      if (meterMotion) meterMotion.style.width = `${motionPct}%`;

      const memoryCount = getDialBallCount();
      const capturing = captureBusy || captureFinalizing;

      if (chipCaptureVal) {
        chipCaptureVal.textContent = capturing ? "REC" : (atCore ? "CORE" : "LIVE");
      }
      if (chipCapture) {
        chipCapture.disabled = capturing;
        chipCapture.classList.toggle("is-live", atCore && !capturing);
        chipCapture.classList.toggle("is-capturing", capturing);
        chipCapture.title = capturing
          ? "Recording core memory…"
          : "Click to save a core memory now";
      }
      if (chipMemoriesVal) chipMemoriesVal.textContent = String(memoryCount);
      if (chipMemories) {
        chipMemories.disabled = memoryCount === 0;
        chipMemories.title = memoryCount
          ? `View memories (${memoryCount}) — click for latest`
          : "No core memories yet — peak joy or sorrow";
      }

      if (statusLed) statusLed.classList.toggle("is-warn", !modelsReady || peopleCount === 0);
    }

    function cloneCanvasSource(source) {
      if (!source?.width || !source?.height) {
        const fallback = document.createElement("canvas");
        fallback.width = 2;
        fallback.height = 2;
        return fallback;
      }
      const copy = document.createElement("canvas");
      copy.width = source.width;
      copy.height = source.height;
      copy.getContext("2d").drawImage(source, 0, 0);
      return copy;
    }

    function cloneFrameCanvas() {
      return cloneCanvasSource(offscreen);
    }

    function pushFrameSample(now) {
      if (now - lastFrameSampleAt < FRAME_SAMPLE_MS) return;
      if (offscreen.width < 1 || offscreen.height < 1) return;
      lastFrameSampleAt = now;
      try {
        frameRing.push(cloneFrameCanvas());
        const ringMax = PRE_BUFFER_FRAMES + POST_BUFFER_FRAMES + 6;
        while (frameRing.length > ringMax) frameRing.shift();
      } catch (error) {
        console.warn("Frame ring sample failed", error);
      }
    }

    function prepareGifFrames(frames) {
      const maxFrames = 16;
      const step = frames.length > maxFrames ? Math.ceil(frames.length / maxFrames) : 1;
      const out = [];
      for (let i = 0; i < frames.length; i += step) {
        const source = frames[i];
        if (!source?.width || !source?.height) continue;
        const canvas = document.createElement("canvas");
        canvas.width = GIF_OUT_WIDTH;
        canvas.height = GIF_OUT_HEIGHT;
        canvas.getContext("2d").drawImage(source, 0, 0, GIF_OUT_WIDTH, GIF_OUT_HEIGHT);
        out.push(canvas);
      }
      if (!out.length) {
        const fallback = cloneFrameCanvas();
        const canvas = document.createElement("canvas");
        canvas.width = GIF_OUT_WIDTH;
        canvas.height = GIF_OUT_HEIGHT;
        canvas.getContext("2d").drawImage(fallback, 0, 0, GIF_OUT_WIDTH, GIF_OUT_HEIGHT);
        out.push(canvas);
      }
      if (out.length === 1) {
        const dup = document.createElement("canvas");
        dup.width = GIF_OUT_WIDTH;
        dup.height = GIF_OUT_HEIGHT;
        dup.getContext("2d").drawImage(out[0], 0, 0);
        out.push(dup);
      }
      return out;
    }

    function frameToPreviewUrl(frame) {
      try {
        if (!frame?.width || !frame?.height) return null;
        const out = document.createElement("canvas");
        out.width = GIF_OUT_WIDTH;
        out.height = GIF_OUT_HEIGHT;
        out.getContext("2d").drawImage(frame, 0, 0, GIF_OUT_WIDTH, GIF_OUT_HEIGHT);
        return out.toDataURL("image/jpeg", 0.88);
      } catch {
        return null;
      }
    }

    function previewFromFrames(frames) {
      if (!frames?.length) return null;
      return (
        frameToPreviewUrl(frames[frames.length - 1]) ||
        frameToPreviewUrl(frames[Math.floor(frames.length / 2)]) ||
        frameToPreviewUrl(frames[0])
      );
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("Failed to read GIF blob"));
        reader.readAsDataURL(blob);
      });
    }

    function isAnimatedGifUrl(url) {
      return typeof url === "string"
        && (url.startsWith("data:image/gif") || url.startsWith("blob:"));
    }

    function revokeBallGifUrl(ball) {
      const prev = ball?.dataset?.gifUrl;
      if (prev && prev.startsWith("blob:")) URL.revokeObjectURL(prev);
    }

    function attachBallCaptureFrames(ball, frames) {
      if (!ball || !frames?.length) return;
      ball._captureFrames = frames.map((frame) => cloneCanvasSource(frame));
      ball._framePreviewUrls = null;
    }

    function getFramePreviewCache(ball) {
      if (!ball?._captureFrames?.length) return [];
      if (ball._framePreviewUrls?.length) return ball._framePreviewUrls;
      ball._framePreviewUrls = ball._captureFrames
        .map((frame) => frameToPreviewUrl(frame))
        .filter(Boolean);
      return ball._framePreviewUrls;
    }

    function stopBallFrameLoop(ball) {
      if (!ball) return;
      if (ball._frameAnimTimer) {
        clearTimeout(ball._frameAnimTimer);
        ball._frameAnimTimer = null;
      }
    }

    function playBallFrameLoop(ball) {
      const img = ball?.querySelector("img");
      const urls = getFramePreviewCache(ball);
      if (!img || urls.length < 2) {
        if (img && urls[0]) img.src = urls[0];
        return;
      }
      stopBallFrameLoop(ball);
      let frameIndex = 0;
      const step = () => {
        if (!ball.classList.contains("is-selected")) return;
        img.src = urls[frameIndex % urls.length];
        frameIndex += 1;
        ball._frameAnimTimer = setTimeout(step, GIF_DELAY_MS);
      };
      step();
    }

    function buildGifFromFrames(frames) {
      return new Promise((resolve, reject) => {
        if (!frames.length) {
          reject(new Error("No frames to encode"));
          return;
        }
        if (typeof GIF === "undefined") {
          reject(new Error("GIF encoder unavailable"));
          return;
        }
        const gifFrames = prepareGifFrames(frames);
        const encode = (workers) => new Promise((res, rej) => {
          const gif = new GIF({
            workers,
            quality: 12,
            workerScript: workers > 0 ? GIF_WORKER_URL : undefined,
            width: GIF_OUT_WIDTH,
            height: GIF_OUT_HEIGHT,
            repeat: 0
          });
          gifFrames.forEach((frame) => {
            gif.addFrame(frame, { copy: true, delay: GIF_DELAY_MS });
          });
          gif.on("finished", (blob) => {
            if (!blob || blob.size < 100) {
              rej(new Error("GIF blob empty"));
              return;
            }
            const typed = blob.type === "image/gif" ? blob : new Blob([blob], { type: "image/gif" });
            res(URL.createObjectURL(typed));
          });
          gif.on("error", (error) => rej(error || new Error("GIF render failed")));
          gif.render();
        });
        encode(0).catch(() => encode(2)).then(resolve).catch(reject);
      });
    }

    function stopCaptureTimers() {
      if (captureDrainTimer) {
        clearInterval(captureDrainTimer);
        captureDrainTimer = null;
      }
      if (captureWatchdogTimer) {
        clearTimeout(captureWatchdogTimer);
        captureWatchdogTimer = null;
      }
    }

    function finishCapture() {
      captureBusy = false;
      captureFinalizing = false;
      captureEndsAt = 0;
      captureBusyFrames = null;
      peakArmed = true;
      wasAtPeak = false;
      peakSustainStart = 0;
      peakEpisodeCaptured = false;
    }

    function tickPeakCapture() {
      const atPeak = isAtPeakEnergy();
      const now = performance.now();

      if (captureBusy || captureFinalizing) {
        wasAtPeak = atPeak;
        return;
      }
      if (!peakArmed) {
        wasAtPeak = atPeak;
        peakSustainStart = 0;
        peakEpisodeCaptured = false;
        return;
      }

      if (atPeak) {
        if (!peakSustainStart) peakSustainStart = now;
        const sustained = now - peakSustainStart >= PEAK_SUSTAIN_MS;
        if (sustained && !peakEpisodeCaptured) {
          peakEpisodeCaptured = true;
          queuePeakMemoryCapture();
        }
        wasAtPeak = sustained;
      } else {
        peakSustainStart = 0;
        peakEpisodeCaptured = false;
        wasAtPeak = false;
      }
    }

    function drainCaptureFrame() {
      try {
        const now = performance.now();
        pushFrameSample(now);
        if (!captureBusy || !captureBusyFrames) return;
        captureBusyFrames.push(cloneFrameCanvas());
        if (now < captureEndsAt) return;
        stopCaptureTimers();
        const frames = captureBusyFrames;
        captureBusyFrames = null;
        finalizeMemoryCapture(frames).catch((error) => {
          console.error("finalizeMemoryCapture failed", error);
          finishCapture();
        });
      } catch (error) {
        console.error("drainCaptureFrame failed", error);
        stopCaptureTimers();
        finalizeMemoryCapture(captureBusyFrames || [cloneFrameCanvas()]).catch(() => {
          finishCapture();
        });
      }
    }

    function updateBallMedia(ball, mediaUrl, posterUrl) {
      if (!ball || !mediaUrl) return;
      const poster = posterUrl || mediaUrl;
      const isGif = isAnimatedGifUrl(mediaUrl);
      revokeBallGifUrl(ball);
      ball.dataset.gifUrl = isGif ? mediaUrl : "";
      ball.dataset.posterUrl = poster;
      ball.dataset.animated = isGif ? "1" : "0";
      ball.dataset.gifReady = "0";
      const img = ball.querySelector("img");
      if (!img) return;
      img.dataset.playing = "0";
      img.removeAttribute("data-active-src");
      if (!ball.classList.contains("is-selected") || !isGif) img.src = poster;
    }

    async function upgradeBallToGif(ball, frames, preview) {
      if (!ball) return;
      ball.dataset.gifEncoding = "1";
      try {
        const encoded = await Promise.race([
          buildGifFromFrames(frames),
          new Promise((_, reject) => {
            setTimeout(() => reject(new Error("GIF encode timeout")), GIF_ENCODE_TIMEOUT_MS);
          })
        ]);
        if (!isAnimatedGifUrl(encoded)) return;
        updateBallMedia(ball, encoded, preview);
        ball.dataset.gifReady = "1";
        if (ball.classList.contains("is-selected")) playBallMemory(ball);
      } catch (error) {
        console.warn("GIF encode failed; using frame playback", error);
        if (ball.classList.contains("is-selected")) playBallMemory(ball);
      } finally {
        delete ball.dataset.gifEncoding;
      }
    }

    async function finalizeMemoryCapture(frames) {
      if (captureFinalizing) {
        console.warn("finalizeMemoryCapture skipped — already finalizing");
        return;
      }
      captureFinalizing = true;
      stopCaptureTimers();
      try {
        const safeFrames = Array.isArray(frames) && frames.length ? frames : [cloneFrameCanvas()];
        const preview = previewFromFrames(safeFrames) || frameToPreviewUrl(safeFrames[safeFrames.length - 1]);
        const ball = addCoreMemoryBall(preview, preview, pendingCaptureMood, safeFrames);
        if (!ball) throw new Error("Failed to add core memory ball");
        if (footerStatus) footerStatus.textContent = "Core memory captured";
        finishCapture();
        upgradeBallToGif(ball, safeFrames, preview || ball.dataset.posterUrl);
      } catch (error) {
        console.error("finalizeMemoryCapture failed", error);
        if (footerStatus) footerStatus.textContent = "Capture failed — try again";
        finishCapture();
      }
    }

    function queuePeakMemoryCapture(force = false) {
      if (captureBusy || captureFinalizing) return;
      if (video.readyState < 2 || offscreen.width < 1) return;
      const now = performance.now();
      if (!force && now - lastMemoryAt < MEMORY_COOLDOWN_MS) return;
      if (!force && isEmotionallyNeutral(lastExpressions)) return;
      if (!force && (!lastDetection || lastDetection.expression === "neutral")) return;
      if (!force && !isAtPeakEnergy()) return;
      captureBusy = true;
      peakArmed = false;
      lastMemoryAt = now;
      pendingCaptureMood = getCaptureMood();
      captureEndsAt = now + POST_CAPTURE_MS;
      if (footerStatus) footerStatus.textContent = "Capturing core memory…";

      const frames = frameRing.slice(-PRE_BUFFER_FRAMES).map((c) => {
        const copy = document.createElement("canvas");
        copy.width = c.width;
        copy.height = c.height;
        copy.getContext("2d").drawImage(c, 0, 0);
        return copy;
      });
      const peakSnap = cloneFrameCanvas();
      if (!frames.length) {
        for (let i = 0; i < 4; i += 1) {
          const copy = document.createElement("canvas");
          copy.width = peakSnap.width;
          copy.height = peakSnap.height;
          copy.getContext("2d").drawImage(peakSnap, 0, 0);
          frames.push(copy);
        }
      } else {
        frames.push(peakSnap);
      }
      captureBusyFrames = frames;
      stopCaptureTimers();
      drainCaptureFrame();
      captureDrainTimer = setInterval(drainCaptureFrame, FRAME_SAMPLE_MS);
      captureWatchdogTimer = setTimeout(() => {
        if (!captureBusy || captureFinalizing) return;
        const pending = captureBusyFrames || [cloneFrameCanvas()];
        captureBusyFrames = null;
        finalizeMemoryCapture(pending).catch((error) => {
          console.error("watchdog finalize failed", error);
          finishCapture();
        });
      }, CAPTURE_WATCHDOG_MS);
    }

    async function loadModelsFrom(baseUri) {
      const loaders = [
        { name: "tinyFaceDetector", load: () => faceapi.nets.tinyFaceDetector.loadFromUri(baseUri) },
        { name: "faceLandmark68Net", load: () => faceapi.nets.faceLandmark68Net.loadFromUri(baseUri) },
        { name: "faceExpressionNet", load: () => faceapi.nets.faceExpressionNet.loadFromUri(baseUri) }
      ];

      for (const model of loaders) {
        try {
          await model.load();
          console.log(`Model loaded: ${model.name} from ${baseUri}`);
        } catch (error) {
          console.error(`Model failed: ${model.name} from ${baseUri}`, error);
          throw error;
        }
      }
    }

    async function loadModels() {
      if (!window.faceapi) {
        throw new Error("face-api.js did not load");
      }

      const localBase = "/models";
      const fallbackBase = "https://justadudewhohacks.github.io/face-api.js/models";

      try {
        await loadModelsFrom(localBase);
      } catch (localError) {
        console.warn("Local /models load failed, trying fallback CDN models.");
        await loadModelsFrom(fallbackBase);
      }
    }

    function pickPrimaryFace(faces) {
      if (!faces?.length) return null;
      return faces.reduce((best, face) => {
        const box = face.detection.box;
        const area = box.width * box.height;
        const bestBox = best.detection.box;
        const bestArea = bestBox.width * bestBox.height;
        return area > bestArea ? face : best;
      });
    }

    async function runFaceDetection() {
      if (video.readyState < 2) return;
      if (!drawVideoCoverTo(detectCtx, detectCanvas.width, detectCanvas.height)) return;

      try {
        const faces = await faceapi
          .detectAllFaces(detectCanvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 192, scoreThreshold: 0.35 }))
          .withFaceLandmarks()
          .withFaceExpressions();

        peopleCount = faces.length;
        const result = pickPrimaryFace(faces);

        if (result) {
          lastExpressions = result.expressions;
          updateMoodState(result.expressions);
          const neutralFace = isEmotionallyNeutral(result.expressions);
          const live = getLiveExpression(result.expressions);
          targetExpressionIntensity = neutralFace
            ? 0
            : computeExpressionIntensity(result.expressions);
          lastDetection = {
            expression: neutralFace ? "neutral" : live.name,
            probability: neutralFace
              ? (result.expressions.neutral || live.score)
              : live.score,
            intensity: targetExpressionIntensity
          };
          lastFaceBox = result.detection.box;
          faceDetectVersion += 1;
          const baseScore = expressionScores[live.name] ?? 0.3;
          targetFaceScore = lerp(0.4, baseScore, 0.35) + (targetExpressionIntensity * 0.65);
          targetFaceScore = clamp(targetFaceScore, 0.35, 1.0);
        } else {
          updateMoodState(null);
          lastDetection = null;
          lastFaceBox = null;
          lastExpressions = null;
          targetFaceScore = 0.3;
          targetExpressionIntensity = 0;
        }
      } catch (error) {
        console.error("Detection error", error);
        updateMoodState(null);
        peopleCount = 0;
        lastDetection = null;
        lastFaceBox = null;
        targetFaceScore = 0.3;
      }
    }

    function startDetectionLoop() {
      if (detectionTimer) clearInterval(detectionTimer);
      detectionTimer = setInterval(() => {
        runFaceDetection().catch((error) => {
          console.error("Detection tick failed", error);
        });
      }, DETECTION_INTERVAL_MS);
    }

    function drawViewfinderPlaceholder(message) {
      ctx.fillStyle = "#12141a";
      ctx.fillRect(0, 0, displayW, displayH);
      ctx.fillStyle = "rgba(236, 228, 216, 0.5)";
      ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.fillText(message, 16, 28);
    }

    function renderFrame() {
      const now = performance.now();
      try {
      if (displayW < 16 || displayH < 16) resizeCanvases();
      ensureThermalLUTs();
      updateLiveEnergy();

      const videoReady = video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2;
      offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
      if (!videoReady) {
        offCtx.fillStyle = "#12141a";
        offCtx.fillRect(0, 0, offscreen.width, offscreen.height);
        ctx.drawImage(offscreen, 0, 0, displayW, displayH);
        drawViewfinderPlaceholder("Acquiring sensor feed…");
        updateInstrumentUI();
      } else {
      drawVideoCover();

      const procW = offscreen.width;
      const procH = offscreen.height;
      const pixelCount = procW * procH;
      const emberW = Math.max(160, procW >> 1);
      const emberH = Math.max(120, procH >> 1);
      const emberCount = emberW * emberH;
      if (prevLumaFrame.length !== pixelCount) {
        prevLumaFrame = new Float32Array(pixelCount);
      }
      if (motionEmber.length !== emberCount) {
        motionEmber = new Float32Array(emberCount);
        motionEmberTmp = new Float32Array(emberCount);
        motionSpeedEmber = new Float32Array(emberCount);
        motionSpeedEmberTmp = new Float32Array(emberCount);
      }
      for (let ep = 0; ep < emberCount; ep += 1) {
        // More subtle persistence: short, soft-lived trails.
        motionEmberTmp[ep] = motionEmber[ep] * 0.9;
        motionSpeedEmberTmp[ep] = motionSpeedEmber[ep] * 0.88;
      }

      const frame = offCtx.getImageData(0, 0, procW, procH);
      const data = frame.data;
      const faceBox = mapDetectBoxToTarget(lastFaceBox, procW, procH);
      if (faceBox) {
        const tcx = faceBox.x + (faceBox.width * 0.5);
        const tcy = faceBox.y + (faceBox.height * 0.56);
        const trx = Math.max(24, faceBox.width * 0.5);
        const tRy = Math.max(38, faceBox.height * 0.95);
        if (!liveFace) {
          liveFace = {
            cx: tcx,
            cy: tcy,
            rx: trx,
            ry: tRy,
            height: faceBox.height,
            glowCx: tcx,
            glowCy: tcy,
            glowRx: trx,
            glowRy: tRy
          };
        } else if (faceDetectVersion !== consumedFaceVersion) {
          consumedFaceVersion = faceDetectVersion;
          liveFace.cx = lerp(liveFace.cx, tcx, 0.48);
          liveFace.cy = lerp(liveFace.cy, tcy, 0.48);
          liveFace.rx = lerp(liveFace.rx, trx, 0.38);
          liveFace.ry = lerp(liveFace.ry, tRy, 0.38);
          liveFace.height = lerp(liveFace.height, faceBox.height, 0.38);
        } else {
          liveFace.rx = lerp(liveFace.rx, trx, 0.22);
          liveFace.ry = lerp(liveFace.ry, tRy, 0.22);
          liveFace.height = lerp(liveFace.height, faceBox.height, 0.22);
          liveFace.cx = lerp(liveFace.cx, tcx, 0.26);
          liveFace.cy = lerp(liveFace.cy, tcy, 0.26);
        }

        let trackMass = 0;
        let trackSumX = 0;
        let trackSumY = 0;
        const minY = Math.max(0, Math.floor(liveFace.cy - liveFace.ry * 1.35));
        const maxY = Math.min(procH - 1, Math.ceil(liveFace.cy + liveFace.ry * 1.35));
        const minX = Math.max(0, Math.floor(liveFace.cx - liveFace.rx * 1.35));
        const maxX = Math.min(procW - 1, Math.ceil(liveFace.cx + liveFace.rx * 1.35));
        for (let ty = minY; ty <= maxY; ty += 3) {
          for (let tx = minX; tx <= maxX; tx += 3) {
            const tp = ty * procW + tx;
            const ti = tp * 4;
            const tLum = (0.299 * data[ti] + 0.587 * data[ti + 1] + 0.114 * data[ti + 2]) / 255;
            const tDelta = Math.abs(tLum - prevLumaFrame[tp]);
            const tex = (tx - liveFace.cx) / (liveFace.rx * 1.2);
            const tey = (ty - liveFace.cy) / (liveFace.ry * 1.2);
            if ((tex * tex + tey * tey) > 1.1 || tDelta < 0.018) continue;
            trackMass += tDelta;
            trackSumX += tx * tDelta;
            trackSumY += ty * tDelta;
          }
        }
        if (trackMass > 0.014) {
          const mx = trackSumX / trackMass;
          const my = trackSumY / trackMass;
          const offX = (mx - liveFace.cx) / liveFace.rx;
          const offY = (my - liveFace.cy) / liveFace.ry;
          if ((offX * offX + offY * offY) < 0.65) {
            liveFace.cx = lerp(liveFace.cx, mx, 0.16);
            liveFace.cy = lerp(liveFace.cy, my, 0.16);
          }
        }

        liveFace.glowCx = lerp(liveFace.glowCx, liveFace.cx, 0.1);
        liveFace.glowCy = lerp(liveFace.glowCy, liveFace.cy, 0.1);
        liveFace.glowRx = lerp(liveFace.glowRx, liveFace.rx, 0.07);
        liveFace.glowRy = lerp(liveFace.glowRy, liveFace.ry, 0.07);
      } else if (liveFace) {
        liveFace.rx *= 0.9;
        liveFace.ry *= 0.9;
        if (liveFace.rx < 12) liveFace = null;
      }

      const hasFace = Boolean(liveFace);
      const cx = hasFace ? liveFace.glowCx : 0;
      const cy = hasFace ? liveFace.glowCy : 0;
      const rx = hasFace ? liveFace.glowRx : 1;
      const ry = hasFace ? liveFace.glowRy : 1;
      const faceHeight = hasFace ? liveFace.height : 0;
      const body = getBodyTrailBounds(hasFace, cx, cy, rx, ry, faceHeight, procH);
      const exprHeat = clamp(expressionIntensity, 0, 1);
      const exprHeatCurve = Math.pow(exprHeat, 0.88);
      const baseExpression = lastDetection?.expression || "neutral";
      const currentExpression = (moodExpressionStable === "sad" || moodExpressionStable === "angry")
        ? moodExpressionStable
        : baseExpression;
      const expressionConfidence = currentExpression === "sad"
        ? moodSadLatch
        : currentExpression === "angry"
          ? moodAngryLatch
          : clamp(lastDetection?.probability || 0, 0, 1);
      const moodDrivenExpression = currentExpression === "sad" || currentExpression === "angry";
      let frameMotionPeak = 0;
      let movePixelCount = 0;

      for (let y = 0; y < procH; y += 1) {
        for (let x = 0; x < procW; x += 1) {
          const i = (y * procW + x) * 4;
          const p = y * procW + x;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
        const rawLum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const delta = Math.abs(rawLum - prevLumaFrame[p]);
        prevLumaFrame[p] = rawLum;
        const bgIndex = Math.min(255, Math.floor(Math.pow(rawLum, 1.15) * 255));
        const bg = bgLUT[bgIndex] || { r: 0, g: 0, b: 0 };

        let warmMix = 0;
        let thermalBoost = 0;
        let trailMask = 0;
        if (hasFace) {
          const exFace = (x - cx) / rx;
          const eyFace = (y - cy) / ry;
          const distFace = Math.sqrt((exFace * exFace) + (eyFace * eyFace));
          const exBody = (x - body.bodyCx) / body.bodyRx;
          const bodyRyEff = y >= body.bodyCy ? body.bodyRyDown : body.bodyRyUp;
          const eyBody = (y - body.bodyCy) / bodyRyEff;
          const distBody = Math.sqrt((exBody * exBody) + (eyBody * eyBody));

          const faceInfluence = Math.pow(clamp(1 - distFace, 0, 1), 1.28);
          const bodyInfluence = Math.pow(clamp(1 - distBody, 0, 1), 1.18);
          const humanInfluence = Math.max(faceInfluence, bodyInfluence * 0.92);
          const faceCore = Math.pow(clamp(1 - distFace, 0, 1), 2.35);
          const wholeFace = Math.pow(clamp(1 - distFace, 0, 1), 0.92);
          const edgeSoft = Math.pow(clamp(1 - (distFace * 0.86), 0, 1), 1.4);
          const containFace = clamp(1 - distFace, 0, 1);
          const eyForehead = (y - (cy - ry * 0.46)) / (ry * 1.42);
          const distForehead = Math.sqrt((exFace * exFace) + (eyForehead * eyForehead));
          const containForehead = clamp(1 - distForehead, 0, 1);
          const containBody = clamp(1 - distBody, 0, 1);
          const personContain = Math.max(Math.pow(containFace, 0.95), Math.pow(containBody, 1.55));
          trailMask = Math.pow(personContain, 1.15);

          const skinLikely = clamp(((r - b) + 20) / 120, 0, 1) * clamp(((g - b) + 10) / 90, 0, 1);
          const heatPotential = clamp((Math.pow(rawLum, 1.22) * 0.95) + (skinLikely * 0.6), 0, 1);
          const energyDriven = clamp(energyScore + (exprHeatCurve * 0.62), 0, 1.45);
          const energyRamp = Math.pow(clamp(energyDriven, 0, 1.45) / 1.45, 0.92);
          const glowRamp = Math.pow(clamp(energyDriven, 0, 1.45) / 1.45, 1.22);
          const neutralLift = clamp((0.58 - energyScore) / 0.58, 0, 1);
          const neutralFaceArea = Math.max(containFace, Math.pow(containForehead, 0.72));
          const neutralSpread = Math.pow(neutralFaceArea, 0.72) * neutralLift;

          warmMix = humanInfluence * heatPotential * (0.28 + (energyRamp * 1.45));
          warmMix += wholeFace * (0.05 + energyRamp * 0.72);
          warmMix += edgeSoft * energyRamp * 0.22;
          warmMix += bodyInfluence * energyRamp * 0.22;
          warmMix += faceCore * glowRamp * (0.42 + exprHeatCurve * 0.62);
          warmMix += neutralSpread * 0.1;
          warmMix += containFace * exprHeatCurve * 0.38;
          warmMix += faceCore * exprHeatCurve * 0.35;
          warmMix *= personContain * 0.9;
          const maxWarmMix = lerp(0.76, 0.9, exprHeatCurve);
          warmMix = clamp(warmMix, 0, maxWarmMix);
          thermalBoost = (
            (faceCore * glowRamp * (0.26 + exprHeatCurve * 0.34)) +
            (wholeFace * energyRamp * (0.14 + exprHeatCurve * 0.16)) +
            (bodyInfluence * energyRamp * 0.1) +
            (neutralSpread * 0.07)
          ) * personContain;
          thermalBoost += exprHeatCurve * 0.1 * personContain;
        }

        const boostedLum = clamp(Math.pow(rawLum, 0.88) + thermalBoost, 0, 1);
        const lumCap = hasFace ? Math.round(lerp(205, 236, Math.pow(exprHeatCurve, 0.95))) : 210;
        const lumIndex = Math.min(lumCap, Math.floor(boostedLum * 255));
        const thermal = activeLUT[lumIndex] || bg;

          let outR = Math.round(lerp(bg.r, thermal.r, warmMix));
          let outG = Math.round(lerp(bg.g, thermal.g, warmMix));
          let outB = Math.round(lerp(bg.b, thermal.b, warmMix));

          if (hasFace && warmMix > 0.08 && (exprHeatCurve > 0.5 || (moodDrivenExpression && expressionConfidence > 0.55))) {
            const exHot = (x - cx) / rx;
            const eyHot = (y - cy) / ry;
            const distHot = Math.sqrt((exHot * exHot) + (eyHot * eyHot));
            const hotRadius = 1.18;
            if (distHot < hotRadius) {
              const thermalHotMix = clamp((exprHeatCurve - 0.5) / 0.5, 0, 1);
              const moodHotMix = moodDrivenExpression ? clamp((expressionConfidence - 0.45) / 0.55, 0, 1) : 0;
              const hotMix = Math.max(thermalHotMix, moodHotMix);
              const hotMixShaped = hotMix * hotMix * (3 - (2 * hotMix));
              const faceHot = Math.pow(clamp(1 - (distHot / hotRadius), 0, 1), 2.15);
              const amberHot = facePeakColor(currentExpression, hotMixShaped);
              const hotBlendGain = moodDrivenExpression ? 0.54 : 0.33;
              const hotBlend = hotMixShaped * faceHot * hotBlendGain;
              outR = Math.round(lerp(outR, amberHot.r, hotBlend));
              outG = Math.round(lerp(outG, amberHot.g, hotBlend));
              outB = Math.round(lerp(outB, amberHot.b, hotBlend));
            }

            const detailStrength = clamp(exprHeatCurve * 0.52, 0.12, 0.42);
            const detail = (rawLum - 0.5) * detailStrength * 70;
            outR = clamp(outR + detail, 0, 255);
            outG = clamp(outG + detail * 0.88, 0, 255);
            outB = clamp(outB + detail * 0.42, 0, 255);
          }

          const adaptiveDeltaFloor = hasFace ? 0.055 : 0.08;
          const motionHit = clamp((delta - adaptiveDeltaFloor) * 6.2, 0, 1);
          // Allow non-face movers (hands/background people) when motion is strong.
          const globalMotionMask = clamp((motionHit - 0.48) * 1.9, 0, 1);
          const lowerFrameBoost = clamp(((y / procH) - 0.38) / 0.62, 0, 1) * motionHit * 0.55;
          const motionSourceMask = hasFace
            ? Math.max(trailMask, globalMotionMask, lowerFrameBoost)
            : globalMotionMask;
          if (motionHit > 0.22 && motionSourceMask > 0.12) {
            const ep = emberIndexFromPixel(x, y, procW, procH, emberW, emberH);
            const inject = motionHit * motionSourceMask * 0.26;
            if (inject > motionEmberTmp[ep]) motionEmberTmp[ep] = inject;
            const speedInject = clamp((motionHit - 0.22) / 0.7, 0, 1) * motionSourceMask;
            if (speedInject > motionSpeedEmberTmp[ep]) motionSpeedEmberTmp[ep] = speedInject;
          }

          const moveHit = clamp((delta - 0.12) * 4.2, 0, 1) * Math.max(0.35, motionSourceMask);
          if (moveHit > 0.24) {
            movePixelCount += 1;
            if (moveHit > frameMotionPeak) frameMotionPeak = moveHit;
          }

          data[i] = outR;
          data[i + 1] = outG;
          data[i + 2] = outB;
        }
      }

      blurEmberField(motionEmberTmp, motionEmber, emberW, emberH);
      blurEmberField(motionEmber, motionEmberTmp, emberW, emberH);
      blurEmberField(motionSpeedEmberTmp, motionSpeedEmber, emberW, emberH);
      blurEmberField(motionSpeedEmber, motionSpeedEmberTmp, emberW, emberH);

      const emberScaleX = emberW / procW;
      const emberScaleY = emberH / procH;
      for (let y = 0; y < procH; y += 1) {
        for (let x = 0; x < procW; x += 1) {
          const i = (y * procW + x) * 4;
          const emberVal = sampleEmberBilinear(
            motionEmber,
            emberW,
            emberH,
            (x + 0.5) * emberScaleX,
            (y + 0.5) * emberScaleY
          );
          if (emberVal < 0.055) continue;
          const emberSpeedVal = sampleEmberBilinear(
            motionSpeedEmber,
            emberW,
            emberH,
            (x + 0.5) * emberScaleX,
            (y + 0.5) * emberScaleY
          );
          let spatialGate = 1;
          if (hasFace) {
            const bodyGate = bodyTrailContain(x, y, body);
            const offBodyBoost = clamp((emberVal - 0.05) * 3.2, 0, 1);
            spatialGate = Math.max(bodyGate, offBodyBoost);
            if (spatialGate < 0.03) continue;
          }
          const emberSoft = Math.pow(emberVal, 0.74);
          const emberShape = emberSoft * emberSoft * (3 - (2 * emberSoft));
          const localTrailSpeed = clamp((emberSpeedVal - 0.06) / 0.42, 0, 1);
          const trail = moodyTrailRgb(emberShape, energyScore, localTrailSpeed);
          const edgeBlend = clamp((emberVal - 0.055) / 0.14, 0, 1);
          const speedAlpha = clamp((localTrailSpeed - 0.04) / 0.9, 0.12, 1);
          const trailMix = clamp(
            Math.pow(emberShape, 0.92) * (0.12 + localTrailSpeed * 0.36) * spatialGate * edgeBlend * speedAlpha,
            0,
            0.5
          );
          data[i] = Math.round(lerp(data[i], trail.r, trailMix));
          data[i + 1] = Math.round(lerp(data[i + 1], trail.g, trailMix));
          data[i + 2] = Math.round(lerp(data[i + 2], trail.b, trailMix));
        }
      }

      offCtx.putImageData(frame, 0, 0);
      pushFrameSample(now);
      ctx.drawImage(offscreen, 0, 0, displayW, displayH);

      // Motion metric: normalize to 0–1, then smooth for stable readout.
      const movingRatio = movePixelCount / Math.max(1, pixelCount);
      const peakNorm = clamp((frameMotionPeak - 0.42) / 0.58, 0, 1);
      const spreadNorm = clamp((movingRatio - 0.05) / 0.14, 0, 1);
      const motionRaw = clamp(Math.max(peakNorm, spreadNorm * 0.45), 0, 1);
      const motionInstant = Math.pow(motionRaw, 1.35);
      const motionRise = motionInstant > moveLevel ? 0.1 : 0.14;
      moveLevel = lerp(moveLevel, motionInstant, motionRise);
      const displayRise = motionInstant > moveLevelDisplay ? 0.08 : 0.12;
      moveLevelDisplay = lerp(moveLevelDisplay, motionInstant, displayRise);
      const trailRise = moveLevel > trailHeat ? 0.14 : 0.1;
      trailHeat = lerp(trailHeat, moveLevel, trailRise);
      tickPeakCapture();
      }
      uiUpdateFrame += 1;
      if (uiUpdateFrame % UI_UPDATE_EVERY_N_FRAMES === 0 || captureBusy) updateInstrumentUI();
      } catch (error) {
        console.error("renderFrame error", error);
        if (displayW >= 16 && displayH >= 16) {
          drawViewfinderPlaceholder("Render error — check console");
        }
      }
      requestAnimationFrame(renderFrame);
    }

    function getSlotPitch() {
      return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slot-pitch")) || 58;
    }

    function getDialViewportHeight() {
      if (!memoryDial) return 0;
      const direct = memoryDial.clientHeight;
      if (direct > 8) return direct;
      const frame = memoryDial.parentElement;
      if (frame?.clientHeight > 8) return Math.max(0, frame.clientHeight - 16);
      const cssDial = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--dial-height")
      );
      return Number.isFinite(cssDial) && cssDial > 8 ? cssDial : 272;
    }

    function getDialBallCount() {
      return memoryBalls ? memoryBalls.querySelectorAll(".memory-ball").length : 0;
    }

    function getCenterDialIndex(n = getDialBallCount()) {
      if (n <= 0) return 0;
      return Math.floor((n - 1) / 2);
    }

    function insertMemorySlotAtCenter(slot) {
      const before = memoryBalls.children.length;
      const insertIdx = Math.floor(before / 2);
      if (insertIdx >= before) memoryBalls.append(slot);
      else memoryBalls.insertBefore(slot, memoryBalls.children[insertIdx]);
      return insertIdx;
    }

    function scrollYForIndex(index) {
      return -index * getSlotPitch();
    }

    function getDialScrollLimits() {
      const n = getDialBallCount();
      if (n <= 0) return { min: 0, max: 0 };
      const min = scrollYForIndex(n - 1);
      const max = scrollYForIndex(0);
      return { min: Math.min(min, max), max: Math.max(min, max) };
    }

    function clampDialScroll(y) {
      const { min, max } = getDialScrollLimits();
      if (min === max) return y;
      return clamp(y, min, max);
    }

    function getSelectedDialIndex() {
      const n = getDialBallCount();
      if (!n) return 0;
      const pitch = getSlotPitch();
      const idx = Math.round(-dialScrollY / pitch);
      return clamp(idx, 0, n - 1);
    }

    function applyDialScroll(y, animate = true) {
      if (!memoryDialStrip) return;
      dialScrollY = clampDialScroll(y);
      memoryDialStrip.style.transition = animate
        ? "transform 0.38s cubic-bezier(0.34, 1.25, 0.64, 1)"
        : "none";
      memoryDialStrip.style.transform = `translateY(${dialScrollY}px)`;
      updateDialFocus();
    }

    function snapDialToIndex(index, animate = true) {
      const n = getDialBallCount();
      if (!n) return;
      const idx = ((index % n) + n) % n;
      applyDialScroll(scrollYForIndex(idx), animate);
    }

    function snapDialToNearest(animate = true) {
      snapDialToIndex(getSelectedDialIndex(), animate);
    }

    function playBallGif(ball) {
      const img = ball.querySelector("img");
      const gifUrl = ball.dataset.gifUrl;
      const poster = ball.dataset.posterUrl || "";
      if (!img || !gifUrl || !isAnimatedGifUrl(gifUrl)) {
        if (img && poster && img.src !== poster) img.src = poster;
        return;
      }
      if (img.dataset.playing === "1" && img.getAttribute("data-active-src") === gifUrl) return;

      const startGif = () => {
        img.onerror = () => {
          img.onerror = null;
          img.dataset.playing = "0";
          img.removeAttribute("data-active-src");
          if (ball._captureFrames?.length) playBallFrameLoop(ball);
          else if (poster) img.src = poster;
        };
        img.dataset.playing = "1";
        img.setAttribute("data-active-src", gifUrl);
        const needsRestart = img.src === gifUrl || img.currentSrc === gifUrl;
        if (needsRestart) {
          img.src = "";
          requestAnimationFrame(() => { img.src = gifUrl; });
        } else {
          img.src = gifUrl;
        }
      };

      if (ball.dataset.gifReady === "1") {
        startGif();
        return;
      }

      const probe = new Image();
      probe.onload = () => {
        ball.dataset.gifReady = "1";
        if (ball.classList.contains("is-selected")) startGif();
      };
      probe.onerror = () => {
        ball.dataset.gifReady = "0";
        if (ball.classList.contains("is-selected") && ball._captureFrames?.length) {
          playBallFrameLoop(ball);
        } else if (poster) {
          img.src = poster;
        }
      };
      probe.src = gifUrl;
    }

    function pauseBallGif(ball) {
      const img = ball.querySelector("img");
      const poster = ball.dataset.posterUrl;
      if (!img) return;
      img.dataset.playing = "0";
      img.removeAttribute("data-active-src");
      if (poster && img.src !== poster) img.src = poster;
    }

    function playBallMemory(ball) {
      if (!ball) return;
      stopBallFrameLoop(ball);
      const gifUrl = ball.dataset.gifUrl;
      if (isAnimatedGifUrl(gifUrl)) {
        playBallGif(ball);
        return;
      }
      if (ball._captureFrames?.length >= 2) {
        playBallFrameLoop(ball);
        return;
      }
      pauseBallGif(ball);
    }

    function pauseBallMemory(ball) {
      stopBallFrameLoop(ball);
      pauseBallGif(ball);
    }

    function updateDialFocus() {
      if (!memoryBalls) return;
      const balls = [...memoryBalls.querySelectorAll(".memory-ball")];
      const selectedIdx = getSelectedDialIndex();
      balls.forEach((ball, i) => {
        const isSelected = i === selectedIdx;
        ball.classList.toggle("is-selected", isSelected);
        if (isSelected) playBallMemory(ball);
        else pauseBallMemory(ball);
      });
    }

    function layoutDialBalls() {
      if (!memoryBalls || !memoryDial) return;
      const pitch = getSlotPitch();
      const viewportH = getDialViewportHeight();
      const pad = Math.max(0, viewportH / 2 - pitch / 2);
      memoryBalls.style.paddingTop = `${pad}px`;
      memoryBalls.style.paddingBottom = `${pad}px`;
      const n = getDialBallCount();
      if (n > 0) snapDialToIndex(getCenterDialIndex(n), false);
      else if (memoryDialStrip) memoryDialStrip.style.transform = "translateY(0px)";
      updateDialFocus();
    }

    function scheduleLayoutDialBalls(attempt = 0) {
      layoutDialBalls();
      const needsRetry = getDialBallCount() > 0
        && getDialViewportHeight() < 8
        && attempt < 8;
      if (needsRetry) {
        requestAnimationFrame(() => scheduleLayoutDialBalls(attempt + 1));
      }
    }

    function debouncedScheduleLayoutDialBalls() {
      clearTimeout(dialLayoutTimer);
      dialLayoutTimer = setTimeout(() => scheduleLayoutDialBalls(), 60);
    }

    function debouncedResizeCanvases() {
      clearTimeout(resizeCanvasTimer);
      resizeCanvasTimer = setTimeout(resizeCanvases, 60);
    }

    function setBallMedia(ball, mediaUrl, posterUrl) {
      const poster = posterUrl || mediaUrl;
      const isGif = isAnimatedGifUrl(mediaUrl);
      ball.dataset.posterUrl = poster;
      ball.dataset.gifUrl = isGif ? mediaUrl : "";
      ball.dataset.animated = isGif ? "1" : "0";
      ball.dataset.gifReady = "0";
      const img = document.createElement("img");
      img.alt = "Core memory";
      img.decoding = "async";
      img.src = poster;
      ball.appendChild(img);
    }

    function resolveBallPreview(mediaUrl, captureFrames) {
      if (mediaUrl) return mediaUrl;
      if (captureFrames?.length) return previewFromFrames(captureFrames);
      return frameToPreviewUrl(cloneFrameCanvas());
    }

    function addCoreMemoryBall(mediaUrl, posterUrl, mood = "happy", captureFrames = null) {
      if (!memoryBalls || !memoryRack) return null;
      const preview = resolveBallPreview(mediaUrl, captureFrames);
      if (!preview) return null;

      memoryRack.classList.remove("empty");
      const slot = document.createElement("div");
      slot.className = "memory-slot";
      const ball = document.createElement("div");
      ball.className = "memory-ball is-new";
      applyBallMood(ball, mood);
      slot.appendChild(ball);
      const centerIdx = insertMemorySlotAtCenter(slot);
      setBallMedia(ball, preview, posterUrl || preview);
      if (captureFrames?.length) attachBallCaptureFrames(ball, captureFrames);
      scheduleLayoutDialBalls();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          snapDialToIndex(centerIdx, true);
          updateDialFocus();
          setTimeout(() => ball.classList.remove("is-new"), 560);
        });
      });
      return ball;
    }

    function onDialPointerDown(e) {
      if (!memoryDial || getDialBallCount() === 0) return;
      dialDragging = true;
      dialPointerId = e.pointerId;
      memoryDial.classList.add("is-dragging");
      memoryDial.setPointerCapture(e.pointerId);
      dialDragStartY = e.clientY;
      dialDragStartScroll = dialScrollY;
      if (memoryDialStrip) memoryDialStrip.style.transition = "none";
    }

    function onDialPointerMove(e) {
      if (!dialDragging || e.pointerId !== dialPointerId) return;
      applyDialScroll(dialDragStartScroll + (e.clientY - dialDragStartY), false);
    }

    function onDialPointerUp(e) {
      if (!dialDragging || e.pointerId !== dialPointerId) return;
      dialDragging = false;
      dialPointerId = null;
      memoryDial.classList.remove("is-dragging");
      try { memoryDial.releasePointerCapture(e.pointerId); } catch (_) {}
      snapDialToNearest(true);
    }

    function onDialWheel(e) {
      if (!memoryDial || getDialBallCount() === 0) return;
      e.preventDefault();
      const n = getDialBallCount();
      const idx = getSelectedDialIndex();
      const next = e.deltaY > 0 ? (idx - 1 + n) % n : (idx + 1) % n;
      snapDialToIndex(next, true);
    }

    function initMemoryDial() {
      if (!memoryDial) return;
      memoryDial.addEventListener("pointerdown", onDialPointerDown);
      memoryDial.addEventListener("pointermove", onDialPointerMove);
      memoryDial.addEventListener("pointerup", onDialPointerUp);
      memoryDial.addEventListener("pointercancel", onDialPointerUp);
      memoryDial.addEventListener("wheel", onDialWheel, { passive: false });
      window.addEventListener("resize", debouncedScheduleLayoutDialBalls);
      if (memoryRack && typeof ResizeObserver !== "undefined") {
        new ResizeObserver(debouncedScheduleLayoutDialBalls).observe(memoryRack);
      }
      scheduleLayoutDialBalls();
    }

    const VF_TRANSMISSION_MSG =
      "Hold your absolute best smile! Energy levels are indicated by your facial expression and movement.";

    function initViewfinderTransmission() {
      const textEl = document.getElementById("vfTransmissionText");
      const cursorEl = document.getElementById("vfTransmissionCursor");
      if (!textEl) return;

      const charMs = 36;
      const startDelayMs = 500;
      let index = 0;

      function typeNext() {
        if (index >= VF_TRANSMISSION_MSG.length) {
          cursorEl?.classList.add("is-done");
          return;
        }
        textEl.textContent += VF_TRANSMISSION_MSG.charAt(index);
        index += 1;
        setTimeout(typeNext, charMs);
      }

      setTimeout(typeNext, startDelayMs);
    }

    function initHeaderChips() {
      chipCapture?.addEventListener("click", () => {
        if (captureBusy || captureFinalizing) return;
        if (video.readyState < 2) {
          if (footerStatus) footerStatus.textContent = "Camera not ready — wait a moment";
          return;
        }
        queuePeakMemoryCapture(true);
      });

      chipMemories?.addEventListener("click", () => {
        const n = getDialBallCount();
        if (!n) return;
        snapDialToIndex(getCenterDialIndex(n), true);
      });
    }

    async function waitForVideoReady() {
      if (video.readyState >= 2 && video.videoWidth > 0) return;
      await new Promise((resolve) => {
        const done = () => {
          if (video.videoWidth > 0) resolve();
        };
        video.addEventListener("loadeddata", done, { once: true });
        video.addEventListener("loadedmetadata", done, { once: true });
        setTimeout(resolve, 2500);
      });
    }

    async function initWebcam() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      await waitForVideoReady();
      console.log("webcam ready", video.videoWidth, "x", video.videoHeight);
    }

    async function init() {
      finishCapture();
      frameRing = [];
      ensureThermalLUTs();
      resizeCanvases();
      window.addEventListener("resize", debouncedResizeCanvases);
      if (viewport && typeof ResizeObserver !== "undefined") {
        new ResizeObserver(debouncedResizeCanvases).observe(viewport);
      }
      updateClockHands();
      setInterval(updateClockHands, 1000);
      initHeaderChips();
      initMemoryDial();
      initViewfinderTransmission();
      requestAnimationFrame(renderFrame);

      try {
        if (footerStatus) footerStatus.textContent = "Acquiring sensor…";
        await initWebcam();
        rebuildActiveLUT(true);
        resizeCanvases();
        requestAnimationFrame(resizeCanvases);
        if (footerStatus) footerStatus.textContent = "Camera live — loading models…";

        await loadModels();
        modelsReady = true;
        await runFaceDetection();
        startDetectionLoop();
        resizeCanvases();
        if (footerStatus) footerStatus.textContent = "Sensor online · radiometric feed active";
      } catch (error) {
        console.error("Init error", error);
        if (footerStatus) {
          footerStatus.textContent = error?.message?.includes("face-api")
            ? "Camera on — expression models unavailable"
            : "Camera error — check permission and reload";
        }
      }
    }

    init().catch((error) => {
      console.error("Fatal init error", error);
      if (footerStatus) footerStatus.textContent = "Failed to start — see console";
    });
  </script>
</body>
</html>
