<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CoreCam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/face-api.js/dist/face-api.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <style>
    :root {
      --shell: #141414;
      --shell-light: #1a1a1a;
      --body: #222222;
      --body-deep: #1c1c1c;
      --body-dark: #161616;
      --deck: #252525;
      --deck-deep: #1e1e1e;
      --recess: #2a2a2a;
      --recess-deep: #202020;
      --ink: #e0e0e0;
      --ink-muted: #cdcdcd;
      --ink-faint: #b7b7b7;
      --accent-rec: #d64545;
      --accent-rec-glow: rgba(214, 69, 69, 0.55);
      --lcd-bg: #121212;
      --lcd-ink: #d3d3d3;
      --screen-bg: #000000;
      --font: "IBM Plex Mono", "SF Mono", "Consolas", monospace;
      --neu-out:
        0 1px 2px rgba(0, 0, 0, 0.35);
      --neu-in:
        inset 0 1px 2px rgba(0, 0, 0, 0.35);
      --neu-knob:
        0 1px 2px rgba(0, 0, 0, 0.35);
      --neu-knob-pressed:
        inset 0 1px 2px rgba(0, 0, 0, 0.4);
      --neu-bezel:
        inset 0 1px 2px rgba(0, 0, 0, 0.45);
      --screen-inset: 10px;
      --screen-radius: 4px;
      --slot-pitch: 62px;
      --ball-size: 38px;
      --ball-size-active: 46px;
      --device-max: 960px;
      /* Modern phone held sideways (e.g. 19.5:9 portrait → 19.5:9 landscape box) */
      --phone-landscape-w: 19.5;
      --phone-landscape-h: 9;
      --device-aspect: 19.5 / 9;
      --topbar-h: 96px;
      --timeline-playhead: var(--accent-rec);
      --panel-split: 57%;
      --screen-aspect: 19.5 / 10.8;
      --screens-recess-aspect: 39 / 10.8;
      --bezel-width: 7px;
      --bezel-color: #0f1216;
      --viewport-radius: 14px;
      --dpad-size: 232px;
      --panel-content-inset-x: 22px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      max-width: 100vw;
      height: 100%;
      overflow: hidden;
      overflow-x: clip;
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: 0.08em;
      -webkit-font-smoothing: antialiased;
      background: #0f0f0f;
      color: var(--ink);
    }

    button,
    input,
    select,
    textarea {
      font-family: var(--font);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    video { display: none; }

    .device {
      position: relative;
      width: min(
        100vw - 16px,
        var(--device-max),
        calc((100dvh - 16px) * var(--phone-landscape-w) / var(--phone-landscape-h))
      );
      height: min(
        100dvh - 16px,
        calc((100vw - 16px) * var(--phone-landscape-h) / var(--phone-landscape-w)),
        calc(var(--device-max) * var(--phone-landscape-h) / var(--phone-landscape-w))
      );
      display: grid;
      grid-template-rows: var(--topbar-h) minmax(0, 1fr);
      background: linear-gradient(165deg, var(--shell-light) 0%, var(--shell) 42%, var(--body-deep) 100%);
      box-shadow:
        0 0 0 1px rgba(80, 80, 80, 0.6),
        0 8px 24px rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      overflow: hidden;
      touch-action: manipulation;
    }

    .device-topbar {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: var(--topbar-h);
      background:
        repeating-linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.07) 0,
          rgba(0, 0, 0, 0.07) 1px,
          transparent 1px,
          transparent 7px
        ),
        linear-gradient(180deg, var(--deck) 0%, var(--deck-deep) 100%);
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
      overflow: hidden;
    }

    .timeline-rack {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .timeline-playhead {
      position: absolute;
      top: 8px;
      bottom: 20px;
      left: var(--panel-content-inset-x);
      width: 2px;
      background: var(--timeline-playhead);
      box-shadow: 0 0 8px var(--accent-rec-glow);
      z-index: 5;
      pointer-events: none;
      transform: translateX(0);
      transition: transform 0.38s cubic-bezier(0.34, 1.25, 0.64, 1);
    }

    .timeline-playhead::before,
    .timeline-playhead::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      border: 2px solid var(--timeline-playhead);
      border-radius: 1px;
      background: var(--deck-deep);
    }

    .timeline-playhead::before { top: -2px; }
    .timeline-playhead::after { bottom: -2px; }

    .panel-status {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: 2px;
      font-size: 7px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .panel-status #footerStatus {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    .panel-rec {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      letter-spacing: 0.2em;
    }

    .panel-clock {
      margin-left: auto;
      flex-shrink: 0;
      letter-spacing: 0.14em;
      color: var(--ink-faint);
    }

    .device-main {
      display: grid;
      grid-template-columns: var(--panel-split) minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
      background: linear-gradient(180deg, var(--body) 0%, var(--body-deep) 100%);
    }

    .device-panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .device-panel--view {
      display: flex;
      flex-direction: column;
      padding: 8px var(--panel-content-inset-x) 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
      border-right: none;
      box-shadow: none;
    }

    .view-stage {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      justify-content: center;
      align-items: center;
    }

    .view-stage-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      flex-shrink: 0;
      margin-block: auto;
    }

    .view-stage-screens {
      position: relative;
      left: auto;
      top: auto;
      display: flex;
      flex: 0 0 auto;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
    }

    .screens-recess {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: auto;
      aspect-ratio: var(--screens-recess-aspect);
      max-height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 0;
      border-radius: 18px;
      background: transparent;
      border: var(--bezel-width) solid var(--bezel-color);
      overflow: hidden;
    }

    .screen-recess {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      overflow: hidden;
      background: unset;
      color: rgba(28, 28, 28, 0);
    }

    .screen-recess + .screen-recess {
      border-left: var(--bezel-width) solid var(--bezel-color);
    }

    .screen-recess--live .vf-aperture--live {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      border-radius: 11px 0 0 11px;
      background: unset;
      overflow: hidden;
    }

    .screen-recess--playback {
      width: 100%;
      height: 100%;
    }

    .screen-recess--playback .vf-aperture--playback {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      box-sizing: content-box;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 11px;
      background: unset;
      overflow: hidden;
    }

    .playback-media {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      box-sizing: content-box;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      background: #000;
      border: none;
      outline: none;
    }

    .playback-media[hidden] {
      display: none;
    }

    .playback-placeholder {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 14px 16px;
      pointer-events: none;
      text-align: center;
      background:
        radial-gradient(ellipse 120% 90% at 50% 50%, rgba(18, 24, 16, 0.55) 0%, transparent 68%),
        linear-gradient(165deg, #0c0e0c 0%, #060806 100%);
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.72);
    }

    .lcd-typewriter-line {
      margin: 0;
      max-width: 24em;
      font-family: var(--font);
      font-size: clamp(7px, 2vw, 9px);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.05em;
      color: rgba(160, 192, 112, 0.58);
      text-shadow:
        0 0 5px rgba(160, 192, 112, 0.22),
        0 0 1px rgba(160, 192, 112, 0.34);
    }

    .lcd-typewriter-prefix {
      color: rgba(160, 192, 112, 0.42);
    }

    .lcd-typewriter-track .typewriter-char {
      opacity: 0;
    }

    .lcd-typewriter-track .typewriter-char.is-revealed {
      opacity: 1;
    }

    .lcd-typewriter-cursor {
      display: inline-block;
      margin-left: 1px;
      color: rgba(160, 192, 112, 0.72);
      text-shadow: 0 0 4px rgba(160, 192, 112, 0.35);
      animation: lcdCursorBlink 1s step-end infinite;
    }

    @keyframes lcdCursorBlink {
      50% { opacity: 0; }
    }

    .playback-placeholder.is-muted .lcd-typewriter-line {
      opacity: 0.35;
    }

    .vf-aperture--playback.has-media .playback-placeholder,
    .vf-aperture--playback.has-memories .playback-placeholder {
      display: none;
    }

    .view-stage-meters {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .energy-led-bar {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px;
      align-items: center;
      height: 32px;
      padding: 4px 6px;
      background: linear-gradient(180deg, #0c0f13 0%, #090b0f 100%);
      color: rgba(195, 192, 187, 1);
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.68);
      border-image: none;
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.72),
        inset 0 -1px 1px rgba(255, 255, 255, 0.03);
    }

    .energy-led-label {
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(82, 82, 82, 0.88);
      white-space: nowrap;
    }

    .energy-led-track {
      width: 100%;
      display: grid;
      grid-auto-flow: row;
      grid-template-rows: repeat(5, 1fr);
      gap: 1px;
      align-items: stretch;
      padding: 1px;
      background: rgba(255, 255, 255, 0.07);
    }

    .energy-led-seg {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 0;
      background: #030405;
      border: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      transition: background 0.08s linear, box-shadow 0.08s linear;
    }

    .energy-led-seg.is-on {
      background: var(--pixel-color, #1a1aff);
      box-shadow:
        0 0 1px 0 var(--pixel-glow, rgba(26, 26, 255, 0.95)),
        0 0 2px 0 var(--pixel-glow, rgba(26, 26, 255, 0.85));
    }

    .readout-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .readout {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .readout-label {
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .readout-value {
      font-family: var(--font);
      font-size: clamp(20px, 3.8vw, 30px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .onboarding-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      background:
        radial-gradient(ellipse 90% 70% at 50% 38%, rgba(52, 50, 48, 0.55) 0%, transparent 70%),
        linear-gradient(180deg, rgba(22, 21, 20, 0.97) 0%, rgba(10, 10, 9, 0.99) 100%);
      cursor: pointer;
      transition: opacity 1.2s cubic-bezier(0.33, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .onboarding-overlay.is-fading {
      opacity: 0;
      pointer-events: none;
    }

    .onboarding-overlay.is-done {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .onboarding-overlay-content {
      max-width: 22em;
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 4vh, 24px);
      pointer-events: none;
      transition: opacity 1.2s cubic-bezier(0.33, 0, 0.2, 1);
    }

    .onboarding-overlay.is-fading .onboarding-overlay-content {
      opacity: 0;
    }

    .onboarding-tap-hint {
      margin: 8px 0 0;
      font-family: var(--font);
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-align: center;
      color: rgba(200, 194, 186, 0.35);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .onboarding-overlay.is-ready .onboarding-tap-hint {
      opacity: 1;
    }

    .onboarding-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      color: var(--ink-muted);
      background: radial-gradient(circle at 35% 28%, var(--shell-light) 0%, var(--body) 100%);
      box-shadow: var(--neu-out);
      cursor: pointer;
      opacity: 1;
      pointer-events: auto;
      transition: box-shadow 0.12s ease, transform 0.1s ease, opacity 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .onboarding-overlay.is-done .onboarding-close-btn {
      opacity: 0;
      pointer-events: none;
    }

    .onboarding-close-btn:active {
      transform: scale(0.94);
      box-shadow: var(--neu-knob-pressed);
    }

    .onboarding-info-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 40;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      color: var(--ink-muted);
      background: radial-gradient(circle at 35% 28%, var(--shell-light) 0%, var(--body) 100%);
      box-shadow: var(--neu-out);
      cursor: pointer;
      transition: box-shadow 0.12s ease, transform 0.1s ease, opacity 0.3s ease;
    }

    .onboarding-info-btn:active {
      transform: scale(0.94);
      box-shadow: var(--neu-knob-pressed);
    }

    .onboarding-overlay:not(.is-done) ~ .onboarding-info-btn {
      opacity: 0;
      pointer-events: none;
    }

    .onboarding-overlay.is-info-only {
      background:
        radial-gradient(ellipse 90% 70% at 50% 38%, rgba(52, 50, 48, 0.4) 0%, transparent 70%),
        linear-gradient(180deg, rgba(22, 21, 20, 0.78) 0%, rgba(10, 10, 9, 0.88) 100%);
    }

    .onboarding-overlay.is-info-only #onboardingLine1 {
      display: none;
    }

    .onboarding-overlay.is-info-only #onboardingLine2 {
      font-size: clamp(10px, 2.6vw, 12px);
      line-height: 1.65;
      color: rgba(236, 228, 216, 0.92);
      opacity: 1;
      transform: none;
    }

    .device-panel--controls {
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      gap: 6px;
      background: unset;
      background-image: none;
      background-color: unset;
      box-shadow: inset -1px 0 0 0 rgba(255, 255, 255, 0.25);
      min-width: 0;
    }

    .controls-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .vf-intro-line {
      margin: 0;
      font-family: var(--font);
      font-size: clamp(10px, 2.6vw, 12px);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: 0.04em;
      color: rgba(236, 228, 216, 0.92);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.85);
    }

    .vf-intro-line--secondary {
      font-size: clamp(9px, 2.4vw, 11px);
      line-height: 1.6;
      color: rgba(220, 214, 204, 0.62);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .vf-intro-line--secondary.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .vf-guidance.is-muted {
      opacity: 0.35;
    }

    .vf-hud-bottom {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      min-width: 0;
      margin: 0;
      width: auto;
      max-width: 100%;
    }

    .vf-aperture--playback .vf-hud {
      position: static;
      inset: auto;
      display: block;
      border-radius: 0;
    }

    .vf-guidance {
      margin: 0;
      padding: 0 14px;
      pointer-events: none;
      text-align: center;
    }

    .vf-guidance-line {
      margin: 0;
      font-family: var(--font);
      font-size: clamp(6px, 1.8vw, 8px);
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: 0.03em;
      color: rgba(236, 228, 216, 0.78);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.88);
    }

    .vf-guidance-prefix {
      color: rgba(200, 194, 186, 0.65);
    }

    .vf-guidance-cursor { color: rgba(200, 194, 186, 0.5); font-weight: 500; }
    .vf-guidance-cursor.is-done { opacity: 0.35; animation: none; }

    .vf-alert {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: clamp(12px, 3vh, 18px);
      padding: clamp(28px, 9vw, 40px) clamp(22px, 7vw, 32px);
      font-family: var(--font);
      background: rgba(58, 54, 50, 0.9);
      border-radius: var(--viewport-radius);
      border: 1px solid rgba(0, 0, 0, 0.25);
      box-shadow: var(--neu-in);
      pointer-events: none;
      text-align: center;
    }

    .vf-alert.is-visible {
      display: flex;
    }

    .onboarding-overlay:not(.is-done) ~ * .vf-alert,
    .device:has(.onboarding-overlay:not(.is-done)) .vf-alert {
      display: none !important;
    }

    .vf-alert-line {
      margin: 0;
      max-width: 26em;
      font-family: var(--font);
      font-size: clamp(10px, 2.6vw, 12px);
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: 0.04em;
      color: rgba(236, 228, 216, 0.92);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.85);
    }

    #display {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      box-sizing: border-box;
      border-radius: var(--viewport-radius);
      background: unset;
      color: rgba(28, 28, 28, 0);
    }

    .vf-hud {
      position: static;
      padding: 0;
      display: block;
      pointer-events: none;
    }

    .device-module-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      justify-items: stretch;
      flex-shrink: 0;
    }

    .energy-module {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }

    .module-label {
      margin: 0;
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .energy-dot-matrix,
    #energyDotMatrix {
      --energy-grid: 16;
      display: grid;
      grid-template-columns: repeat(var(--energy-grid), minmax(0, 1fr));
      grid-template-rows: repeat(var(--energy-grid), minmax(0, 1fr));
      gap: clamp(1px, 0.28vw, 2px);
      padding: clamp(7px, 2.2vw, 11px);
      width: min(100%, 88px);
      aspect-ratio: 1;
      justify-self: center;
      box-sizing: border-box;
      border-radius: 6px;
      background: linear-gradient(155deg, var(--body) 0%, var(--body-deep) 55%, var(--body-dark) 100%);
      box-shadow: var(--neu-in);
      border: 1px solid rgba(0, 0, 0, 0.1);
      overflow: hidden;

    .energy-dot {
      place-self: center;
      width: 88%;
      height: 88%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #2b2b2b 0%, #141414 72%);
      box-shadow:
        inset 1px 1px 2px rgba(0, 0, 0, 0.65),
        inset -0.5px -0.5px 0 rgba(255, 255, 255, 0.04);
      transition: background 0.12s linear, box-shadow 0.12s linear;

      background: transparent;
      box-shadow: none;

    .energy-dot.is-active {
      background: radial-gradient(circle at 38% 30%, #d9d9d9 0%, #bfbfbf 45%, #9f9f9f 100%);
      box-shadow:
        inset 0 1px 2px rgba(0, 0, 0, 0.5),
        0 0 2px rgba(255, 255, 255, 0.3);

      gap: 4px;
      align-items: stretch;
      justify-self: stretch;
    }

      border-radius: 6px;

      border: 1px solid rgba(255, 255, 255, 0.08);

    .lcd-screen {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 3px;
      padding: 6px 8px;

      width: 100%;

      border-radius: 3px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 0, 0, 0.4);

      align-items: center;
    }

      width: 18px;
      height: 30px;

    .seg {
      position: absolute;
      background: var(--lcd-ink);
      opacity: 0.1;
      border-radius: 1px;
      transition: opacity 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }

    .seg.is-on {
      opacity: 1;
      background: #4a4034;
    }

    .lcd-screen.is-active .seg.is-on {
      background: #6a635c;
      box-shadow: none;
    }

    .seg-a { top: 0; left: 3px; right: 3px; height: 3px; }
    .seg-b { top: 3px; right: 0; width: 3px; height: 11px; }
    .seg-c { bottom: 3px; right: 0; width: 3px; height: 11px; }
    .seg-d { bottom: 0; left: 3px; right: 3px; height: 3px; }
    .seg-e { bottom: 3px; left: 0; width: 3px; height: 11px; }
    .seg-f { top: 3px; left: 0; width: 3px; height: 11px; }
    .seg-g { top: 13px; left: 3px; right: 3px; height: 3px; }

    .lcd-unit {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--lcd-ink);
      opacity: 0.35;
      transition: color 0.12s ease, opacity 0.12s ease;
    }

    .lcd-screen.is-active .lcd-unit {
      color: var(--ink-muted);
      opacity: 0.85;
    }

    .hw-deck {

      flex: 1;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: stretch;
      gap: 0;
      min-height: 0;
      padding: 4px 6px;
    }

    .hw-deck-side {

      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;

    .hw-deck-unit {

      align-items: center;

    .hw-btn-label {
      font-family: var(--font);
      font-size: 6px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      white-space: nowrap;
      text-align: center;
      line-height: 1.2;
    }

    .hw-btn {
      position: relative;

      background: linear-gradient(180deg, #15171a 0%, #090a0c 100%);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.72),
        inset 0 -1px 1px rgba(255, 255, 255, 0.04),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03);

    .rec-toggle-pill {
      position: absolute;

    .hw-btn--rec-toggle.is-active .rec-toggle-pill {
      left: 10px;
      background: linear-gradient(180deg, #ff3a3a 0%, #de1414 100%);
      box-shadow:
        inset 0 1px 1px rgba(255, 210, 210, 0.42),
        0 0 8px rgba(255, 35, 35, 0.45);
    }

    .hw-btn--rec-toggle.is-capturing .rec-toggle-pill {
      left: 10px;
      background: linear-gradient(180deg, #ff3a3a 0%, #de1414 100%);
      box-shadow:
        inset 0 1px 1px rgba(255, 210, 210, 0.42),

    .hw-btn--rec-toggle:active:not(:disabled) {
      transform: scale(0.985);
      box-shadow:
        inset 0 3px 5px rgba(0, 0, 0, 0.78),
        inset 0 -1px 1px rgba(255, 255, 255, 0.03),
        inset 0 0 0 1px rgba(255, 255, 255, 0.02);

    .hw-btn--rec-toggle:disabled {
      opacity: 1;
      cursor: default;

    .hw-btn-rec-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-rec);
      box-shadow: 0 0 8px var(--accent-rec-glow), inset 0 -1px 2px rgba(0, 0, 0, 0.35);
    }

    @keyframes recDotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.88); }
    }

    .hw-btn-stop-icon {
      width: 13px;
      height: 13px;
      border-radius: 2px;
      background: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .hw-btn--pause-gloss {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid #1f242a;
      display: flex;
      align-items: center;

      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.92) 0%, rgba(210, 229, 247, 0.42) 12%, rgba(38, 48, 58, 0) 34%),
        radial-gradient(circle at 50% 82%, rgba(210, 229, 247, 0.36) 0%, rgba(38, 48, 58, 0) 22%),
        linear-gradient(180deg, #303843 0%, #1a1f25 58%, #11151a 100%);
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.06),
        inset 0 -8px 12px rgba(0, 0, 0, 0.45),
        0 2px 4px rgba(0, 0, 0, 0.55);
    }

    .hw-btn--pause-gloss::before {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.72),
        inset 0 -1px 2px rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .hw-btn--pause-gloss:active:not(:disabled) {
      transform: scale(0.97);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.04),
        inset 0 8px 12px rgba(0, 0, 0, 0.5);
    }

    .hw-btn--pause-gloss:active:not(:disabled)::before {
      box-shadow:
        inset 0 3px 6px rgba(0, 0, 0, 0.82),
        inset 0 -1px 1px rgba(255, 255, 255, 0.03);
    }

    .hw-btn-pause-icon {
      position: relative;
      z-index: 1;
      width: 14px;
      height: 16px;
      display: block;
      flex-shrink: 0;
    }

    .hw-btn-pause-icon::before,
    .hw-btn-pause-icon::after {
      content: "";
      position: absolute;
      top: 0;
      width: 4px;
      height: 100%;
      border-radius: 1px;
      background: linear-gradient(180deg, #07090c 0%, #141920 100%);
      box-shadow:
        inset 0 1px 3px rgba(0, 0, 0, 0.95),
        inset 0 -1px 1px rgba(255, 255, 255, 0.05);
    }

    .hw-btn-pause-icon::before { left: 1px; }
    .hw-btn-pause-icon::after { right: 1px; }

    .hw-btn--pause-gloss:active:not(:disabled) .hw-btn-pause-icon::before,
    .hw-btn--pause-gloss:active:not(:disabled) .hw-btn-pause-icon::after {
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.98),
        inset 0 -1px 1px rgba(255, 255, 255, 0.02);
    }

    .hw-dpad-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hw-dpad-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .hw-dpad-label-side {
      width: 2.8em;
      flex-shrink: 0;
      text-align: center;
      line-height: 1.2;
    }

    .hw-dpad {
      position: relative;
      width: var(--dpad-size);
      height: var(--dpad-size);
      min-width: var(--dpad-size);
      min-height: var(--dpad-size);
      max-width: var(--dpad-size);
      max-height: var(--dpad-size);
      aspect-ratio: 1;
      flex: 0 0 var(--dpad-size);
      box-sizing: border-box;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.38);
      background: radial-gradient(
        circle at 32% 28%,
        #2c3036 0%,
        #252930 36%,
        #1d2127 68%,
        #15181d 100%
      );
      box-shadow:
        -1px -1px 2px rgba(255, 255, 255, 0.08),
        1px 2px 3px rgba(0, 0, 0, 0.42),
        2px 4px 8px rgba(0, 0, 0, 0.28);
    }

    .hw-dpad::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(
        circle at 28% 22%,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.015) 38%,
        transparent 72%
      );
      mask: radial-gradient(circle, transparent 0 47%, #000 47% 100%);
      -webkit-mask: radial-gradient(circle, transparent 0 47%, #000 47% 100%);
      pointer-events: none;
      z-index: 1;
    }

    .hw-dpad::after {
      content: "";
      position: absolute;
      inset: calc(var(--dpad-size) * 0.055);
      border-radius: 50%;
      background:
        linear-gradient(
          45deg,
          transparent calc(50% - 0.5px),
          rgba(90, 98, 108, 0.12) calc(50% - 0.5px),
          rgba(90, 98, 108, 0.12) calc(50% + 0.5px),
          transparent calc(50% + 0.5px)
        ),
        linear-gradient(
          -45deg,
          transparent calc(50% - 0.5px),
          rgba(90, 98, 108, 0.1) calc(50% - 0.5px),
          rgba(90, 98, 108, 0.1) calc(50% + 0.5px),
          transparent calc(50% + 0.5px)
        ),
        radial-gradient(
          circle at 36% 30%,
          #1a1e23 0%,
          #121519 58%,
          #0c0e11 100%
        );
      box-shadow:
        inset 0 3px 8px rgba(0, 0, 0, 0.68),
        inset 0 1px 3px rgba(0, 0, 0, 0.52),
        inset 0 0 0 1px rgba(0, 0, 0, 0.38);
      mask: radial-gradient(circle, transparent 0 19%, #000 19% 100%);
      -webkit-mask: radial-gradient(circle, transparent 0 19%, #000 19% 100%);
      pointer-events: none;
      z-index: 2;
    }

    .hw-btn--wing {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--dpad-size) * 0.095);
      font-weight: 600;
      color: rgba(216, 221, 227, 0.9);
      z-index: 3;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .hw-btn--up,
    .hw-btn--down {
      width: calc(var(--dpad-size) * 0.512);
      height: calc(var(--dpad-size) * 0.333);
      left: 50%;
      transform: translateX(-50%);
    }

    .hw-btn--left,
    .hw-btn--right {
      width: calc(var(--dpad-size) * 0.333);
      height: calc(var(--dpad-size) * 0.512);
      top: 50%;
      transform: translateY(-50%);
    }

    .hw-btn--up { top: calc(var(--dpad-size) * 0.036); }

    .hw-btn--down { bottom: calc(var(--dpad-size) * 0.036); }

    .hw-btn--left { left: calc(var(--dpad-size) * 0.036); }

    .hw-btn--right { right: calc(var(--dpad-size) * 0.036); }

    .hw-btn--wing:active:not(:disabled) {
      opacity: 0.74;
    }

    .hw-btn--up:active:not(:disabled) { transform: translateX(-50%) scale(0.97); }
    .hw-btn--down:active:not(:disabled) { transform: translateX(-50%) scale(0.97); }
    .hw-btn--left:active:not(:disabled) { transform: translateY(-50%) scale(0.97); }
    .hw-btn--right:active:not(:disabled) { transform: translateY(-50%) scale(0.97); }

    .hw-dpad-arrow,

      justify-content: center;

      background: radial-gradient(
        circle at 38% 32%,
        #343941 0%,
        #282c33 42%,
        #1c2026 76%,
        #14171c 100%
      );
      border: 1px solid rgba(0, 0, 0, 0.48);
      box-shadow:
        -1px -1px 1px rgba(255, 255, 255, 0.06),

    .hw-btn--play.is-active {
      background: radial-gradient(
        circle at 38% 32%,
        #262a30 0%,
        #1e2228 42%,
        #161920 76%,
        #101317 100%
      );
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.62),

    .hw-play-icon {

      margin-left: calc(var(--dpad-size) * 0.024);

      border-color: transparent transparent transparent var(--ink);

    .memory-strip {

      min-height: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: pan-x;
      contain: layout style;
    }

    .memory-strip.is-dragging { cursor: grabbing; }

    .memory-strip-track {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      height: 100%;
      will-change: transform;
    }

    .memory-strip-ticks {

      right: 0;
      top: 0;
      bottom: 0;
      pointer-events: none;

    .memory-ball img {

      width: 100%;
      height: 100%;

    .timeline-hint {

      inset: 0;
      display: none;

      justify-content: center;
      margin: 0;

    const bgPalette = [
      { l: 0,   r: 0,  g: 0,  b: 0  },
      { l: 90,  r: 6,  g: 16, b: 34 },

    const THERMAL_BG_GAMMA = 0.98;
    const THERMAL_LUM_GAMMA = 0.78;
    const THERMAL_LUM_CAP_IDLE = 228;
    const THERMAL_LUM_CAP_FACE = 238;
    const THERMAL_OUTPUT_LIFT = 16;
    const THERMAL_OUTPUT_CONTRAST = 1.14;
    const THERMAL_OUTPUT_SAT = 1.28;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function blurEmberField(src, dst, w, h) {
      for (let y = 0; y < h; y += 1) {
        const row = y * w;
        const rowUp = y > 0 ? row - w : row;
        const rowDown = y < h - 1 ? row + w : row;
        for (let x = 0; x < w; x += 1) {
          const p = row + x;
          let sum = src[p] * 0.18;
          let weight = 0.18;
          const add = (idx, wgt) => {
            if (idx >= 0 && idx < w * h) {
              sum += src[idx] * wgt;
              weight += wgt;
            }
          };
          add(p - 1, 0.12);
          add(p + 1, 0.12);
          add(rowUp + x, 0.12);
          add(rowDown + x, 0.12);
          add(rowUp + x - 1, 0.055);
          add(rowUp + x + 1, 0.055);
          add(rowDown + x - 1, 0.055);
          add(rowDown + x + 1, 0.055);
          if (x > 1) add(p - 2, 0.035);
          if (x < w - 2) add(p + 2, 0.035);
          if (y > 1) add(p - w * 2, 0.035);
          if (y < h - 2) add(p + w * 2, 0.035);
          dst[p] = sum / weight;
        }
      }
    }

    function sampleEmberBilinear(field, w, h, fx, fy) {
      const x0 = clamp(Math.floor(fx), 0, w - 1);
      const y0 = clamp(Math.floor(fy), 0, h - 1);
      const x1 = clamp(x0 + 1, 0, w - 1);
      const y1 = clamp(y0 + 1, 0, h - 1);
      const tx = fx - x0;
      const ty = fy - y0;
      const i00 = field[y0 * w + x0];
      const i10 = field[y0 * w + x1];
      const i01 = field[y1 * w + x0];
      const i11 = field[y1 * w + x1];
      const top = lerp(i00, i10, tx);
      const bot = lerp(i01, i11, tx);
      return lerp(top, bot, ty);
    }

    function emberIndexFromPixel(x, y, procW, procH, emberW, emberH) {
      const ex = clamp(Math.floor(((x + 0.5) * emberW) / procW), 0, emberW - 1);
      const ey = clamp(Math.floor(((y + 0.5) * emberH) / procH), 0, emberH - 1);
      return ey * emberW + ex;
    }

    function getBodyTrailBounds(hasFace, cx, cy, rx, ry, faceHeight, procH) {
      if (!hasFace) {
        return { bodyCx: 0, bodyCy: 0, bodyRx: 1, bodyRyUp: 1, bodyRyDown: 1 };
      }
      return {
        bodyCx: cx,
        bodyCy: cy + faceHeight * 0.95,
        bodyRx: Math.max(58, rx * 3.05),
        bodyRyUp: Math.max(70, ry * 1.55),
        bodyRyDown: Math.max(procH * 0.52, ry * 4.2, faceHeight * 2.8)
      };
    }

    function bodyTrailContain(x, y, bounds) {
      const ex = (x - bounds.bodyCx) / bounds.bodyRx;
      const ryEff = y >= bounds.bodyCy ? bounds.bodyRyDown : bounds.bodyRyUp;
      const ey = (y - bounds.bodyCy) / ryEff;
      return clamp(1 - Math.sqrt((ex * ex) + (ey * ey)), 0, 1);
    }

    function moodyTrailRgb(intensity, energy, speedBoost) {
      const local = clamp(intensity, 0, 1);
      const speed = clamp(speedBoost, 0, 1);
      const emotionalWarmth = clamp(energy * 0.05, 0, 0.08);
      // Prioritize per-region speed so trail hue varies by local movement velocity.
      const motionHeat = clamp((local * 0.34) + (speed * 0.98) + emotionalWarmth, 0, 1.12);

      // Slow movement: subtle purple.
      if (motionHeat < 0.3) {
        const u = motionHeat / 0.3;
        return {
          r: Math.round(lerp(48, 108, u)),
          g: Math.round(lerp(10, 22, u)),
          b: Math.round(lerp(168, 152, u))
        };
      }
      // Medium: purple -> magenta/pink.
      if (motionHeat < 0.55) {
        const u = (motionHeat - 0.3) / 0.25;
        return {
          r: Math.round(lerp(108, 228, u)),
          g: Math.round(lerp(22, 32, u)),
          b: Math.round(lerp(152, 98, u))
        };
      }
      // Fast: magenta/pink -> orange.
      if (motionHeat < 0.82) {
        const u = (motionHeat - 0.55) / 0.27;
        return {
          r: Math.round(lerp(228, 255, u)),
          g: Math.round(lerp(32, 148, u)),
          b: Math.round(lerp(98, 12, u))
        };
      }
      // Very fast: orange -> yellow/amber (still no white trails).
      const u = (motionHeat - 0.82) / 0.33;
      return {
        r: 255,
        g: Math.round(lerp(148, 252, u)),
        b: Math.round(lerp(12, 8, u))
      };
    }

    function polishThermalPixel(r, g, b, peakRoll = 0) {
      const gray = (0.299 * r) + (0.587 * g) + (0.114 * b);
      const bright = clamp((gray - 118) / 132, 0, 1);
      const liftScale = 1 - (peakRoll * bright * 0.62);
      const satScale = 1 - (peakRoll * bright * 0.24);
      const contrastScale = 1 - (peakRoll * bright * 0.18);
      let rr = gray + ((r - gray) * (THERMAL_OUTPUT_SAT * satScale));
      let gg = gray + ((g - gray) * (THERMAL_OUTPUT_SAT * satScale));
      let bb = gray + ((b - gray) * (THERMAL_OUTPUT_SAT * satScale));
      const lift = THERMAL_OUTPUT_LIFT * liftScale;
      const contrast = 1 + ((THERMAL_OUTPUT_CONTRAST - 1) * contrastScale);
      rr = ((rr - 128) * contrast) + 128 + lift;
      gg = ((gg - 128) * contrast) + 128 + (lift * 0.94);
      bb = ((bb - 128) * contrast) + 128 + (lift * 0.48);
      return {
        r: Math.round(clamp(rr, 0, 255)),
        g: Math.round(clamp(gg, 0, 255)),
        b: Math.round(clamp(bb, 0, 255))
      };
    }

    function compressFaceHighlights(r, g, b, peakRoll, faceWeight) {
      if (peakRoll < 0.04 || faceWeight < 0.12) {
        return { r, g, b };
      }
      const lum = ((0.299 * r) + (0.587 * g) + (0.114 * b)) / 255;
      const threshold = lerp(0.5, 0.4, peakRoll);
      if (lum <= threshold) {
        return { r, g, b };
      }
      const excess = clamp((lum - threshold) / (1 - threshold), 0, 1);
      const compress = peakRoll * faceWeight * excess * excess * 0.72;
      return {
        r: Math.round(clamp(lerp(r, 228, compress), 0, 255)),
        g: Math.round(clamp(lerp(g, 108, compress), 0, 255)),
        b: Math.round(clamp(lerp(b, 42, compress), 0, 255))
      };
    }

    function facePeakColor(expression, heatMix) {
      const t = clamp(heatMix, 0, 1);
      if (expression === "sad") {
        // Sad mode peaks in cyan instead of yellow.
        return {
          r: Math.round(lerp(58, 118, t)),
          g: Math.round(lerp(186, 246, t)),
          b: Math.round(lerp(212, 255, t))
        };
      }
      if (expression === "angry") {
        // Angry mode peaks in red.
        return {
          r: 255,
          g: Math.round(lerp(72, 26, t)),
          b: Math.round(lerp(48, 16, t))
        };
      }
      return {
        r: 255,
        g: Math.round(lerp(200, 212, t)),
        b: Math.round(lerp(55, 72, t))
      };
    }

    function samplePalette(palette, luminance) {
      const value = clamp(luminance, 0, 255);
      for (let i = 0; i < palette.length - 1; i += 1) {
        const a = palette[i];
        const b = palette[i + 1];
        if (value >= a.l && value <= b.l) {
          const t = (value - a.l) / (b.l - a.l || 1);
      return {
            r: Math.round(lerp(a.r, b.r, t)),
            g: Math.round(lerp(a.g, b.g, t)),
            b: Math.round(lerp(a.b, b.b, t))
          };
        }
      }
      const tail = palette[palette.length - 1];
      return { r: tail.r, g: tail.g, b: tail.b };
    }

    function buildFixedLUTFromPalette(palette) {
      const lut = new Array(256);
      for (let i = 0; i < 256; i += 1) {

      return lut;

    function ensureThermalLUTs() {
      if (!bgLUT.length) bgLUT = buildFixedLUTFromPalette(bgPalette);
      if (!coolLUT.length) coolLUT = buildFixedLUTFromPalette(coolPalette);
      if (!hotLUT.length) hotLUT = buildFixedLUTFromPalette(hotPalette);
      if (!activeLUT.length) rebuildActiveLUT(true);
    }

    function rebuildActiveLUT(force = false) {
      if (!coolLUT.length || !hotLUT.length) ensureThermalLUTs();
      if (!force && Math.abs(energyScore - lastLutEnergy) <= 0.012) return;
      const lut = new Array(256);
      for (let i = 0; i < 256; i += 1) {
        const coolColor = coolLUT[i];
        const hotColor = hotLUT[i];
        lut[i] = {
          r: Math.round(coolColor.r + (hotColor.r - coolColor.r) * energyScore),
          g: Math.round(coolColor.g + (hotColor.g - coolColor.g) * energyScore),
          b: Math.round(coolColor.b + (hotColor.b - coolColor.b) * energyScore)
        };
      }
      activeLUT = lut;
      lastLutEnergy = energyScore;
      if (!lutLogged) {
        console.log("LUT ready");
        lutLogged = true;
      }
    }

    /** object-fit: cover — fill viewfinder, crop overflow. */
    function getVideoFitTransform(targetW, targetH) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;
      const scale = Math.max(targetW / vw, targetH / vh);
      return {
        scale,
        dx: (targetW - (vw * scale)) / 2,
        dy: (targetH - (vh * scale)) / 2
      };
    }

    function mapDetectBoxToTarget(box, targetW, targetH) {
      if (!box) return null;
      const detectTransform = getVideoFitTransform(detectCanvas.width, detectCanvas.height);
      const targetTransform = getVideoFitTransform(targetW, targetH);
      if (!detectTransform || !targetTransform) return null;

      const srcX = (box.x - detectTransform.dx) / detectTransform.scale;
      const srcY = (box.y - detectTransform.dy) / detectTransform.scale;
      const srcW = box.width / detectTransform.scale;
      const srcH = box.height / detectTransform.scale;

      return {
        x: srcX * targetTransform.scale + targetTransform.dx,
        y: srcY * targetTransform.scale + targetTransform.dy,
        width: srcW * targetTransform.scale,
        height: srcH * targetTransform.scale
      };
    }

    let canvasDpr = 1;
    let dialLayoutTimer = null;
    let lastCanvasLayoutW = 0;
    let lastCanvasLayoutH = 0;
    let canvasLayoutReady = false;

    function isMobileLayout() {
      return window.matchMedia("(max-width: 640px)").matches;
    }

    function measureDisplayAperture() {
      const rect = canvas?.getBoundingClientRect();
      return {
        w: Math.floor(rect?.width || 0),
        h: Math.floor(rect?.height || 0)
      };
    }

    function layoutViewfinderFromFeed() {
      resizeCanvases();
    }

    function resizeCanvases() {
      if (!canvas) return;

      const { w, h } = measureDisplayAperture();
      if (w < 16 || h < 16) return;
      if (w === lastCanvasLayoutW && h === lastCanvasLayoutH) return;

      lastCanvasLayoutW = w;
      lastCanvasLayoutH = h;
      displayW = w;
      displayH = h;
      canvasDpr = 1;
      canvas.width = Math.max(1, Math.floor(displayW * canvasDpr));
      canvas.height = Math.max(1, Math.floor(displayH * canvasDpr));
      ctx.setTransform(canvasDpr, 0, 0, canvasDpr, 0, 0);
      ctx.imageSmoothingEnabled = true;

      const procW = Math.max(240, Math.min(MAX_PROCESS_WIDTH, displayW));
      const procH = Math.max(1, Math.round((procW / displayW) * displayH));
      offscreen.width = procW;
      offscreen.height = procH;
      canvasLayoutReady = true;

      if (!resizeCanvases.logged) {
        console.log("viewfinder size", displayW, "x", displayH, "@", canvasDpr.toFixed(1), "dpr");
        resizeCanvases.logged = true;
      }
    }

    function drawMirroredVideoFit(ctx2d, targetW, targetH, clear = true) {
      const transform = getVideoFitTransform(targetW, targetH);
      if (!transform) {
        ctx2d.fillStyle = "#000000";
        ctx2d.fillRect(0, 0, targetW, targetH);
        return false;
      }
      if (clear) {
        ctx2d.fillStyle = "#000000";
        ctx2d.fillRect(0, 0, targetW, targetH);
      }
      const drawW = video.videoWidth * transform.scale;
      const drawH = video.videoHeight * transform.scale;
      ctx2d.save();
      ctx2d.translate(targetW, 0);
      ctx2d.scale(-1, 1);
      ctx2d.drawImage(video, transform.dx, transform.dy, drawW, drawH);
      ctx2d.restore();
      return true;
    }

    function drawVideoCover() {
      return drawMirroredVideoFit(offCtx, offscreen.width, offscreen.height, false);
    }

    function drawVideoCoverTo(ctx2d, targetW, targetH) {
      return drawMirroredVideoFit(ctx2d, targetW, targetH, true);
    }

    function isEmotionallyNeutral(expressions) {
      if (!expressions) return true;
      const neutral = expressions.neutral || 0;
      const happy = expressions.happy || 0;
      const sad = expressions.sad || 0;
      const surprised = expressions.surprised || 0;
      const angry = expressions.angry || 0;
      const fearful = expressions.fearful || 0;
      const disgusted = expressions.disgusted || 0;
      const emotionPeak = Math.max(happy, sad, surprised, angry, fearful, disgusted);
      if (neutral >= 0.45 && neutral >= emotionPeak + 0.05) return true;
      if (neutral >= 0.38 && neutral >= emotionPeak - 0.02) return true;
      if (emotionPeak < 0.28) return true;
      if (emotionPeak < 0.38 && neutral >= 0.3) return true;
      return false;
    }

    function computePositiveIntensity(expressions) {
      const happy = expressions.happy || 0;
      const surprised = expressions.surprised || 0;
      const neutral = expressions.neutral || 0;
      const sad = expressions.sad || 0;
      const angry = expressions.angry || 0;
      if (isEmotionallyNeutral(expressions)) return 0;
      if (happy < 0.5 && surprised < 0.48) return 0;
      if (neutral > 0.34 && happy < 0.58 && surprised < 0.54) return 0;
      const positiveSignal = (happy * 1.06) + (surprised * 0.72);
      const dampen = (neutral * 0.68) + (sad * 0.18) + (angry * 0.12);
      const raw = positiveSignal - dampen;
      if (raw < 0.34) return 0;
      return clamp(Math.pow(clamp(raw, 0, 1) / 0.96, 1.24), 0, 1);
    }

    function computeSadIntensity(expressions) {
      const sad = expressions.sad || 0;
      const fearful = expressions.fearful || 0;
      const neutral = expressions.neutral || 0;
      const happy = expressions.happy || 0;
      const angry = expressions.angry || 0;
      if (isEmotionallyNeutral(expressions)) return 0;
      if (sad < 0.48 && fearful < 0.44) return 0;
      if (neutral > 0.34 && sad < 0.54 && fearful < 0.48) return 0;
      const sadSignal = (sad * 1.2) + (fearful * 0.42);
      const dampen = (neutral * 0.64) + (happy * 0.22) + (angry * 0.12);
      const raw = sadSignal - dampen;
      if (raw < 0.32) return 0;
      return clamp(Math.pow(clamp(raw, 0, 1) / 0.94, 1.18), 0, 1);
    }

    function computeExpressionIntensity(expressions) {
      if (isEmotionallyNeutral(expressions)) return 0;
      const positive = computePositiveIntensity(expressions);
      const sad = computeSadIntensity(expressions);
      const sadRaw = expressions.sad || 0;
      const neutral = expressions.neutral || 0;
      const useSadPath = moodExpressionStable === "sad"
        && sadRaw > 0.32
        && sadRaw > neutral - 0.05;
      return useSadPath ? Math.max(sad, positive * 0.08) : Math.max(positive, sad * 0.08);
    }

    function getLiveExpression(expressions) {
      if (isEmotionallyNeutral(expressions)) {
        return { name: "neutral", score: expressions.neutral || 0.5 };
      }
      let bestName = "neutral";
      let bestScore = 0;
      const neutralScore = expressions.neutral || 0;
      for (const [name, score] of Object.entries(expressions)) {
        if (score > bestScore) {
          bestName = name;
          bestScore = score;
        }
      }
      if (
        bestName !== "neutral" &&
        neutralScore > bestScore - 0.07 &&
        neutralScore > 0.32
      ) {
        bestName = "neutral";
        bestScore = neutralScore;
      }
      if (bestScore < 0.38) {
        bestName = "neutral";
        bestScore = Math.max(neutralScore, bestScore);
      }
      return { name: bestName, score: bestScore };
    }

    function updateMoodState(expressions) {
      const sadRaw = clamp(expressions?.sad || 0, 0, 1);
      const angryRaw = clamp(expressions?.angry || 0, 0, 1);
      const neutralRaw = clamp(expressions?.neutral || 0, 0, 1);

      const sadTarget = sadRaw > 0.24 ? sadRaw : 0;
      const angryTarget = angryRaw > 0.32 ? angryRaw : 0;

      moodSadLatch = lerp(moodSadLatch, sadTarget, sadTarget > moodSadLatch ? 0.34 : 0.06);
      moodAngryLatch = lerp(moodAngryLatch, angryTarget, angryTarget > moodAngryLatch ? 0.28 : 0.06);

      if (neutralRaw > 0.42 && neutralRaw > sadRaw + 0.1 && neutralRaw > angryRaw + 0.08) {
        moodSadLatch = lerp(moodSadLatch, 0, 0.28);
        moodAngryLatch = lerp(moodAngryLatch, 0, 0.24);
        if (moodSadLatch < 0.28 && moodAngryLatch < 0.28) moodExpressionStable = "neutral";
      }

      if (moodExpressionStable === "sad") {
        if (moodSadLatch < 0.2 && moodAngryLatch > 0.48) moodExpressionStable = "angry";
        else if (moodSadLatch < 0.16) moodExpressionStable = "neutral";
      } else if (moodExpressionStable === "angry") {
        if (moodAngryLatch < 0.2 && moodSadLatch > 0.48) moodExpressionStable = "sad";
        else if (moodAngryLatch < 0.16) moodExpressionStable = "neutral";
      } else {
        if (moodSadLatch > 0.48 && moodSadLatch > moodAngryLatch + 0.08 && sadRaw > 0.34 && sadRaw > neutralRaw - 0.06) {
          moodExpressionStable = "sad";
        } else if (moodAngryLatch > 0.52 && moodAngryLatch > moodSadLatch + 0.08) {
          moodExpressionStable = "angry";
        }
      }
    }

    function updateLiveEnergy() {
      const isSad = moodExpressionStable === "sad";
      const isNeutral = isEmotionallyNeutral(lastExpressions)
        || lastDetection?.expression === "neutral";
      const intensityTarget = isNeutral ? 0 : targetExpressionIntensity;
      const intLerp = intensityTarget > expressionIntensity
        ? (isSad ? 0.22 : 0.18)
        : (isNeutral ? 0.4 : 0.2);
      expressionIntensity = lerp(expressionIntensity, intensityTarget, intLerp);
      if (isNeutral) expressionIntensity = Math.min(expressionIntensity, 0.04);
      const faceLerp = targetFaceScore > faceScore ? 0.28 : 0.1;
      faceScore = lerp(faceScore, targetFaceScore, faceLerp);
      const intensityWindow = clamp((expressionIntensity - 0.18) / 0.82, 0, 1);
      const curvePow = isSad ? 1.34 : 1.54;
      const emotionCurve = Math.pow(intensityWindow, curvePow);
      const confidence = clamp(((lastDetection?.probability || 0) - 0.55) / 0.45, 0, 1);
      const topCap = clamp(0.88 + (Math.pow(confidence, 1.4) * 0.12), 0.88, 1);
      const expressionEnergy = lerp(0.03, topCap, emotionCurve);
      const nextEnergy = clamp(expressionEnergy, 0, 1);
      const energyLerp = isNeutral
        ? 0.36
        : (nextEnergy > energyScore ? (isSad ? 0.22 : 0.18) : 0.22);
      energyScore = lerp(energyScore, nextEnergy, energyLerp);
      if (nextEnergy >= 0.995) energyScore = Math.max(energyScore, nextEnergy);
      if (isNeutral) energyScore = Math.min(energyScore, 0.22);
      rebuildActiveLUT();
    }

    function moveTowards(value, target, step) {
      if (value < target) return Math.min(value + step, target);
      if (value > target) return Math.max(value - step, target);
      return value;
    }

    function updateClockHands() {
      if (!footerClock) return;
      const now = new Date();
      footerClock.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getEnergyDisplayPercent() {
      return Math.round(clamp(energyScore, 0, 1) * 100);
    }

    function hasStrongEmotionSignal(expressions) {
      if (!expressions || isEmotionallyNeutral(expressions)) return false;
      const happy = expressions.happy || 0;
      const surprised = expressions.surprised || 0;
      const sad = expressions.sad || 0;
      const fearful = expressions.fearful || 0;
      const neutral = expressions.neutral || 0;
      if (moodExpressionStable === "sad") {
        return sad >= 0.44 && sad > happy + 0.08 && sad > neutral - 0.04;
      }
      const peakPositive = Math.max(happy, surprised);
      return peakPositive >= 0.4 && peakPositive > neutral + 0.06;
    }

    function isAtPeakEnergy() {
      if (peopleCount === 0 && !lastFaceBox) return false;
      if (!lastExpressions || isEmotionallyNeutral(lastExpressions)) return false;
      if (!lastDetection || lastDetection.expression === "neutral") return false;
      if (expressionIntensity < 0.78) return false;
      if (!hasStrongEmotionSignal(lastExpressions)) return false;
      if (getEnergyDisplayPercent() < 85) return false;

      const happy = lastExpressions.happy || 0;
      const sad = lastExpressions.sad || 0;
      const surprised = lastExpressions.surprised || 0;
      const neutral = lastExpressions.neutral || 0;

      if (moodExpressionStable === "sad") {
        return sad >= 0.4
          && sad > happy + 0.06
          && moodSadLatch >= 0.52;
      }

      const peakPositive = Math.max(happy, surprised);
      return peakPositive >= 0.42
        && peakPositive > neutral + 0.06
        && (happy >= 0.38 || surprised >= 0.36);
    }

    function getCaptureMood() {
      if (moodExpressionStable === "sad") return "sad";
      const ex = lastExpressions;
      if (ex) {
        const sadI = computeSadIntensity(ex);
        const happyI = computePositiveIntensity(ex);
        if (sadI > happyI + 0.06) return "sad";
      }
      if (moodSadLatch >= 0.52 && moodSadLatch > moodAngryLatch + 0.05) return "sad";
      return "happy";
    }

    function applyBallMood(ball, mood) {
      if (!ball) return;
      const resolved = mood === "sad" ? "sad" : "happy";
      ball.classList.remove("mood-happy", "mood-sad");
      ball.classList.add(resolved === "sad" ? "mood-sad" : "mood-happy");
      ball.dataset.captureMood = resolved;
    }

    function buildSegDigit(char) {
      const digit = document.createElement("span");
      digit.className = "seg-digit";
      digit.setAttribute("role", "presentation");
      ["a", "b", "c", "d", "e", "f", "g"].forEach((name) => {
        const seg = document.createElement("span");
        seg.className = `seg seg-${name}`;
        seg.dataset.segment = name;
        digit.appendChild(seg);
      });
      setSegDigitChar(digit, char);
      return digit;
    }

    function setSegDigitChar(digitEl, char) {
      const on = SEG_MAP[String(char)] || "";
      digitEl.querySelectorAll(".seg").forEach((seg) => {
        const name = seg.dataset.segment || "";
        seg.classList.toggle("is-on", on.includes(name));
      });
    }

    const THERMAL_LED_LUM_MIN = 42;
    const THERMAL_LED_LUM_MAX = 255;
    const THERMAL_LED_LUM_STEP = 26;

    function energyLedNoiseStep(hash) {
      const roll = hash % 100;
      if (roll < 68) return 0;
      if (roll < 84) return -1;
      return 1;
    }

    function energyThermalColorFromLum(lum) {
      ensureThermalLUTs();
      const idx = Math.min(255, Math.max(0, Math.round(clamp(lum, 0, 255))));
      const color = hotLUT[idx] || hotLUT[255];
      return {
        solid: `rgb(${color.r}, ${color.g}, ${color.b})`,
        glow: `rgba(${color.r}, ${color.g}, ${color.b}, 0.92)`
      };
    }

    function energyLedPixelThermalLum(col, row, index) {
      const baseT = ENERGY_LED_COLS <= 1 ? 0 : col / (ENERGY_LED_COLS - 1);
      const baseLum = lerp(THERMAL_LED_LUM_MIN, THERMAL_LED_LUM_MAX, baseT);
      const hash = ((col * 73856093) ^ (row * 19349663) ^ (index * 83492791)) >>> 0;
      const noiseStep = energyLedNoiseStep(hash);
      return clamp(
        baseLum + (noiseStep * THERMAL_LED_LUM_STEP),
        THERMAL_LED_LUM_MIN,
        THERMAL_LED_LUM_MAX
      );
    }

    function initEnergyLedBar() {
      if (!energyLedTrack) return;
      energyLedTrack.style.gridTemplateColumns = `repeat(${ENERGY_LED_COLS}, 1fr)`;
      energyLedTrack.style.gridTemplateRows = `repeat(${ENERGY_LED_ROWS}, 1fr)`;
      energyLedTrack.replaceChildren();
      energyLedSegments = [];
      for (let i = 0; i < ENERGY_LED_SEGMENTS; i += 1) {
        const seg = document.createElement("span");
        seg.className = "energy-led-seg";
        energyLedTrack.appendChild(seg);
        energyLedSegments.push(seg);
      }
    }

    function updateEnergyLedBar(percent, atCore, energyHot) {
      if (!energyLedSegments.length) return;
      const fillRatio = atCore ? 1 : clamp(energyScore, 0, 1);
      const activeCols = fillRatio >= 0.999
        ? ENERGY_LED_COLS
        : Math.min(ENERGY_LED_COLS, Math.round(fillRatio * ENERGY_LED_COLS));
      const fillKey = `${activeCols}:${atCore ? 1 : 0}:${energyHot ? 1 : 0}`;
      if (fillKey === lastEnergyLedFillKey) {
        if (energyLedBar) {
          energyLedBar.classList.toggle("is-hot", energyHot && !atCore);
          energyLedBar.classList.toggle("is-max", atCore);
        }
        return;
      }
      lastEnergyLedFillKey = fillKey;
      lastEnergyLedActiveCols = activeCols;
      energyLedSegments.forEach((seg, index) => {
        const col = index % ENERGY_LED_COLS;
        const row = Math.floor(index / ENERGY_LED_COLS);
        const on = col < activeCols;
        seg.classList.toggle("is-on", on);
        if (!on) {
          seg.style.removeProperty("--pixel-color");
          seg.style.removeProperty("--pixel-glow");
          return;
        }
        const c = energyThermalColorFromLum(energyLedPixelThermalLum(col, row, index));
        seg.style.setProperty("--pixel-color", c.solid);
        seg.style.setProperty("--pixel-glow", c.glow);
      });
      if (energyLedBar) {
        energyLedBar.classList.toggle("is-hot", energyHot && !atCore);
        energyLedBar.classList.toggle("is-max", atCore);
        energyLedBar.setAttribute(
          "aria-label",
          atCore ? "Energy level: maximum" : `Energy level: ${getEnergyDisplayPercent()} percent`
        );
      }
    }

    function getFacialExprDisplayValue() {
      return Math.round(clamp(expressionIntensity, 0, 1) * 100);
    }

    function getMovementDisplayValue() {
      return Math.round(clamp(moveLevelDisplay, 0, 1) * 100);
    }

    function updateReadouts() {
      if (facialExprReadout) {
        facialExprReadout.textContent = String(getFacialExprDisplayValue()).padStart(2, "0");
      }
      if (movementReadout) {
        movementReadout.textContent = String(getMovementDisplayValue()).padStart(2, "0");
      }
    }

    function updateInstrumentUI() {
      const energyPct = getEnergyDisplayPercent();
      const atCore = energyPct >= 100;
      const energyHot = energyPct >= 68 && !atCore;

      updateEnergyLedBar(energyPct, atCore, energyHot);
      updateReadouts();

      const memoryCount = getDialBallCount();
      const capturing = captureBusy || captureFinalizing;

      if (chipCapture) {
        chipCapture.disabled = capturing;
        chipCapture.classList.toggle("is-active", (atCore || energyHot) && !capturing);
        chipCapture.classList.toggle("is-capturing", capturing);
        chipCapture.title = capturing
          ? "Recording core memory…"
          : "Save a core memory now";
      }
      if (btnPrevRow) btnPrevRow.disabled = memoryCount === 0;
      if (btnNextRow) btnNextRow.disabled = memoryCount === 0;
      if (btnPlay) {
        btnPlay.disabled = memoryCount === 0;
        btnPlay.classList.toggle("is-active", !playbackPaused && memoryCount > 0);
      }
      if (btnStopPause) btnStopPause.disabled = memoryCount === 0;

      if (statusLed) statusLed.classList.toggle("is-warn", !modelsReady || peopleCount === 0);
    }

    function cloneCanvasSource(source) {
      if (!source?.width || !source?.height) {
        const fallback = document.createElement("canvas");
        fallback.width = 2;
        fallback.height = 2;
        return fallback;
      }
      const copy = document.createElement("canvas");
      copy.width = source.width;
      copy.height = source.height;
      copy.getContext("2d").drawImage(source, 0, 0);
      return copy;
    }

    function cloneFrameCanvas() {
      return cloneCanvasSource(offscreen);
    }

    function pushFrameSample(now) {
      if (now - lastFrameSampleAt < FRAME_SAMPLE_MS) return;
      if (offscreen.width < 1 || offscreen.height < 1) return;
      lastFrameSampleAt = now;
      try {
        frameRing.push(cloneFrameCanvas());
        const ringMax = PRE_BUFFER_FRAMES + POST_BUFFER_FRAMES + 6;
        while (frameRing.length > ringMax) frameRing.shift();
      } catch (error) {
        console.warn("Frame ring sample failed", error);
      }
    }

    function prepareGifFrames(frames) {
      const maxFrames = 16;
      const step = frames.length > maxFrames ? Math.ceil(frames.length / maxFrames) : 1;
      const out = [];
      for (let i = 0; i < frames.length; i += step) {
        const source = frames[i];
        if (!source?.width || !source?.height) continue;
        const canvas = document.createElement("canvas");
        canvas.width = GIF_OUT_WIDTH;
        canvas.height = GIF_OUT_HEIGHT;
        const cctx = canvas.getContext("2d");
        cctx.imageSmoothingEnabled = true;
        cctx.imageSmoothingQuality = "high";
        cctx.drawImage(source, 0, 0, GIF_OUT_WIDTH, GIF_OUT_HEIGHT);
        out.push(canvas);
      }
      if (!out.length) {
        const fallback = cloneFrameCanvas();
        const canvas = document.createElement("canvas");
        canvas.width = GIF_OUT_WIDTH;
        canvas.height = GIF_OUT_HEIGHT;
        const cctx = canvas.getContext("2d");
        cctx.imageSmoothingEnabled = true;
        cctx.imageSmoothingQuality = "high";
        cctx.drawImage(fallback, 0, 0, GIF_OUT_WIDTH, GIF_OUT_HEIGHT);
        out.push(canvas);
      }
      if (out.length === 1) {
        const dup = document.createElement("canvas");
        dup.width = GIF_OUT_WIDTH;
        dup.height = GIF_OUT_HEIGHT;
        dup.getContext("2d").drawImage(out[0], 0, 0);
        out.push(dup);
      }
      return out;
    }

    function frameToPreviewUrl(frame) {
      try {
        if (!frame?.width || !frame?.height) return null;
        const out = document.createElement("canvas");
        out.width = GIF_OUT_WIDTH;
        out.height = GIF_OUT_HEIGHT;
        const octx = out.getContext("2d");
        octx.imageSmoothingEnabled = true;
        octx.imageSmoothingQuality = "high";
        octx.drawImage(frame, 0, 0, GIF_OUT_WIDTH, GIF_OUT_HEIGHT);
        return out.toDataURL("image/webp", 0.96);
      } catch {
        return null;
      }
    }

    function previewFromFrames(frames) {
      if (!frames?.length) return null;
      return (
        frameToPreviewUrl(frames[frames.length - 1]) ||
        frameToPreviewUrl(frames[Math.floor(frames.length / 2)]) ||
        frameToPreviewUrl(frames[0])
      );
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error("Failed to read GIF blob"));
        reader.readAsDataURL(blob);
      });
    }

    function isAnimatedGifUrl(url) {
      return typeof url === "string"
        && (url.startsWith("data:image/gif") || url.startsWith("blob:"));
    }

    function revokeBallGifUrl(ball) {
      const prev = ball?.dataset?.gifUrl;
      if (prev && prev.startsWith("blob:")) URL.revokeObjectURL(prev);
    }

    function attachBallCaptureFrames(ball, frames) {
      if (!ball || !frames?.length) return;
      ball._captureFrames = frames.map((frame) => cloneCanvasSource(frame));
      ball._framePreviewUrls = null;
      syncBallPlaybackMeta(ball, frames);
    }

    function syncBallPlaybackMeta(ball, frames = ball?._captureFrames) {
      if (!ball || !frames?.length) return;
      const gifFrames = prepareGifFrames(frames);
      const count = Math.max(1, gifFrames.length);
      ball.dataset.frameCount = String(count);
      ball.dataset.gifFrameCount = String(count);
      ball.dataset.playbackMs = String(count * GIF_DELAY_MS);
    }

    function getBallPlayFrameCount(ball) {
      const encoded = parseInt(ball?.dataset?.gifFrameCount, 10);
      if (Number.isFinite(encoded) && encoded > 0) return encoded;
      if (ball?._captureFrames?.length) return prepareGifFrames(ball._captureFrames).length;
      return 1;
    }

    function getBallPlaybackDurationMs(ball) {
      const base = parseInt(ball?.dataset?.playbackMs, 10);
      const frames = getBallPlayFrameCount(ball);
      const ms = Number.isFinite(base) && base > 0 ? base : frames * GIF_DELAY_MS;
      return Math.max(getPlaybackDelayMs(), Math.round(ms / PLAYBACK_SPEEDS[playbackSpeedIndex]));
    }

    function getBallPlayFrameUrls(ball) {
      const urls = getFramePreviewCache(ball);
      const targetCount = getBallPlayFrameCount(ball);
      if (!urls.length) return [];
      if (urls.length <= targetCount) return urls.slice(0, targetCount);
      const out = [];
      for (let i = 0; i < targetCount; i += 1) {
        const idx = Math.min(urls.length - 1, Math.floor((i * urls.length) / targetCount));
        out.push(urls[idx]);
      }
      return out;
    }

    function markUserReelStart(index) {
      if (reelProgrammatic) return;
      const n = getDialBallCount();
      if (!n) return;
      const idx = clamp(index, 0, n - 1);
      userPinnedReelStart = idx === 0 ? null : idx;
      reelWasActive = false;
    }

    function getFramePreviewCache(ball) {
      if (!ball?._captureFrames?.length) return [];
      if (ball._framePreviewUrls?.length) return ball._framePreviewUrls;
      ball._framePreviewUrls = ball._captureFrames
        .map((frame) => frameToPreviewUrl(frame))
        .filter(Boolean);
      return ball._framePreviewUrls;
    }

    function stopBallFrameLoop(ball) {
      if (!ball) return;
      if (ball._frameAnimTimer) {
        clearTimeout(ball._frameAnimTimer);
        ball._frameAnimTimer = null;
      }
    }

    function getPlaybackDelayMs() {
      return Math.max(72, Math.round(GIF_DELAY_MS / PLAYBACK_SPEEDS[playbackSpeedIndex]));
    }

    function getSelectedMemoryBall() {
      if (!memoryBalls) return null;
      const balls = [...memoryBalls.querySelectorAll(".memory-ball")];
      return balls[getSelectedDialIndex()] || null;
    }

    function stopPlaybackScreen() {
      if (playbackAnimTimer) {
        clearTimeout(playbackAnimTimer);
        playbackAnimTimer = null;
      }
      if (reelAdvanceTimer) {
        clearTimeout(reelAdvanceTimer);
        reelAdvanceTimer = null;
      }
      playbackAnimBall = null;
    }

    function stopContinuousPlayhead() {
      if (reelPlayheadTimer) {
        cancelAnimationFrame(reelPlayheadTimer);
        reelPlayheadTimer = null;
      }
    }

    function pausePlayback() {
      if (reelPlaying) reelWasActive = true;
      if (reelTotalDurationMs > 0) {
        const elapsed = Math.max(0, performance.now() - reelStartTimestamp);
        reelHoldProgress = clamp(elapsed / reelTotalDurationMs, 0, 1);
      }
      playbackPaused = true;
      reelPlaying = false;
      stopContinuousPlayhead();
      stopPlaybackScreen();
      if (btnPlay) btnPlay.classList.remove("is-active");
      showSelectedBallPreview(getSelectedMemoryBall());
    }

    function finishMemoryReel() {
      reelHoldProgress = 1;
      updateTimelinePlayheadProgress(reelHoldProgress, false);
      reelPlaying = false;
      reelWasActive = true;
      playbackPaused = true;
      playheadIndex = 0;
      stopContinuousPlayhead();
      stopPlaybackScreen();
      if (btnPlay) btnPlay.classList.remove("is-active");
    }

    function getReelPlayStartIndex() {
      if (reelWasActive) return getSelectedDialIndex();
      return 0;
    }

    function resumePlayback() {
      const n = getDialBallCount();
      if (!n) return;
      startMemoryReel(getReelPlayStartIndex());
    }

    function stepMemoryRow(delta) {
      const n = getDialBallCount();
      if (!n) return;
      if (reelPlaying) pausePlayback();
      const idx = ((getSelectedDialIndex() + delta) % n + n) % n;
      markUserReelStart(idx);
      playbackPaused = true;
      reelProgrammatic = true;
      snapDialToIndex(idx);
      reelProgrammatic = false;
    }

    function setPlaybackSpeedIndex(index) {
      playbackSpeedIndex = clamp(index, 0, PLAYBACK_SPEEDS.length - 1);
      if (reelPlaying && !playbackPaused) {
        const idx = getSelectedDialIndex();
        stopPlaybackScreen();
        playReelFromIndex(idx);
      }
    }

    function clearPlaybackScreen() {
      stopPlaybackScreen();
      if (playbackDisplay) {
        playbackDisplay.removeAttribute("src");
        playbackDisplay.hidden = true;
      }
      playbackViewport?.classList.remove("has-media");
    }

    function showPlaybackStill(src) {
      if (!playbackDisplay || !src) return;
      stopPlaybackScreen();
      playbackDisplay.src = src;
      playbackDisplay.hidden = false;
      playbackViewport?.classList.add("has-media");
    }

    function playPlaybackFrameLoop(ball) {
      const urls = getFramePreviewCache(ball);
      if (!playbackDisplay || urls.length < 2) {
        if (urls[0]) showPlaybackStill(urls[0]);
        return;
      }
      stopPlaybackScreen();
      playbackAnimBall = ball;
      let frameIndex = 0;
      const step = () => {
        if (playbackAnimBall !== ball || !ball.classList.contains("is-selected")) return;
        playbackDisplay.src = urls[frameIndex % urls.length];
        playbackDisplay.hidden = false;
        playbackViewport?.classList.add("has-media");
        frameIndex += 1;
        playbackAnimTimer = setTimeout(step, getPlaybackDelayMs());
      };
      step();
    }

    function playBallMemoryOnce(ball, onComplete) {
      if (!ball || !playbackDisplay) {
        onComplete?.();
        return;
      }
      stopPlaybackScreen();
      playbackAnimBall = ball;

      const urls = getBallPlayFrameUrls(ball);
      const poster = ball.dataset.posterUrl || "";
      const gifUrl = ball.dataset.gifUrl;

      const finish = () => {
        if (playbackAnimBall !== ball) return;
        stopPlaybackScreen();
        onComplete?.();
      };

      const reelSegment = () => reelPlaying && !playbackPaused;

      if (urls.length >= 2) {
        let frameIndex = 0;
        const step = () => {
          if (playbackAnimBall !== ball || playbackPaused) return;
          if (reelPlaying && !reelSegment()) return;
          playbackDisplay.src = urls[frameIndex];
          playbackDisplay.hidden = false;
          playbackViewport?.classList.add("has-media");
          frameIndex += 1;
          if (frameIndex >= urls.length) {
            finish();
            return;
          }
          playbackAnimTimer = setTimeout(step, getPlaybackDelayMs());
        };
        step();
        return;
      }

      if (isAnimatedGifUrl(gifUrl)) {
        const startGif = () => {
          if (playbackAnimBall !== ball || playbackPaused) return;
          if (reelPlaying && !reelSegment()) return;
          playbackDisplay.onerror = () => {
            playbackDisplay.onerror = null;
            if (poster) showPlaybackStill(poster);
            finish();
          };
          const needsRestart = playbackDisplay.src === gifUrl;
          if (needsRestart) {
            playbackDisplay.src = "";
            requestAnimationFrame(() => {
              showPlaybackStill(gifUrl);
              reelAdvanceTimer = setTimeout(finish, getBallPlaybackDurationMs(ball));
            });
          } else {
            showPlaybackStill(gifUrl);
            reelAdvanceTimer = setTimeout(finish, getBallPlaybackDurationMs(ball));
          }
        };
        if (ball.dataset.gifReady === "1") {
          startGif();
          return;
        }
        const probe = new Image();
        probe.onload = () => {
          ball.dataset.gifReady = "1";
          if (playbackAnimBall === ball && (!reelPlaying || reelSegment())) startGif();
        };
        probe.onerror = () => {
          if (poster) showPlaybackStill(poster);
          reelAdvanceTimer = setTimeout(finish, getBallPlaybackDurationMs(ball));
        };
        probe.src = gifUrl;
        return;
      }

      if (poster) showPlaybackStill(poster);
      reelAdvanceTimer = setTimeout(finish, getBallPlaybackDurationMs(ball));
    }

    function playReelFromIndex(index) {
      if (!reelPlaying || playbackPaused) return;
      const balls = [...memoryBalls.querySelectorAll(".memory-ball")];
      if (index >= balls.length) {
        finishMemoryReel();
        return;
      }
      const ball = balls[index];
      selectedDialIndex = index;
      playheadIndex = index;
      playBallMemoryOnce(ball, () => {
        if (!reelPlaying || playbackPaused) return;
        playReelFromIndex(index + 1);
      });
    }

    function startMemoryReel(fromIndex = 0) {
      const n = getDialBallCount();
      if (!n) return;
      const start = clamp(fromIndex, 0, n - 1);
      reelPlaying = true;
      reelWasActive = true;
      playbackPaused = false;
      if (btnPlay) btnPlay.classList.add("is-active");
      selectedDialIndex = start;
      reelStartTimestamp = performance.now();
      reelTotalDurationMs = getReelDurationMs(start);
      startContinuousPlayhead();
      playReelFromIndex(start);
    }

    function showSelectedBallPreview(ball) {
      if (!ball) {
        clearPlaybackScreen();
        return;
      }
      const poster = ball.dataset.posterUrl || "";
      if (poster) showPlaybackStill(poster);
      else clearPlaybackScreen();
    }

    function buildGifFromFrames(frames) {
      return new Promise((resolve, reject) => {
        if (!frames.length) {
          reject(new Error("No frames to encode"));
          return;
        }
        if (typeof GIF === "undefined") {
          reject(new Error("GIF encoder unavailable"));
          return;
        }
        const gifFrames = prepareGifFrames(frames);
        const encode = (workers) => new Promise((res, rej) => {
          const gif = new GIF({
            workers,
            quality: 12,
            workerScript: workers > 0 ? GIF_WORKER_URL : undefined,
            width: GIF_OUT_WIDTH,
            height: GIF_OUT_HEIGHT,
            repeat: 0
          });
          gifFrames.forEach((frame) => {
            gif.addFrame(frame, { copy: true, delay: GIF_DELAY_MS });
          });
          gif.on("finished", (blob) => {
            if (!blob || blob.size < 100) {
              rej(new Error("GIF blob empty"));
              return;
            }
            const typed = blob.type === "image/gif" ? blob : new Blob([blob], { type: "image/gif" });
            res(URL.createObjectURL(typed));
          });
          gif.on("error", (error) => rej(error || new Error("GIF render failed")));
          gif.render();
        });
        encode(0).catch(() => encode(2)).then(resolve).catch(reject);
      });
    }

    function stopCaptureTimers() {
      if (captureDrainTimer) {
        clearInterval(captureDrainTimer);
        captureDrainTimer = null;
      }
      if (captureWatchdogTimer) {
        clearTimeout(captureWatchdogTimer);
        captureWatchdogTimer = null;
      }
    }

    function finishCapture() {
      captureBusy = false;
      captureFinalizing = false;
      captureEndsAt = 0;
      captureBusyFrames = null;
      peakArmed = true;
      wasAtPeak = false;
      peakSustainStart = 0;
      peakEpisodeCaptured = false;
    }

    function tickPeakCapture() {
      const atPeak = isAtPeakEnergy();
      const now = performance.now();

      if (captureBusy || captureFinalizing) {
        wasAtPeak = atPeak;
        return;
      }
      if (!peakArmed) {
        wasAtPeak = atPeak;
        peakSustainStart = 0;
        peakEpisodeCaptured = false;
        return;
      }

      if (atPeak) {
        if (!peakSustainStart) peakSustainStart = now;
        const sustained = now - peakSustainStart >= PEAK_SUSTAIN_MS;
        if (sustained && !peakEpisodeCaptured) {
          peakEpisodeCaptured = true;
          queuePeakMemoryCapture();
        }
        wasAtPeak = sustained;
      } else {
        peakSustainStart = 0;
        peakEpisodeCaptured = false;
        wasAtPeak = false;
      }
    }

    function drainCaptureFrame() {
      try {
        const now = performance.now();
        pushFrameSample(now);
        if (!captureBusy || !captureBusyFrames) return;
        captureBusyFrames.push(cloneFrameCanvas());
        if (now < captureEndsAt) return;
        stopCaptureTimers();
        const frames = captureBusyFrames;
        captureBusyFrames = null;
        finalizeMemoryCapture(frames).catch((error) => {
          console.error("finalizeMemoryCapture failed", error);
          finishCapture();
        });
      } catch (error) {
        console.error("drainCaptureFrame failed", error);
        stopCaptureTimers();
        finalizeMemoryCapture(captureBusyFrames || [cloneFrameCanvas()]).catch(() => {
          finishCapture();
        });
      }
    }

    function updateBallMedia(ball, mediaUrl, posterUrl) {
      if (!ball || !mediaUrl) return;
      const poster = posterUrl || mediaUrl;
      const isGif = isAnimatedGifUrl(mediaUrl);
      revokeBallGifUrl(ball);
      ball.dataset.gifUrl = isGif ? mediaUrl : "";
      ball.dataset.posterUrl = poster;
      ball.dataset.animated = isGif ? "1" : "0";
      ball.dataset.gifReady = "0";
      const img = ball.querySelector("img");
      if (!img) return;
      img.dataset.playing = "0";
      img.removeAttribute("data-active-src");
      if (!ball.classList.contains("is-selected") || !isGif) img.src = poster;
    }

    async function upgradeBallToGif(ball, frames, preview) {
      if (!ball) return;
      ball.dataset.gifEncoding = "1";
      try {
        const encoded = await Promise.race([
          buildGifFromFrames(frames),
          new Promise((_, reject) => {
            setTimeout(() => reject(new Error("GIF encode timeout")), GIF_ENCODE_TIMEOUT_MS);
          })
        ]);
        if (!isAnimatedGifUrl(encoded)) return;
        updateBallMedia(ball, encoded, preview);
