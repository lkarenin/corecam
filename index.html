<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>CoreCam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/face-api.js/dist/face-api.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <style>
    :root {
      --bg: #141418;
      --bg-deep: #0c0c0f;
      --surface: #1e1e24;
      --surface-raised: #26262e;
      --ink: #f2f2f4;
      --ink-muted: #8b8b96;
      --ink-faint: #5a5a64;
      --accent: #ff6b2c;
      --accent-soft: #ff9a62;
      --accent-glow: rgba(255, 107, 44, 0.5);
      --ok: #6b9a78;
      --shadow-dark: rgba(0, 0, 0, 0.55);
      --shadow-light: rgba(255, 255, 255, 0.04);
      --inset-dark: rgba(0, 0, 0, 0.5);
      --inset-light: rgba(255, 255, 255, 0.05);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --font: "IBM Plex Mono", "SF Mono", "Consolas", monospace;
      --neu-raised: 8px 8px 18px var(--shadow-dark), -7px -7px 16px var(--shadow-light);
      --neu-pressed: inset 6px 6px 14px var(--inset-dark), inset -5px -5px 12px var(--inset-light);
      --neu-soft: 4px 4px 10px var(--shadow-dark), -3px -3px 9px var(--shadow-light);
      --rack-col: minmax(150px, 190px);
      --dial-width: 118px;
      --dial-height: 272px;
      --slot-pitch: 58px;
      --ball-size: 44px;
      --ball-size-active: 88px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 11px;
      letter-spacing: 0.08em;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2.5vw, 28px);
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255, 107, 44, 0.06), transparent 55%),
        linear-gradient(165deg, var(--bg) 0%, var(--bg-deep) 100%);
    }

    video { display: none; }

    .instrument {
      width: min(1180px, 100%);
      height: min(720px, 100%);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: 18px 20px 16px;
      border-radius: calc(var(--radius-lg) + 6px);
      background: var(--surface);
      box-shadow: var(--neu-raised);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .instrument-header {
      display: grid;
      grid-template-columns: 1fr var(--rack-col);
      gap: 18px;
      align-items: center;
      padding: 4px 6px 2px;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .brand-sub {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .header-chips {
      display: flex;
      align-items: stretch;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }

    .chip {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      border: none;
      border-radius: 999px;
      text-align: center;
      font-family: var(--font);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: var(--surface);
      box-shadow: var(--neu-soft);
      cursor: pointer;
      transition: color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }

    .chip:hover:not(:disabled) {
      color: var(--ink);
      box-shadow: var(--neu-raised);
    }

    .chip:active:not(:disabled) {
      transform: scale(0.97);
      box-shadow: var(--neu-pressed);
    }

    .chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .chip:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .chip.is-live {
      color: var(--accent);
      box-shadow: var(--neu-pressed), 0 0 0 1px rgba(255, 107, 44, 0.18);
    }

    .chip.is-capturing {
      color: var(--accent-soft);
      box-shadow: var(--neu-pressed), 0 0 12px var(--accent-glow);
    }

    .chip .chip-val {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--ink);
      margin-top: 2px;
    }

    .chip.is-live .chip-val,
    .chip.is-capturing .chip-val { color: var(--accent); }

    .instrument-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    .sensor-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
      min-width: 0;
    }

    .sensor-stack-body {
      display: grid;
      grid-template-columns: 1fr var(--rack-col);
      grid-template-rows: minmax(280px, 1fr) auto;
      gap: 12px 18px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }

    .viewport-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 280px;
      min-width: 0;
      height: 100%;
      align-self: stretch;
      grid-column: 1;
      grid-row: 1;
      overflow: hidden;
    }

    .viewport-panel .instrument-footer {
      flex-shrink: 0;
    }

    .panel-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      padding-left: 4px;
    }

    .viewport-recess {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      min-height: 240px;
      border-radius: var(--radius-md);
      background: #08080a;
      box-shadow: var(--neu-pressed);
      overflow: hidden;
    }

    .viewport-recess::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(255, 255, 255, 0.015) 3px,
          rgba(255, 255, 255, 0.015) 4px
        );
    }

    #display {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .vf-reticle {
      position: absolute;
      inset: 14px;
      pointer-events: none;
      z-index: 3;
      border: 1px solid rgba(255, 107, 44, 0.2);
      border-radius: 6px;
    }

    .vf-reticle::before,
    .vf-reticle::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--accent-soft);
      border-style: solid;
      opacity: 0.7;
    }

    .vf-reticle::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .vf-reticle::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    .vf-hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .vf-hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .vf-transmission {
      flex: 1;
      min-width: 0;
      max-width: min(440px, 70%);
      margin-right: 10px;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.05em;
      text-transform: none;
      color: rgba(236, 228, 216, 0.88);
      text-shadow:
        0 0 12px rgba(0, 0, 0, 0.75),
        0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .vf-transmission-prefix {
      color: rgba(255, 154, 98, 0.85);
      letter-spacing: 0.1em;
    }

    .vf-transmission-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .vf-transmission-cursor {
      display: inline-block;
      margin-left: 1px;
      color: var(--accent-soft);
      font-weight: 500;
      animation: transmissionBlink 0.85s step-end infinite;
    }

    .vf-transmission-cursor.is-done {
      opacity: 0.35;
      animation: none;
    }

    @keyframes transmissionBlink {
      50% { opacity: 0; }
    }

    .vf-rec {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(236, 228, 216, 0.7);
    }

    .vf-rec-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      animation: recPulse 1.4s ease-in-out infinite;
    }

    @keyframes recPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .vf-hud-stats {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 6px 20px;
      align-self: flex-end;
    }

    .vf-stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .vf-stat-label {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(236, 228, 216, 0.5);
    }

    .vf-stat-value {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(248, 240, 228, 0.92);
      font-variant-numeric: tabular-nums;
    }

    .vf-stat-value.is-hot { color: var(--accent-soft); }

    .vf-stat-value.is-core,
    .readout-value.is-core {
      color: var(--accent);
      letter-spacing: 0.2em;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .vf-stat-value.is-core,
    .readout-value.is-core {
      color: var(--accent);
      letter-spacing: 0.2em;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .telemetry-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
      grid-column: 1;
      grid-row: 2;
      align-self: end;
    }

      .telemetry-panel .readout-card {
      padding: 10px 12px;
    }

    .telemetry-panel .readout-title {
      margin-bottom: 8px;
    }

    .memory-rack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-height: 0;
      height: 100%;
      align-self: stretch;
      grid-column: 2;
      grid-row: 1 / -1;
      padding: 12px 10px;
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--neu-pressed);
    }

    .memory-rack-label {
      margin: 0;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .memory-rack-hint {
      margin: 0;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      text-align: center;
      line-height: 1.5;
      max-width: 140px;
    }

    .memory-rack.empty .memory-rack-hint { display: block; }
    .memory-rack:not(.empty) .memory-rack-hint { display: none; }

    .memory-dial-wrap {
      position: relative;
      width: var(--dial-width);
      flex: 1 1 0;
      min-height: 0;
      align-self: center;
    }

    .dial-arrow {
      position: absolute;
      left: -2px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 10px solid var(--accent);
      filter: drop-shadow(0 0 4px var(--accent-glow));
      z-index: 6;
      pointer-events: none;
    }

    .memory-track-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: calc(var(--dial-width) / 2);
      background: var(--bg-deep);
      box-shadow: var(--neu-pressed);
      overflow: hidden;
    }

    .memory-track-frame::before,
    .memory-track-frame::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      z-index: 2;
      pointer-events: none;
    }

    .memory-track-frame::before { top: 18%; }
    .memory-track-frame::after { bottom: 18%; }

    .memory-dial {
      position: absolute;
      inset: 8px 14px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      z-index: 3;
    }

    .memory-dial.is-dragging { cursor: grabbing; }

    .memory-dial-strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .memory-dial-balls {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .memory-slot {
      height: var(--slot-pitch);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .memory-slot::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 50%;
      height: 1px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.07) 20%, rgba(255, 255, 255, 0.07) 80%, transparent);
      pointer-events: none;
    }

    .memory-ball {
      position: relative;
      width: var(--ball-size);
      height: var(--ball-size);
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.12);
      background: radial-gradient(circle at 35% 28%, rgba(70, 70, 78, 0.95), rgba(40, 40, 48, 0.9) 50%, rgba(24, 24, 30, 0.95) 100%);
      box-shadow: var(--neu-soft);
      opacity: 0.72;
      transition:
        width 0.3s cubic-bezier(0.34, 1.2, 0.64, 1),
        height 0.3s cubic-bezier(0.34, 1.2, 0.64, 1),
        opacity 0.25s ease,
        box-shadow 0.3s ease;
      pointer-events: none;
    }

    .memory-ball.is-new {
      animation: memoryBallPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) forwards;
    }

    @keyframes memoryBallPop {
      0% { opacity: 0; transform: scale(0.3); }
      70% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0.78; transform: scale(1); }
    }

    .memory-ball.is-new {
      animation: memoryBallPop 0.55s cubic-bezier(0.34, 1.35, 0.64, 1) forwards;
    }

    @keyframes memoryBallPop {
      0% { opacity: 0; transform: scale(0.3); }
      70% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0.78; transform: scale(1); }
    }

    .memory-ball.is-selected {
      width: var(--ball-size-active);
      height: var(--ball-size-active);
      opacity: 1;
      z-index: 3;
      border-color: rgba(255, 154, 98, 0.65);
      box-shadow:
        var(--neu-soft),
        0 0 0 3px rgba(255, 107, 44, 0.35),
        0 0 28px var(--accent-glow);
    }

    .memory-ball img {
      position: relative;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .memory-ball.mood-happy::after,
    .memory-ball.mood-sad::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .memory-ball.mood-happy::after {
      background: radial-gradient(
        circle at 42% 36%,
        rgba(255, 244, 150, 0.78) 0%,
        rgba(255, 214, 72, 0.52) 38%,
        rgba(255, 178, 48, 0.28) 62%,
        transparent 88%
      );
      mix-blend-mode: screen;
    }

    .memory-ball.mood-sad::after {
      background: radial-gradient(
        circle at 42% 36%,
        rgba(186, 248, 255, 0.76) 0%,
        rgba(96, 210, 248, 0.5) 38%,
        rgba(48, 140, 220, 0.26) 62%,
        transparent 88%
      );
      mix-blend-mode: screen;
    }

    .memory-ball.mood-happy.is-selected {
      border-color: rgba(255, 210, 90, 0.72);
      box-shadow:
        var(--neu-soft),
        0 0 0 3px rgba(255, 190, 60, 0.38),
        0 0 22px rgba(255, 200, 80, 0.45);
    }

    .memory-ball.mood-sad.is-selected {
      border-color: rgba(110, 220, 255, 0.72);
      box-shadow:
        var(--neu-soft),
        0 0 0 3px rgba(72, 190, 255, 0.38),
        0 0 22px rgba(72, 200, 255, 0.42);
    }

    .readout-card {
      padding: 14px 14px 12px;
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--neu-raised);
    }

    .readout-card.is-recessed {
      box-shadow: var(--neu-pressed);
      background: linear-gradient(145deg, var(--bg-deep) 0%, var(--surface) 100%);
    }

    .readout-title {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 12px;
    }

    .readout-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .readout-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .readout-label {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .readout-value {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .readout-value.is-accent { color: var(--accent); }

    .meter-track {
      margin-top: 4px;
      height: 6px;
      border-radius: 999px;
      background: var(--bg-deep);
      box-shadow: var(--neu-pressed);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(255, 107, 44, 0.35), var(--accent-soft), var(--accent));
      box-shadow: 0 0 10px var(--accent-glow);
      transition: width 0.12s linear;
    }

    .instrument-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--neu-pressed);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 6px rgba(107, 154, 120, 0.45);
    }

    .status-led.is-warn {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
    }

    @media (max-width: 820px) {
      html, body {
        height: auto;
        min-height: 100dvh;
        overflow-x: hidden;
        overflow-y: auto;
      }

      body {
        align-items: stretch;
        justify-content: flex-start;
        padding: 10px;
      }

      .instrument {
        width: 100%;
        height: auto;
        min-height: 0;
        max-height: none;
        padding: 14px 12px;
        gap: 12px;
      }

      .instrument-header {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 2px 0;
      }

      .header-chips {
        width: 100%;
        max-width: 320px;
      }

      .instrument-body {
        flex: none;
        min-height: 0;
      }

      .sensor-stack {
        flex: none;
      }

      .sensor-stack-body {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        gap: 10px;
        flex: none;
        min-height: 0;
      }

      .viewport-panel {
        grid-column: 1;
        grid-row: 1;
        min-height: 0;
        height: auto;
        overflow: visible;
      }

      .viewport-recess {
        flex: none;
        width: 100%;
        min-height: 0;
        height: auto;
        aspect-ratio: 4 / 3;
        max-height: min(56vw, 340px);
      }

      .viewport-panel .instrument-footer {
        font-size: 8px;
        padding: 8px 10px;
        flex-wrap: wrap;
        row-gap: 4px;
      }

      .footer-status {
        min-width: 0;
        flex: 1 1 auto;
      }

      #footerStatus {
        word-break: break-word;
        line-height: 1.4;
      }

      #footerClock {
        flex-shrink: 0;
      }

      .vf-hud {

  <script>
    let energyScore = 0.12;
    let faceScore = 0.35;
    let lastDetection = null;
    let peopleCount = 0;
    let targetFaceScore = 0.4;
    let expressionIntensity = 0;
    let targetExpressionIntensity = 0;
    let lastExpressions = null;
    let moodSadLatch = 0;
    let moodAngryLatch = 0;
    let moodExpressionStable = "neutral";

    const canvas = document.getElementById("display");
