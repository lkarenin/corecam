        syncBallPlaybackMeta(ball, ball._captureFrames);
        updateMemorySlotTimestamps();
        ball.dataset.gifReady = "1";
        if (ball.classList.contains("is-selected") && reelPlaying) {
          playReelFromIndex(getSelectedDialIndex());
        } else if (ball.classList.contains("is-selected") && !playbackPaused) {
          playBallMemory(ball);
        }
      } catch (error) {
        console.warn("GIF encode failed; using frame playback", error);
        updateMemorySlotTimestamps();
        if (ball.classList.contains("is-selected") && reelPlaying) {
          playReelFromIndex(getSelectedDialIndex());
        } else if (ball.classList.contains("is-selected") && !playbackPaused) {
          playBallMemory(ball);
        }
      } finally {
        delete ball.dataset.gifEncoding;
      }
    }

    async function finalizeMemoryCapture(frames) {
      if (captureFinalizing) {
        console.warn("finalizeMemoryCapture skipped — already finalizing");
        return;
      }
      captureFinalizing = true;
      stopCaptureTimers();
      try {
        const safeFrames = Array.isArray(frames) && frames.length ? frames : [cloneFrameCanvas()];
        const preview = previewFromFrames(safeFrames) || frameToPreviewUrl(safeFrames[safeFrames.length - 1]);
        const ball = addCoreMemoryBall(preview, preview, pendingCaptureMood, safeFrames);
        if (!ball) throw new Error("Failed to add core memory ball");
        if (footerStatus) footerStatus.textContent = "Core memory captured";
        finishCapture();
        upgradeBallToGif(ball, safeFrames, preview || ball.dataset.posterUrl);
      } catch (error) {
        console.error("finalizeMemoryCapture failed", error);
        if (footerStatus) footerStatus.textContent = "Capture failed — try again";
        finishCapture();
      }
    }

    function queuePeakMemoryCapture(force = false) {
      if (captureBusy || captureFinalizing) return;
      if (video.readyState < 2 || offscreen.width < 1) return;
      const now = performance.now();
      if (!force && now - lastMemoryAt < MEMORY_COOLDOWN_MS) return;
      if (!force && isEmotionallyNeutral(lastExpressions)) return;
      if (!force && (!lastDetection || lastDetection.expression === "neutral")) return;
      if (!force && !isAtPeakEnergy()) return;
      captureBusy = true;
      peakArmed = false;
      lastMemoryAt = now;
      pendingCaptureMood = getCaptureMood();
      captureEndsAt = now + POST_CAPTURE_MS;
      if (footerStatus) footerStatus.textContent = "Capturing core memory…";

      const frames = frameRing.slice(-PRE_BUFFER_FRAMES).map((c) => {
        const copy = document.createElement("canvas");
        copy.width = c.width;
        copy.height = c.height;
        copy.getContext("2d").drawImage(c, 0, 0);
        return copy;
      });
      const peakSnap = cloneFrameCanvas();
      if (!frames.length) {
        for (let i = 0; i < 4; i += 1) {
          const copy = document.createElement("canvas");
          copy.width = peakSnap.width;
          copy.height = peakSnap.height;
          copy.getContext("2d").drawImage(peakSnap, 0, 0);
          frames.push(copy);
        }
      } else {
        frames.push(peakSnap);
      }
      captureBusyFrames = frames;
      stopCaptureTimers();
      drainCaptureFrame();
      captureDrainTimer = setInterval(drainCaptureFrame, FRAME_SAMPLE_MS);
      captureWatchdogTimer = setTimeout(() => {
        if (!captureBusy || captureFinalizing) return;
        const pending = captureBusyFrames || [cloneFrameCanvas()];
        captureBusyFrames = null;
        finalizeMemoryCapture(pending).catch((error) => {
          console.error("watchdog finalize failed", error);
          finishCapture();
        });
      }, CAPTURE_WATCHDOG_MS);
    }

    async function loadModelsFrom(baseUri) {
      const loaders = [
        { name: "tinyFaceDetector", load: () => faceapi.nets.tinyFaceDetector.loadFromUri(baseUri) },
        { name: "faceLandmark68Net", load: () => faceapi.nets.faceLandmark68Net.loadFromUri(baseUri) },
        { name: "faceExpressionNet", load: () => faceapi.nets.faceExpressionNet.loadFromUri(baseUri) }
      ];

      for (const model of loaders) {
        try {
          await model.load();
          console.log(`Model loaded: ${model.name} from ${baseUri}`);
        } catch (error) {
          console.error(`Model failed: ${model.name} from ${baseUri}`, error);
          throw error;
        }
      }
    }

    async function loadModels() {
      if (!window.faceapi) {
        throw new Error("face-api.js did not load");
      }

      const localBase = "/models";
      const fallbackBase = "https://justadudewhohacks.github.io/face-api.js/models";

      try {
        await loadModelsFrom(localBase);
      } catch (localError) {
        console.warn("Local /models load failed, trying fallback CDN models.");
        await loadModelsFrom(fallbackBase);
      }
    }

    function pickPrimaryFace(faces) {
      if (!faces?.length) return null;
      return faces.reduce((best, face) => {
        const box = face.detection.box;
        const area = box.width * box.height;
        const bestBox = best.detection.box;
        const bestArea = bestBox.width * bestBox.height;
        return area > bestArea ? face : best;
      });
    }

    async function runFaceDetection() {
      if (video.readyState < 2) return;
      if (!drawVideoCoverTo(detectCtx, detectCanvas.width, detectCanvas.height)) return;

      try {
        const faces = await faceapi
          .detectAllFaces(detectCanvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.38 }))
          .withFaceLandmarks()
          .withFaceExpressions();

        peopleCount = faces.length;
        const result = pickPrimaryFace(faces);

        if (result) {
          lastExpressions = result.expressions;
          updateMoodState(result.expressions);
          const neutralFace = isEmotionallyNeutral(result.expressions);
          const live = getLiveExpression(result.expressions);
          targetExpressionIntensity = neutralFace
            ? 0
            : Math.pow(computeExpressionIntensity(result.expressions), 1.16);
          lastDetection = {
            expression: neutralFace ? "neutral" : live.name,
            probability: neutralFace
              ? (result.expressions.neutral || live.score)
              : live.score,
            intensity: targetExpressionIntensity
          };
          lastFaceBox = result.detection.box;
          faceDetectVersion += 1;
          const baseScore = expressionScores[live.name] ?? 0.3;
          targetFaceScore = lerp(0.4, baseScore, 0.35) + (targetExpressionIntensity * 0.65);
          targetFaceScore = clamp(targetFaceScore, 0.35, 1.0);
        } else {
          updateMoodState(null);
          lastDetection = null;
          lastFaceBox = null;
          lastExpressions = null;
          targetFaceScore = 0.3;
          targetExpressionIntensity = 0;
        }
      } catch (error) {
        console.error("Detection error", error);
        updateMoodState(null);
        peopleCount = 0;
        lastDetection = null;
        lastFaceBox = null;
        targetFaceScore = 0.3;
      }
    }

    function startDetectionLoop() {
      if (detectionTimer) clearInterval(detectionTimer);
      detectionTimer = setInterval(() => {
        runFaceDetection().catch((error) => {
          console.error("Detection tick failed", error);
        });
      }, DETECTION_INTERVAL_MS);
    }

    function drawViewfinderPlaceholder(message) {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, displayW, displayH);
      ctx.fillStyle = "rgba(236, 228, 216, 0.5)";
      ctx.font = '11px "IBM Plex Mono", monospace';
      ctx.fillText(message, 16, 28);
    }

    function renderFrame() {
      const frameStart = performance.now();
      try {
      if (!canvasLayoutReady) resizeCanvases();
      if (uiUpdateFrame % ENERGY_UPDATE_EVERY_N_FRAMES === 0) updateLiveEnergy();

      const videoReady = video.videoWidth > 0 && video.videoHeight > 0 && video.readyState >= 2;
      offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
      if (!videoReady) {
        offCtx.fillStyle = "#000000";
        offCtx.fillRect(0, 0, offscreen.width, offscreen.height);
        ctx.drawImage(offscreen, 0, 0, displayW, displayH);
        drawViewfinderPlaceholder("Acquiring sensor feed…");
        if (uiUpdateFrame % UI_UPDATE_EVERY_N_FRAMES === 0 || captureBusy) updateInstrumentUI();
      } else {
      drawVideoCover();

      const procW = offscreen.width;
      const procH = offscreen.height;
      const pixelCount = procW * procH;
      const emberW = Math.max(96, procW >> 2);
      const emberH = Math.max(72, procH >> 2);
      const skipTrailPass = lastRenderDurationMs > 22;
      const emberCount = emberW * emberH;
      if (prevLumaFrame.length !== pixelCount) {
        prevLumaFrame = new Float32Array(pixelCount);
      }
      if (motionEmber.length !== emberCount) {
        motionEmber = new Float32Array(emberCount);
        motionEmberTmp = new Float32Array(emberCount);
        motionSpeedEmber = new Float32Array(emberCount);
        motionSpeedEmberTmp = new Float32Array(emberCount);
      }
      for (let ep = 0; ep < emberCount; ep += 1) {
        // More subtle persistence: short, soft-lived trails.
        motionEmberTmp[ep] = motionEmber[ep] * 0.9;
        motionSpeedEmberTmp[ep] = motionSpeedEmber[ep] * 0.88;
      }

      const frame = offCtx.getImageData(0, 0, procW, procH);
      const data = frame.data;
      const faceBox = mapDetectBoxToTarget(lastFaceBox, procW, procH);
      if (faceBox) {
        const tcx = faceBox.x + (faceBox.width * 0.5);
        const tcy = faceBox.y + (faceBox.height * 0.56);
        const trx = Math.max(24, faceBox.width * 0.5);
        const tRy = Math.max(38, faceBox.height * 0.95);
        if (!liveFace) {
          liveFace = {
            cx: tcx,
            cy: tcy,
            rx: trx,
            ry: tRy,
            height: faceBox.height,
            glowCx: tcx,
            glowCy: tcy,
            glowRx: trx,
            glowRy: tRy
          };
        } else if (faceDetectVersion !== consumedFaceVersion) {
          consumedFaceVersion = faceDetectVersion;
          liveFace.cx = lerp(liveFace.cx, tcx, 0.48);
          liveFace.cy = lerp(liveFace.cy, tcy, 0.48);
          liveFace.rx = lerp(liveFace.rx, trx, 0.38);
          liveFace.ry = lerp(liveFace.ry, tRy, 0.38);
          liveFace.height = lerp(liveFace.height, faceBox.height, 0.38);
        } else {
          liveFace.rx = lerp(liveFace.rx, trx, 0.22);
          liveFace.ry = lerp(liveFace.ry, tRy, 0.22);
          liveFace.height = lerp(liveFace.height, faceBox.height, 0.22);
          liveFace.cx = lerp(liveFace.cx, tcx, 0.26);
          liveFace.cy = lerp(liveFace.cy, tcy, 0.26);
        }

        let trackMass = 0;
        let trackSumX = 0;
        let trackSumY = 0;
        const minY = Math.max(0, Math.floor(liveFace.cy - liveFace.ry * 1.35));
        const maxY = Math.min(procH - 1, Math.ceil(liveFace.cy + liveFace.ry * 1.35));
        const minX = Math.max(0, Math.floor(liveFace.cx - liveFace.rx * 1.35));
        const maxX = Math.min(procW - 1, Math.ceil(liveFace.cx + liveFace.rx * 1.35));
        for (let ty = minY; ty <= maxY; ty += 3) {
          for (let tx = minX; tx <= maxX; tx += 3) {
            const tp = ty * procW + tx;
            const ti = tp * 4;
            const tLum = (0.299 * data[ti] + 0.587 * data[ti + 1] + 0.114 * data[ti + 2]) / 255;
            const tDelta = Math.abs(tLum - prevLumaFrame[tp]);
            const tex = (tx - liveFace.cx) / (liveFace.rx * 1.2);
            const tey = (ty - liveFace.cy) / (liveFace.ry * 1.2);
            if ((tex * tex + tey * tey) > 1.1 || tDelta < 0.018) continue;
            trackMass += tDelta;
            trackSumX += tx * tDelta;
            trackSumY += ty * tDelta;
          }
        }
        if (trackMass > 0.014) {
          const mx = trackSumX / trackMass;
          const my = trackSumY / trackMass;
          const offX = (mx - liveFace.cx) / liveFace.rx;
          const offY = (my - liveFace.cy) / liveFace.ry;
          if ((offX * offX + offY * offY) < 0.65) {
            liveFace.cx = lerp(liveFace.cx, mx, 0.16);
            liveFace.cy = lerp(liveFace.cy, my, 0.16);
          }
        }

        liveFace.glowCx = lerp(liveFace.glowCx, liveFace.cx, 0.1);
        liveFace.glowCy = lerp(liveFace.glowCy, liveFace.cy, 0.1);
        liveFace.glowRx = lerp(liveFace.glowRx, liveFace.rx, 0.07);
        liveFace.glowRy = lerp(liveFace.glowRy, liveFace.ry, 0.07);
      } else if (liveFace) {
        liveFace.rx *= 0.9;
        liveFace.ry *= 0.9;
        if (liveFace.rx < 12) liveFace = null;
      }

      const hasFace = Boolean(liveFace);
      const cx = hasFace ? liveFace.glowCx : 0;
      const cy = hasFace ? liveFace.glowCy : 0;
      const rx = hasFace ? liveFace.glowRx : 1;
      const ry = hasFace ? liveFace.glowRy : 1;
      const faceHeight = hasFace ? liveFace.height : 0;
      const body = getBodyTrailBounds(hasFace, cx, cy, rx, ry, faceHeight, procH);
      const exprHeat = clamp(expressionIntensity, 0, 1);
      const exprHeatCurve = Math.pow(exprHeat, 0.88);
      const energyDriven = clamp(energyScore + (exprHeatCurve * 0.62), 0, 1.45);
      const energyRamp = Math.pow(clamp(energyDriven, 0, 1.45) / 1.45, 0.92);
      const glowRamp = Math.pow(clamp(energyDriven, 0, 1.45) / 1.45, 1.22);
      const peakRoll = Math.pow(
        clamp((Math.max(energyRamp, exprHeatCurve) - 0.62) / 0.38, 0, 1),
        0.82
      );
      const glowRampAdjusted = glowRamp * (1 - (peakRoll * 0.34));
      const thermalBoostScale = lerp(1.18, 0.86, peakRoll);
      const baseExpression = lastDetection?.expression || "neutral";
      const currentExpression = (moodExpressionStable === "sad" || moodExpressionStable === "angry")
        ? moodExpressionStable
        : baseExpression;
      const expressionConfidence = currentExpression === "sad"
        ? moodSadLatch
        : currentExpression === "angry"
          ? moodAngryLatch
          : clamp(lastDetection?.probability || 0, 0, 1);
      const moodDrivenExpression = currentExpression === "sad" || currentExpression === "angry";
      let frameMotionPeak = 0;
      let movePixelCount = 0;

      for (let y = 0; y < procH; y += 1) {
        for (let x = 0; x < procW; x += 1) {
          const i = (y * procW + x) * 4;
          const p = y * procW + x;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
        const rawLum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const delta = Math.abs(rawLum - prevLumaFrame[p]);
        prevLumaFrame[p] = rawLum;
        const bgIndex = Math.min(255, Math.floor(Math.pow(rawLum, THERMAL_BG_GAMMA) * 255));
        const bg = bgLUT[bgIndex] || { r: 0, g: 0, b: 0 };

        let warmMix = 0;
        let thermalBoost = 0;
        let trailMask = 0;
        if (hasFace) {
          const exFace = (x - cx) / rx;
          const eyFace = (y - cy) / ry;
          const distFace = Math.sqrt((exFace * exFace) + (eyFace * eyFace));
          const exBody = (x - body.bodyCx) / body.bodyRx;
          const bodyRyEff = y >= body.bodyCy ? body.bodyRyDown : body.bodyRyUp;
          const eyBody = (y - body.bodyCy) / bodyRyEff;
          const distBody = Math.sqrt((exBody * exBody) + (eyBody * eyBody));

          const faceInfluence = Math.pow(clamp(1 - distFace, 0, 1), 1.28);
          const bodyInfluence = Math.pow(clamp(1 - distBody, 0, 1), 1.18);
          const humanInfluence = Math.max(faceInfluence, bodyInfluence * 0.92);
          const faceCore = Math.pow(clamp(1 - distFace, 0, 1), 2.35);
          const wholeFace = Math.pow(clamp(1 - distFace, 0, 1), 0.92);
          const edgeSoft = Math.pow(clamp(1 - (distFace * 0.86), 0, 1), 1.4);
          const containFace = clamp(1 - distFace, 0, 1);
          const eyForehead = (y - (cy - ry * 0.46)) / (ry * 1.42);
          const distForehead = Math.sqrt((exFace * exFace) + (eyForehead * eyForehead));
          const containForehead = clamp(1 - distForehead, 0, 1);
          const containBody = clamp(1 - distBody, 0, 1);
          const personContain = Math.max(Math.pow(containFace, 0.95), Math.pow(containBody, 1.55));
          trailMask = Math.pow(personContain, 1.15);

          const skinLikely = clamp(((r - b) + 20) / 120, 0, 1) * clamp(((g - b) + 10) / 90, 0, 1);
          const heatPotential = clamp((Math.pow(rawLum, 1.02) * 1.08) + (skinLikely * 0.72), 0, 1);
          const energyRampLocal = energyRamp;
          const glowRampLocal = glowRampAdjusted;
          const neutralLift = clamp((0.58 - energyScore) / 0.58, 0, 1);
          const neutralFaceArea = Math.max(containFace, Math.pow(containForehead, 0.72));
          const neutralSpread = Math.pow(neutralFaceArea, 0.72) * neutralLift;

          warmMix = humanInfluence * heatPotential * (0.34 + (energyRampLocal * 1.58));
          warmMix += wholeFace * (0.08 + energyRampLocal * 0.82);
          warmMix += edgeSoft * energyRampLocal * 0.28;
          warmMix += bodyInfluence * energyRampLocal * 0.28;
          warmMix += faceCore * glowRampLocal * (0.5 + exprHeatCurve * 0.72);
          warmMix += neutralSpread * 0.14;
          warmMix += containFace * exprHeatCurve * 0.46;
          warmMix += faceCore * exprHeatCurve * 0.42;
          warmMix *= personContain * 0.94;
          const maxWarmMix = lerp(0.84, 0.96, exprHeatCurve) - (peakRoll * 0.16);
          warmMix = clamp(warmMix, 0, maxWarmMix);
          thermalBoost = (
            (faceCore * glowRampLocal * (0.32 + exprHeatCurve * 0.4)) +
            (wholeFace * energyRampLocal * (0.18 + exprHeatCurve * 0.2)) +
            (bodyInfluence * energyRampLocal * 0.14) +
            (neutralSpread * 0.1)
          ) * personContain;
          thermalBoost += exprHeatCurve * 0.14 * personContain;
          thermalBoost *= (1 - (peakRoll * 0.42));
        }

        const boostedLum = clamp(Math.pow(rawLum, THERMAL_LUM_GAMMA) + (thermalBoost * thermalBoostScale), 0, 1);
        const lumCap = hasFace
          ? Math.round(
            lerp(THERMAL_LUM_CAP_IDLE, THERMAL_LUM_CAP_FACE, Math.pow(exprHeatCurve, 0.95)) -
            (peakRoll * 26)
          )
          : THERMAL_LUM_CAP_IDLE;
        const lumIndex = Math.min(lumCap, Math.floor(boostedLum * 255));
        const thermal = activeLUT[lumIndex] || bg;

          let outR = Math.round(lerp(bg.r, thermal.r, warmMix));
          let outG = Math.round(lerp(bg.g, thermal.g, warmMix));
          let outB = Math.round(lerp(bg.b, thermal.b, warmMix));

          if (hasFace && warmMix > 0.08 && (exprHeatCurve > 0.5 || (moodDrivenExpression && expressionConfidence > 0.55))) {
            const exHot = (x - cx) / rx;
            const eyHot = (y - cy) / ry;
            const distHot = Math.sqrt((exHot * exHot) + (eyHot * eyHot));
            const hotRadius = 1.18;
            let faceHot = 0;
            if (distHot < hotRadius) {
              const thermalHotMix = clamp((exprHeatCurve - 0.5) / 0.5, 0, 1);
              const moodHotMix = moodDrivenExpression ? clamp((expressionConfidence - 0.45) / 0.55, 0, 1) : 0;
              const hotMix = Math.max(thermalHotMix, moodHotMix);
              const hotMixShaped = hotMix * hotMix * (3 - (2 * hotMix));
              faceHot = Math.pow(clamp(1 - (distHot / hotRadius), 0, 1), 2.15);
              const amberHot = facePeakColor(currentExpression, hotMixShaped);
              const hotBlendGain = (moodDrivenExpression ? 0.62 : 0.42) * (1 - (peakRoll * 0.52));
              const hotBlend = hotMixShaped * faceHot * hotBlendGain;
              outR = Math.round(lerp(outR, amberHot.r, hotBlend));
              outG = Math.round(lerp(outG, amberHot.g, hotBlend));
              outB = Math.round(lerp(outB, amberHot.b, hotBlend));
            }

            const detailStrength = clamp((exprHeatCurve * 0.62) + (peakRoll * 0.16), 0.18, 0.62);
            const detail = (rawLum - 0.5) * detailStrength * 96;
            outR = clamp(outR + detail, 0, 255);
            outG = clamp(outG + detail * 0.88, 0, 255);
            outB = clamp(outB + detail * 0.42, 0, 255);

            if (peakRoll > 0.04) {
              const exCompress = (x - cx) / rx;
              const eyCompress = (y - cy) / ry;
              const distCompress = Math.sqrt((exCompress * exCompress) + (eyCompress * eyCompress));
              const faceWeight = Math.pow(clamp(1 - distCompress, 0, 1), 1.6);
              const compressed = compressFaceHighlights(outR, outG, outB, peakRoll, faceWeight);
              outR = compressed.r;
              outG = compressed.g;
              outB = compressed.b;
            }
          }

          const adaptiveDeltaFloor = hasFace ? 0.055 : 0.08;
          const motionHit = clamp((delta - adaptiveDeltaFloor) * 6.2, 0, 1);
          // Allow non-face movers (hands/background people) when motion is strong.
          const globalMotionMask = clamp((motionHit - 0.48) * 1.9, 0, 1);
          const lowerFrameBoost = clamp(((y / procH) - 0.38) / 0.62, 0, 1) * motionHit * 0.55;
          const motionSourceMask = hasFace
            ? Math.max(trailMask, globalMotionMask, lowerFrameBoost)
            : globalMotionMask;
          if (motionHit > 0.22 && motionSourceMask > 0.12) {
            const ep = emberIndexFromPixel(x, y, procW, procH, emberW, emberH);
            const inject = motionHit * motionSourceMask * 0.26;
            if (inject > motionEmberTmp[ep]) motionEmberTmp[ep] = inject;
            const speedInject = clamp((motionHit - 0.22) / 0.7, 0, 1) * motionSourceMask;
            if (speedInject > motionSpeedEmberTmp[ep]) motionSpeedEmberTmp[ep] = speedInject;
          }

          const moveHit = clamp((delta - 0.12) * 4.2, 0, 1) * Math.max(0.35, motionSourceMask);
          if (moveHit > 0.24) {
            movePixelCount += 1;
            if (moveHit > frameMotionPeak) frameMotionPeak = moveHit;
          }

          const polished = polishThermalPixel(outR, outG, outB, peakRoll);
          data[i] = polished.r;
          data[i + 1] = polished.g;
          data[i + 2] = polished.b;
        }
      }

      if (!skipTrailPass) {
      blurEmberField(motionEmberTmp, motionEmber, emberW, emberH);
      blurEmberField(motionSpeedEmberTmp, motionSpeedEmber, emberW, emberH);

      const emberScaleX = emberW / procW;
      const emberScaleY = emberH / procH;
      for (let y = 0; y < procH; y += 1) {
        for (let x = 0; x < procW; x += 1) {
          const i = (y * procW + x) * 4;
          const emberVal = sampleEmberBilinear(
            motionEmber,
            emberW,
            emberH,
            (x + 0.5) * emberScaleX,
            (y + 0.5) * emberScaleY
          );
          if (emberVal < 0.055) continue;
          const emberSpeedVal = sampleEmberBilinear(
            motionSpeedEmber,
            emberW,
            emberH,
            (x + 0.5) * emberScaleX,
            (y + 0.5) * emberScaleY
          );
          let spatialGate = 1;
          if (hasFace) {
            const bodyGate = bodyTrailContain(x, y, body);
            const offBodyBoost = clamp((emberVal - 0.05) * 3.2, 0, 1);
            spatialGate = Math.max(bodyGate, offBodyBoost);
            if (spatialGate < 0.03) continue;
          }
          const emberSoft = Math.pow(emberVal, 0.74);
          const emberShape = emberSoft * emberSoft * (3 - (2 * emberSoft));
          const localTrailSpeed = clamp((emberSpeedVal - 0.06) / 0.42, 0, 1);
          const trail = moodyTrailRgb(emberShape, energyScore, localTrailSpeed);
          const edgeBlend = clamp((emberVal - 0.055) / 0.14, 0, 1);
          const speedAlpha = clamp((localTrailSpeed - 0.04) / 0.9, 0.12, 1);
          const trailMix = clamp(
            Math.pow(emberShape, 0.88) * (0.16 + localTrailSpeed * 0.44) * spatialGate * edgeBlend * speedAlpha,
            0,
            0.58
          );
          data[i] = Math.round(lerp(data[i], trail.r, trailMix));
          data[i + 1] = Math.round(lerp(data[i + 1], trail.g, trailMix));
          data[i + 2] = Math.round(lerp(data[i + 2], trail.b, trailMix));
        }
      }
      }

      offCtx.putImageData(frame, 0, 0);
      pushFrameSample(frameStart);
      ctx.drawImage(offscreen, 0, 0, displayW, displayH);

      // Motion metric: normalize to 0–1, then smooth for stable readout.
      const movingRatio = movePixelCount / Math.max(1, pixelCount);
      const peakNorm = clamp((frameMotionPeak - 0.42) / 0.58, 0, 1);
      const spreadNorm = clamp((movingRatio - 0.05) / 0.14, 0, 1);
      const motionRaw = clamp(Math.max(peakNorm, spreadNorm * 0.45), 0, 1);
      const motionInstant = Math.pow(motionRaw, 1.35);
      const motionRise = motionInstant > moveLevel ? 0.1 : 0.14;
      moveLevel = lerp(moveLevel, motionInstant, motionRise);
      const displayRise = motionInstant > moveLevelDisplay ? 0.08 : 0.12;
      moveLevelDisplay = lerp(moveLevelDisplay, motionInstant, displayRise);
      const trailRise = moveLevel > trailHeat ? 0.14 : 0.1;
      trailHeat = lerp(trailHeat, moveLevel, trailRise);
      tickPeakCapture();
      }
      uiUpdateFrame += 1;
      if (uiUpdateFrame % UI_UPDATE_EVERY_N_FRAMES === 0 || captureBusy) updateInstrumentUI();
      } catch (error) {
        console.error("renderFrame error", error);
        if (displayW >= 16 && displayH >= 16) {
          drawViewfinderPlaceholder("Render error — check console");
        }
      }
      lastRenderDurationMs = performance.now() - frameStart;
      requestAnimationFrame(renderFrame);
    }

    function getSlotPitch() {
      return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--slot-pitch")) || 58;
    }

    function getDialViewportWidth() {
      const wrap = memoryDial?.closest(".timeline-rack") || memoryDial?.parentElement;
      if (wrap?.clientWidth > 8) return wrap.clientWidth;
      if (memoryDial?.clientWidth > 8) return memoryDial.clientWidth;
      return 280;
    }

    function formatSessionTimestamp(totalSeconds) {
      const s = Math.max(0, Math.round(totalSeconds));
      const mins = Math.floor(s / 60);
      const secs = s % 60;
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function getBallPlaybackDurationSec(ball) {
      const ms = parseInt(ball?.dataset?.playbackMs, 10);
      if (Number.isFinite(ms) && ms > 0) return ms / 1000;
      return (getBallPlayFrameCount(ball) * GIF_DELAY_MS) / 1000;
    }

    function getSlotTimelineOffsetsSec(slots) {
      if (!slots.length) return [];
      const captureMs = slots.map((slot) => {
        const raw = Number(slot.dataset.captureAtMs || slot.dataset.captureAt || "");
        return Number.isFinite(raw) && raw > 0 ? raw : NaN;
      });
      const knownCaptureMs = captureMs.filter((v) => Number.isFinite(v));
      const firstCaptureMs = knownCaptureMs.length ? Math.min(...knownCaptureMs) : NaN;
      const offsets = [];
      let fallbackSec = 0;
      slots.forEach((slot, i) => {
        let sec = NaN;
        if (Number.isFinite(captureMs[i]) && Number.isFinite(firstCaptureMs)) {
          sec = Math.max(0, (captureMs[i] - firstCaptureMs) / 1000);
        }
        if (!Number.isFinite(sec)) sec = fallbackSec;
        if (i > 0) sec = Math.max(sec, offsets[i - 1] + 0.25);
        offsets.push(sec);
        const ball = slot.querySelector(".memory-ball");
        fallbackSec = sec + (ball ? getBallPlaybackDurationSec(ball) : 1);
      });
      return offsets;
    }

    function applyTimelineSpacingAndTicks(slots, offsetsSec) {
      if (!memoryBalls) return;
      if (!slots.length) {
        if (memoryTicks) memoryTicks.replaceChildren();
        memoryBalls.style.width = "";
        if (memoryTicks) memoryTicks.style.width = "";
        return;
      }

      const slotPitch = getSlotPitch();
      slots.forEach((slot) => {
        slot.style.width = `${slotPitch}px`;
      });

      const totalTrackW = Math.max(slotPitch, slotPitch * slots.length);
      memoryBalls.style.width = `${totalTrackW}px`;
      if (memoryTicks) {
        memoryTicks.style.width = `${totalTrackW}px`;
        memoryTicks.replaceChildren();
      }
    }

    function updateMemorySlotTimestamps() {
      if (!memoryBalls) return;
      const slots = [...memoryBalls.querySelectorAll(".memory-slot")];
      const offsetsSec = getSlotTimelineOffsetsSec(slots);
      slots.forEach((slot, i) => {
        const timeEl = slot.querySelector(".memory-slot-time");
        if (!timeEl) return;
        const startSec = Math.round(offsetsSec[i] || 0);
        timeEl.textContent = formatSessionTimestamp(startSec);
        timeEl.dateTime = `PT${startSec}S`;
      });
      applyTimelineSpacingAndTicks(slots, offsetsSec);
    }

    let lastDialLayoutKey = "";

    function getDialBallCount() {
      return memoryBalls ? memoryBalls.querySelectorAll(".memory-ball").length : 0;
    }

    function appendMemorySlot(slot) {
      memoryBalls.appendChild(slot);
      return memoryBalls.children.length - 1;
    }

    function getSelectedDialIndex() {
      const n = getDialBallCount();
      if (!n) return 0;
      return clamp(selectedDialIndex, 0, n - 1);
    }

    function getDialIndexAtClientX(clientX) {
      const slots = memoryBalls ? [...memoryBalls.querySelectorAll(".memory-slot")] : [];
      if (!slots.length || !memoryRack) return 0;
      const rackRect = memoryRack.getBoundingClientRect();
      const x = clientX - rackRect.left;
      let bestIdx = 0;
      let bestDist = Infinity;
      slots.forEach((slot, i) => {
        const slotRect = slot.getBoundingClientRect();
        const cx = slotRect.left + slotRect.width / 2 - rackRect.left;
        const dist = Math.abs(x - cx);
        if (dist < bestDist) {
          bestDist = dist;
          bestIdx = i;
        }
      });
      return bestIdx;
    }

    function slotCenterX(slot) {
      const rackRect = memoryRack.getBoundingClientRect();
      const slotRect = slot.getBoundingClientRect();
      return slotRect.left + slotRect.width / 2 - rackRect.left;
    }

    function getReelDurationMs(fromIndex = 0) {
      const balls = memoryBalls ? [...memoryBalls.querySelectorAll(".memory-ball")] : [];
      if (!balls.length) return 1;
      const start = clamp(fromIndex, 0, balls.length - 1);
      let total = 0;
      for (let i = start; i < balls.length; i += 1) {
        total += getBallPlaybackDurationMs(balls[i]);
      }
      return Math.max(1, total);
    }

    function getPlayheadTrackBounds() {
      if (!memoryRack || !memoryDial) return { left: 0, right: 0 };
      const slots = memoryBalls ? [...memoryBalls.querySelectorAll(".memory-slot")] : [];
      const rackRect = memoryRack.getBoundingClientRect();
      if (slots.length) {
        const firstRect = slots[0].getBoundingClientRect();
        const lastRect = slots[slots.length - 1].getBoundingClientRect();
        const left = Math.max(0, firstRect.left - rackRect.left);
        const right = Math.max(left, lastRect.right - rackRect.left - 2);
        return { left, right };
      }
      const dialRect = memoryDial.getBoundingClientRect();
      const left = Math.max(0, dialRect.left - rackRect.left);
      const right = Math.max(left, dialRect.right - rackRect.left - 2);
      return { left, right };
    }

    function updateTimelinePlayheadProgress(progress, animate = false) {
      if (!timelinePlayhead) return;
      const { left, right } = getPlayheadTrackBounds();
      const p = clamp(progress, 0, 1);
      const x = left + (right - left) * p;
      timelinePlayhead.style.transition = animate
        ? "transform 0.18s linear"
        : "none";
      timelinePlayhead.style.transform = `translateX(${Math.max(0, x)}px)`;
    }

    function updateTimelinePlayheadAtIndex(index, animate = true) {
      if (!timelinePlayhead || !memoryRack) return;
      timelinePlayhead.style.transition = animate
        ? "transform 0.38s cubic-bezier(0.34, 1.25, 0.64, 1)"
        : "none";
      const slots = memoryBalls ? memoryBalls.querySelectorAll(".memory-slot") : [];
      if (!slots.length) {
        timelinePlayhead.style.transform = "translateX(0)";
        return;
      }
      const idx = clamp(index, 0, slots.length - 1);
      const slot = slots[idx];
      if (!slot) return;
      const centerX = slotCenterX(slot);
      timelinePlayhead.style.transform = `translateX(${Math.max(0, centerX - 1)}px)`;
    }

    function syncTimelinePlayhead(animate = true) {
      if (reelPlaying && !playbackPaused && reelTotalDurationMs > 0) {
        const elapsed = Math.max(0, performance.now() - reelStartTimestamp);
        reelHoldProgress = clamp(elapsed / reelTotalDurationMs, 0, 1);
        updateTimelinePlayheadProgress(reelHoldProgress, false);
        return;
      }
      if (!reelPlaying && reelWasActive) {
        updateTimelinePlayheadProgress(reelHoldProgress, false);
        return;
      }
      if (!reelPlaying && !reelWasActive) {
        timelinePlayhead.style.transition = animate
          ? "transform 0.38s cubic-bezier(0.34, 1.25, 0.64, 1)"
          : "none";
        timelinePlayhead.style.transform = "translateX(0)";
        return;
      }
      updateTimelinePlayheadAtIndex(playheadIndex, animate);
    }

    function startContinuousPlayhead() {
      if (reelPlayheadTimer) {
        cancelAnimationFrame(reelPlayheadTimer);
        reelPlayheadTimer = null;
      }
      const tick = () => {
        if (!reelPlaying || playbackPaused || reelTotalDurationMs <= 0) {
          reelPlayheadTimer = null;
          return;
        }
        const elapsed = Math.max(0, performance.now() - reelStartTimestamp);
        reelHoldProgress = clamp(elapsed / reelTotalDurationMs, 0, 1);
        updateTimelinePlayheadProgress(reelHoldProgress, false);
        reelPlayheadTimer = requestAnimationFrame(tick);
      };
      tick();
    }

    function setPlayheadIndex(index, animate = true) {
      const n = getDialBallCount();
      playheadIndex = n ? clamp(index, 0, n - 1) : 0;
      requestAnimationFrame(() => updateTimelinePlayheadAtIndex(playheadIndex, animate));
    }

    function setSelectedDialIndex(index) {
      const n = getDialBallCount();
      selectedDialIndex = n ? clamp(index, 0, n - 1) : 0;
      requestAnimationFrame(() => updateDialFocus());
    }

    function snapDialToIndex(index) {
      const n = getDialBallCount();
      if (!n) return;
      const idx = ((index % n) + n) % n;
      setSelectedDialIndex(idx);
    }

    function playBallGif(ball) {
      const gifUrl = ball.dataset.gifUrl;
      const poster = ball.dataset.posterUrl || "";
      if (!gifUrl || !isAnimatedGifUrl(gifUrl)) {
        if (poster) showPlaybackStill(poster);
        return;
      }

      const startGif = () => {
        if (!playbackDisplay) return;
        playbackDisplay.onerror = () => {
          playbackDisplay.onerror = null;
          if (ball._captureFrames?.length) playPlaybackFrameLoop(ball);
          else if (poster) showPlaybackStill(poster);
        };
        const needsRestart = playbackDisplay.src === gifUrl;
        if (needsRestart) {
          playbackDisplay.src = "";
          requestAnimationFrame(() => { showPlaybackStill(gifUrl); });
        } else {
          showPlaybackStill(gifUrl);
        }
      };

      if (ball.dataset.gifReady === "1") {
        startGif();
        return;
      }

      const probe = new Image();
      probe.onload = () => {
        ball.dataset.gifReady = "1";
        if (ball.classList.contains("is-selected")) startGif();
      };
      probe.onerror = () => {
        ball.dataset.gifReady = "0";
        if (ball.classList.contains("is-selected") && ball._captureFrames?.length) {
          playPlaybackFrameLoop(ball);
        } else if (poster) {
          showPlaybackStill(poster);
        }
      };
      probe.src = gifUrl;
    }

    function playBallMemory(ball) {
      if (!ball) {
        clearPlaybackScreen();
        return;
      }
      if (reelPlaying) return;
      playbackPaused = false;
      if (btnPlay) btnPlay.classList.add("is-active");
      const poster = ball.dataset.posterUrl || "";
      if (ball._captureFrames?.length >= 2) {
        playPlaybackFrameLoop(ball);
        return;
      }
      const gifUrl = ball.dataset.gifUrl;
      if (isAnimatedGifUrl(gifUrl)) {
        playBallGif(ball);
        return;
      }
      if (poster) showPlaybackStill(poster);
      else clearPlaybackScreen();
    }

    function applyDialSelection(selectedIdx) {
      if (!memoryBalls) return null;
      const balls = [...memoryBalls.querySelectorAll(".memory-ball")];
      let selectedBall = null;
      balls.forEach((ball, i) => {
        const isSelected = i === selectedIdx;
        const slot = ball.closest(".memory-slot");
        ball.classList.toggle("is-selected", isSelected);
        slot?.classList.toggle("is-selected", isSelected);
        if (isSelected) selectedBall = ball;
      });
      return selectedBall;
    }

    function updateDialFocus() {
      if (!memoryBalls) return;
      const selectedIdx = getSelectedDialIndex();
      const selectedBall = applyDialSelection(selectedIdx);
      if (!selectedBall) {
        clearPlaybackScreen();
        return;
      }
      if (reelPlaying) return;
      const hasLoopMedia = (selectedBall._captureFrames?.length >= 2)
        || isAnimatedGifUrl(selectedBall.dataset.gifUrl);
      if (hasLoopMedia && playbackPaused) {
        playbackPaused = false;
        if (btnPlay) btnPlay.classList.add("is-active");
      }
      if (!playbackPaused && hasLoopMedia) playBallMemory(selectedBall);
      else showSelectedBallPreview(selectedBall);
    }

    function layoutDialBalls(forceSnap = false) {
      if (!memoryBalls || !memoryDial) return;
      const n = getDialBallCount();
      const viewportW = getDialViewportWidth();
      updateMemorySlotTimestamps();
      const captureKey = [...memoryBalls.querySelectorAll(".memory-slot")]
        .map((slot) => slot.dataset.captureAtMs || "")
        .join("|");
      const layoutKey = `${n}-${viewportW}-${captureKey}`;
      if (layoutKey === lastDialLayoutKey && !forceSnap) return;
      lastDialLayoutKey = layoutKey;

      if (memoryDialStrip) {
        memoryDialStrip.style.transition = "none";
        memoryDialStrip.style.transform = "translateX(0px)";
      }
      if (n > 0) {
        selectedDialIndex = clamp(selectedDialIndex, 0, n - 1);
        playheadIndex = clamp(playheadIndex, 0, n - 1);
      } else {
        selectedDialIndex = 0;
        playheadIndex = 0;
      }
      requestAnimationFrame(() => syncTimelinePlayhead(false));
      updateDialFocus();
    }

    function scheduleLayoutDialBalls(attempt = 0, forceSnap = false) {
      layoutDialBalls(forceSnap);
      const needsRetry = getDialBallCount() > 0
        && getDialViewportWidth() < 8
        && attempt < 4;
      if (needsRetry) {
        requestAnimationFrame(() => scheduleLayoutDialBalls(attempt + 1, forceSnap));
      }
    }

    function debouncedScheduleLayoutDialBalls() {
      clearTimeout(dialLayoutTimer);
      dialLayoutTimer = setTimeout(() => scheduleLayoutDialBalls(), 60);
    }

    function bindCanvasLayoutOnce() {
      const onViewportLayoutChange = () => {
        lastCanvasLayoutW = 0;
        lastCanvasLayoutH = 0;
        layoutViewfinderFromFeed();
        syncTimelinePlayhead(false);
      };
      window.addEventListener("resize", () => {
        onViewportLayoutChange();
        debouncedScheduleLayoutDialBalls();
      });
      window.addEventListener("orientationchange", () => {
        setTimeout(onViewportLayoutChange, 350);
      });
    }

    function setBallMedia(ball, mediaUrl, posterUrl) {
      const poster = posterUrl || mediaUrl;
      const isGif = isAnimatedGifUrl(mediaUrl);
      ball.dataset.posterUrl = poster;
      ball.dataset.gifUrl = isGif ? mediaUrl : "";
      ball.dataset.animated = isGif ? "1" : "0";
      ball.dataset.gifReady = "0";
      const img = document.createElement("img");
      img.alt = "Core memory";
      img.decoding = "async";
      img.src = poster;
      ball.appendChild(img);
    }

    function resolveBallPreview(mediaUrl, captureFrames) {
      if (mediaUrl) return mediaUrl;
      if (captureFrames?.length) return previewFromFrames(captureFrames);
      return frameToPreviewUrl(cloneFrameCanvas());
    }

    function addCoreMemoryBall(mediaUrl, posterUrl, mood = "happy", captureFrames = null) {
      if (!memoryBalls || !memoryRack) return null;
      const preview = resolveBallPreview(mediaUrl, captureFrames);
      if (!preview) return null;

      memoryRack.classList.remove("empty");
      updatePlaybackIdleVisibility();
      const slot = document.createElement("div");
      slot.className = "memory-slot";
      const prevSlot = memoryBalls.lastElementChild;
      const prevCaptureMs = Number(prevSlot?.dataset?.captureAtMs || "");
      const prevBall = prevSlot?.querySelector(".memory-ball");
      const prevPlaybackMs = parseInt(prevBall?.dataset?.playbackMs || "", 10);
      const inferredGapMs = Number.isFinite(prevPlaybackMs) && prevPlaybackMs > 0
        ? prevPlaybackMs
        : 4000;
      const captureAtMs = Number.isFinite(prevCaptureMs)
        ? Math.max(Date.now(), prevCaptureMs + inferredGapMs)
        : Date.now();
      slot.dataset.captureAtMs = String(captureAtMs);
      const ball = document.createElement("div");
      ball.className = "memory-ball is-new";
      applyBallMood(ball, mood);
      slot.appendChild(ball);
      const timeEl = document.createElement("time");
      timeEl.className = "memory-slot-time";
      slot.appendChild(timeEl);
      const newIdx = appendMemorySlot(slot);
      setBallMedia(ball, preview, posterUrl || preview);
      if (captureFrames?.length) attachBallCaptureFrames(ball, captureFrames);
      updateMemorySlotTimestamps();
      scheduleLayoutDialBalls(0, true);
      requestAnimationFrame(() => {
        reelPlaying = false;
        playbackPaused = false;
        reelProgrammatic = true;
        snapDialToIndex(newIdx);
        reelProgrammatic = false;
        if (btnPlay) btnPlay.classList.add("is-active");
        setTimeout(() => ball.classList.remove("is-new"), 480);
      });
      return ball;
    }

    function onDialPointerDown(e) {
      if (!memoryDial || getDialBallCount() === 0) return;
      if (reelPlaying) pausePlayback();
      dialDragging = true;
      dialPointerId = e.pointerId;
      memoryDial.classList.add("is-dragging");
      memoryDial.setPointerCapture(e.pointerId);
      setSelectedDialIndex(getDialIndexAtClientX(e.clientX));
    }

    function onDialPointerMove(e) {
      if (!dialDragging || e.pointerId !== dialPointerId) return;
      setSelectedDialIndex(getDialIndexAtClientX(e.clientX));
    }

    function onDialPointerUp(e) {
      if (!dialDragging || e.pointerId !== dialPointerId) return;
      dialDragging = false;
      dialPointerId = null;
      memoryDial.classList.remove("is-dragging");
      try { memoryDial.releasePointerCapture(e.pointerId); } catch (_) {}
      setSelectedDialIndex(getDialIndexAtClientX(e.clientX));
      markUserReelStart(getSelectedDialIndex());
      playbackPaused = true;
    }

    function onDialWheel(e) {
      if (!memoryDial || getDialBallCount() === 0) return;
      e.preventDefault();
      if (reelPlaying) pausePlayback();
      const n = getDialBallCount();
      const idx = getSelectedDialIndex();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      const next = delta > 0 ? (idx - 1 + n) % n : (idx + 1) % n;
      markUserReelStart(next);
      playbackPaused = true;
      snapDialToIndex(next);
    }

    function onMemoryBallActivate(ball) {
      if (!ball || !memoryBalls) return;
      const balls = [...memoryBalls.querySelectorAll(".memory-ball")];
      const idx = balls.indexOf(ball);
      if (idx < 0) return;
      if (reelPlaying) pausePlayback();
      markUserReelStart(idx);
      playbackPaused = true;
      reelProgrammatic = true;
      snapDialToIndex(idx);
      reelProgrammatic = false;
    }

    function initMemoryDial() {
      if (!memoryDial) return;
      memoryDial.addEventListener("pointerdown", onDialPointerDown);
      memoryDial.addEventListener("pointermove", onDialPointerMove);
      memoryDial.addEventListener("pointerup", onDialPointerUp);
      memoryDial.addEventListener("pointercancel", onDialPointerUp);
      memoryDial.addEventListener("wheel", onDialWheel, { passive: false });
      memoryBalls?.addEventListener("click", (e) => {
        const ball = e.target.closest(".memory-ball");
        if (!ball) return;
        onMemoryBallActivate(ball);
      });
      window.addEventListener("resize", debouncedScheduleLayoutDialBalls);
      scheduleLayoutDialBalls(0, true);
    }

    const PLAYBACK_IDLE_MSG = "Hold your best smile to form a core memory!";

    const ONBOARDING_LINES = [
      "Some moments you'll look back on and say, \"I needed that\".",
      "CoreCam reads the energy on your face and saves them for you before you even knew they were happening."
    ];
    const INFO_OVERLAY_MSG = ONBOARDING_LINES[1];

    function delay(ms) {
      return new Promise((resolve) => { setTimeout(resolve, ms); });
    }

    async function cancellableDelay(ms) {
      const end = performance.now() + ms;
      while (performance.now() < end) {
        if (onboardingDismissLock) return;
        await delay(Math.min(40, Math.max(0, end - performance.now())));
      }
    }

    function createLcdTypewriterFrame(container, text, { charMs = 45 } = {}) {
      return new Promise((resolve) => {
        if (!container) {
          resolve();
          return;
        }
        container.replaceChildren();
        const track = document.createElement("span");
        track.className = "typewriter-track lcd-typewriter-track";
        const charSpans = [];
        for (const ch of text) {
          const span = document.createElement("span");
          span.className = "typewriter-char";
          span.textContent = ch;
          track.appendChild(span);
          charSpans.push(span);
        }
        const cursor = document.createElement("span");
        cursor.className = "typewriter-cursor lcd-typewriter-cursor";
        cursor.setAttribute("aria-hidden", "true");
        cursor.textContent = "▋";
        track.insertBefore(cursor, charSpans[0] || null);
        container.appendChild(track);

        let index = 0;
        function tick() {
          if (playbackIdleLoopAbort || getDialBallCount() > 0) {
            resolve();
            return;
          }
          if (index >= charSpans.length) {
            track.appendChild(cursor);
            resolve();
            return;
          }
          charSpans[index].classList.add("is-revealed");
          index += 1;
          if (index < charSpans.length) {
            track.insertBefore(cursor, charSpans[index]);
          } else {
            track.appendChild(cursor);
          }
          setTimeout(tick, charMs);
        }
        tick();
      });
    }

    let playbackIdleLoopAbort = false;

    async function runPlaybackIdleTypewriterLoop() {
      if (!playbackIdleBody || getDialBallCount() > 0) return;
      playbackIdleLoopAbort = false;

      while (!playbackIdleLoopAbort && getDialBallCount() === 0) {
        await createLcdTypewriterFrame(playbackIdleBody, PLAYBACK_IDLE_MSG, { charMs: 45 });
        if (playbackIdleLoopAbort || getDialBallCount() > 0) break;
        await delay(3200 + Math.floor(Math.random() * 800));
        if (playbackIdleLoopAbort || getDialBallCount() > 0) break;
        playbackIdleBody.replaceChildren();
      }
    }

    function stopPlaybackIdleTypewriter() {
      playbackIdleLoopAbort = true;
      playbackIdleBody?.replaceChildren();
    }

    function createTypewriter(container, text, { charMs = 40, cursorClass = "typewriter-cursor" } = {}) {
      return new Promise((resolve) => {
        if (!container) {
          resolve();
          return;
        }
        container.replaceChildren();
        const track = document.createElement("span");
        track.className = "typewriter-track";
        const charSpans = [];
        for (const ch of text) {
          const span = document.createElement("span");
          span.className = "typewriter-char";
          span.textContent = ch;
          track.appendChild(span);
          charSpans.push(span);
        }
        const cursor = document.createElement("span");
        cursor.className = cursorClass;
        cursor.setAttribute("aria-hidden", "true");
        cursor.textContent = "▌";
        track.insertBefore(cursor, charSpans[0] || null);
        container.appendChild(track);

        let index = 0;
        function tick() {
          if (onboardingDismissLock) {
            resolve();
            return;
          }
          if (index >= charSpans.length) {
            cursor.classList.add("is-done");
            track.appendChild(cursor);
            resolve();
            return;
          }
          charSpans[index].classList.add("is-revealed");
          index += 1;
          if (index < charSpans.length) {
            track.insertBefore(cursor, charSpans[index]);
          } else {
            track.appendChild(cursor);
          }
          setTimeout(tick, charMs);
        }
        tick();
      });
    }

    let onboardingTapResolver = null;
    let onboardingDismissLock = false;

    function resetOnboardingOverlay() {
      if (!onboardingOverlay) return;
      onboardingDismissLock = false;
      onboardingTapResolver = null;
      onboardingOverlay.classList.remove("is-fading", "is-done", "is-ready", "is-info-only");
      onboardingOverlay.removeAttribute("aria-hidden");
      onboardingOverlay.setAttribute("aria-labelledby", "onboardingLine1");
      line2Reset();
      onboardingTapHint?.classList.remove("is-visible");
    }

    function line2Reset() {
      const line2 = document.getElementById("onboardingLine2");
      line2?.classList.remove("is-visible");
      if (line2) line2.replaceChildren();
    }

    function waitForOnboardingTap() {
      return new Promise((resolve) => {
        onboardingTapResolver = resolve;
      });
    }

    function handleOnboardingOverlayClose() {
      if (!onboardingOverlay || onboardingOverlay.classList.contains("is-done")) return;
      if (onboardingOverlay.classList.contains("is-fading")) return;
      if (onboardingDismissLock) return;
      onboardingDismissLock = true;
      const resolve = onboardingTapResolver;
      onboardingTapResolver = null;
      resolve?.();
    }

    function handleOnboardingOverlayTap() {
      if (!onboardingOverlay?.classList.contains("is-ready")) return;
      handleOnboardingOverlayClose();
    }

    async function dismissOnboardingOverlay(onDismiss) {
      if (!onboardingOverlay) return;
      onboardingOverlay.classList.remove("is-ready");
      onboardingOverlay.classList.add("is-fading");
      onDismiss?.();
      await delay(1200);
      onboardingOverlay.classList.add("is-done");
      onboardingOverlay.setAttribute("aria-hidden", "true");
      viewport?.classList.add("is-live");
    }

    async function dismissInfoOverlay() {
      if (!onboardingOverlay) return;
      onboardingOverlay.classList.remove("is-ready");
      onboardingOverlay.classList.add("is-fading");
      await delay(600);
      onboardingOverlay.classList.remove("is-fading", "is-info-only");
      onboardingOverlay.classList.add("is-done");
      onboardingOverlay.setAttribute("aria-hidden", "true");
      onboardingOverlay.setAttribute("aria-labelledby", "onboardingLine1");
      line2Reset();
    }

    async function showInfoOverlay() {
      const line1 = document.getElementById("onboardingLine1");
      const line2 = document.getElementById("onboardingLine2");
      if (!onboardingOverlay || !line2) return;
      if (!onboardingOverlay.classList.contains("is-done")) return;

      onboardingDismissLock = false;
      onboardingTapResolver = null;

      onboardingOverlay.classList.remove("is-fading", "is-done");
      onboardingOverlay.removeAttribute("aria-hidden");
      const dismissed = waitForOnboardingTap();

      line1?.replaceChildren();
      line2.textContent = INFO_OVERLAY_MSG;
      line2.classList.add("is-visible");
      onboardingOverlay.setAttribute("aria-labelledby", "onboardingLine2");
      onboardingOverlay.classList.add("is-info-only", "is-ready");
      onboardingOverlay.focus({ preventScroll: true });

      await dismissed;
      await dismissInfoOverlay();
    }

    async function runOnboardingTypewriterSequence(line1, line2) {
      await cancellableDelay(500);
      if (onboardingDismissLock) return;
      await createTypewriter(line1, ONBOARDING_LINES[0], {
        charMs: 44,
        cursorClass: "typewriter-cursor vf-intro-cursor"
      });
      if (onboardingDismissLock) return;
      await cancellableDelay(700);
      if (onboardingDismissLock) return;
      line2?.classList.add("is-visible");
      await cancellableDelay(350);
      if (onboardingDismissLock) return;
      await createTypewriter(line2, ONBOARDING_LINES[1], {
        charMs: 36,
        cursorClass: "typewriter-cursor vf-intro-cursor"
      });
      if (onboardingDismissLock) return;
      onboardingOverlay?.classList.add("is-ready");
      onboardingOverlay?.focus({ preventScroll: true });
    }

    async function showOnboardingOverlay({ bootCamera = false, onDismiss } = {}) {
      const line1 = document.getElementById("onboardingLine1");
      const line2 = document.getElementById("onboardingLine2");

      resetOnboardingOverlay();
      const dismissed = waitForOnboardingTap();

      const cameraBoot = bootCamera ? bootCameraAndModels() : null;
      if (bootCamera) resizeCanvases();

      runOnboardingTypewriterSequence(line1, line2);

      await dismissed;
      await dismissOnboardingOverlay(onDismiss);

      if (cameraBoot) await cameraBoot;
    }

    async function runOnboardingIntro(onLiveStart) {
      await showOnboardingOverlay({ bootCamera: true, onDismiss: onLiveStart });
    }

    function initOnboardingOverlay() {
      if (!onboardingOverlay || onboardingOverlay.dataset.bound === "1") return;
      onboardingOverlay.dataset.bound = "1";

      const onDismissTap = (e) => {
        if (!onboardingOverlay.classList.contains("is-ready")) return;
        if (onboardingOverlay.classList.contains("is-fading")) return;
        e.preventDefault();
        handleOnboardingOverlayTap();
      };

      onboardingOverlay.addEventListener("click", onDismissTap);
      onboardingOverlay.addEventListener("pointerup", onDismissTap);
      onboardingOverlay.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          handleOnboardingOverlayTap();
        }
      });

      btnOnboardingInfo?.addEventListener("click", (e) => {
        e.stopPropagation();
        showInfoOverlay();
      });

      btnOnboardingClose?.addEventListener("click", (e) => {
        e.stopPropagation();
        handleOnboardingOverlayClose();
      });
    }

    function setViewfinderAlert(message) {
      if (!vfAlert || !vfAlertLine) return;
      vfAlertLine.textContent = message;
      vfAlert.hidden = false;
      vfAlert.classList.add("is-visible");
      vfGuidance?.classList.add("is-muted");
    }

    function clearViewfinderAlert() {
      if (!vfAlert) return;
      vfAlert.hidden = true;
      vfAlert.classList.remove("is-visible");
      if (vfAlertLine) vfAlertLine.textContent = "";
      vfGuidance?.classList.remove("is-muted");
    }

    function updatePlaybackIdleVisibility() {
      const hasMemories = getDialBallCount() > 0;
      playbackViewport?.classList.toggle("has-memories", hasMemories);
      if (hasMemories) stopPlaybackIdleTypewriter();
    }

    function initPlaybackIdleMessage() {
      if (!playbackIdleBody || getDialBallCount() > 0) return;

      setTimeout(() => {
        if (getDialBallCount() > 0) return;
        runPlaybackIdleTypewriterLoop();
      }, 500);
    }

    function initDeviceControls() {
      chipCapture?.addEventListener("click", () => {
        if (captureBusy || captureFinalizing) return;
        if (video.readyState < 2) {
          if (footerStatus) footerStatus.textContent = "Camera not ready — wait a moment";
          return;
        }
        queuePeakMemoryCapture(true);
      });

      btnPrevRow?.addEventListener("click", () => stepMemoryRow(-1));
      btnNextRow?.addEventListener("click", () => stepMemoryRow(1));

      btnSlow?.addEventListener("click", () => {
        setPlaybackSpeedIndex(playbackSpeedIndex - 1);
      });
      btnFast?.addEventListener("click", () => {
        setPlaybackSpeedIndex(playbackSpeedIndex + 1);
      });

      btnPlay?.addEventListener("click", () => {
        if (!playbackPaused && reelPlaying) {
          pausePlayback();
          return;
        }
        if (playbackPaused) resumePlayback();
      });

      btnStopPause?.addEventListener("click", () => pausePlayback());
    }

    async function waitForVideoReady() {
      if (video.readyState >= 2 && video.videoWidth > 0) return;
      await new Promise((resolve) => {
        const done = () => {
          if (video.videoWidth > 0) resolve();
        };
        video.addEventListener("loadeddata", done, { once: true });
        video.addEventListener("loadedmetadata", done, { once: true });
        setTimeout(resolve, 2500);
      });
    }

    async function initWebcam() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      await waitForVideoReady();
      layoutViewfinderFromFeed();
      console.log("webcam ready", video.videoWidth, "x", video.videoHeight);
    }

    async function bootCameraAndModels() {
      try {
        if (footerStatus) footerStatus.textContent = "Acquiring sensor…";
        await initWebcam();
        rebuildActiveLUT(true);
        if (footerStatus) footerStatus.textContent = "Camera live — loading models…";
      } catch (error) {
        console.error("Webcam init error", error);
        setViewfinderAlert("Camera error — check permission and reload");
        if (footerStatus) footerStatus.textContent = "Sensor offline";
        requestAnimationFrame(renderFrame);
        return;
      }

      try {
        await loadModels();
        modelsReady = true;
        await runFaceDetection();
        startDetectionLoop();
        layoutViewfinderFromFeed();
        clearViewfinderAlert();
        if (footerStatus) footerStatus.textContent = "Sensor online · radiometric feed active";
      } catch (error) {
        console.error("Model load error", error);
        setViewfinderAlert("Expression models unavailable — feed still live");
        if (footerStatus) footerStatus.textContent = "Camera on — limited sensing";
        layoutViewfinderFromFeed();
        requestAnimationFrame(renderFrame);
      }
    }

    async function init() {
      finishCapture();
      frameRing = [];

      initOnboardingOverlay();

      await runOnboardingIntro(() => {
        ensureThermalLUTs();
        layoutViewfinderFromFeed();
        bindCanvasLayoutOnce();
        updateClockHands();
        setInterval(updateClockHands, 1000);
        initDeviceControls();
        initMemoryDial();
        initEnergyLedBar();
        initPlaybackIdleMessage();
        updatePlaybackIdleVisibility();
        requestAnimationFrame(renderFrame);
      });
    }

    init().catch((error) => {
      console.error("Fatal init error", error);
      setViewfinderAlert("Failed to start — see console");
      if (footerStatus) footerStatus.textContent = "Startup failed";
    });
  </script>
</body>
